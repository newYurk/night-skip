<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#03060c">
<title>Лягушка по воде</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Barlow+Condensed:wght@400;500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Barlow+Condensed:wght@400;500&display=swap"></noscript>
<style>
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --ink: #03060c;
    --cool: #7ed6e6;
    --text: #cfe6ef;
    --muted: rgba(176, 205, 219, 0.55);
    --line: rgba(126, 214, 230, 0.18);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--ink); color: var(--text);
    font-family: "Barlow Condensed", "Avenir Next Condensed", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none; touch-action: none;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--ink); }
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    padding: calc(18px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) 0 calc(20px + env(safe-area-inset-left));
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 15px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted); pointer-events: none;
  }
  #hud .count {
    font-family: "Cormorant Garamond", Georgia, serif; font-size: 34px;
    letter-spacing: 0.04em; color: var(--text); text-transform: none;
    font-variant-numeric: tabular-nums; line-height: 1;
  }
  #hud .combo { color: var(--cool); opacity: 0; transition: opacity 0.25s ease; }
  #hud .combo.on { opacity: 1; }
  #card {
    position: fixed; left: 0; right: 0;
    top: calc(64px + env(safe-area-inset-top));
    bottom: calc(112px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    text-align: center; gap: 6px; pointer-events: none; padding: 0 24px;
    transition: opacity 0.4s ease; opacity: 1;
  }
  #card .top { display: grid; justify-items: center; gap: 6px; padding-top: var(--card-pad, 12vh); }
  #card.hidden { opacity: 0; }
  #card .big {
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 300;
    font-size: clamp(64px, 22vw, 132px); line-height: 0.9; color: var(--text);
    font-variant-numeric: tabular-nums; text-shadow: 0 0 44px rgba(150, 215, 235, 0.22);
  }
  #card .label { font-size: 14px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); }
  #card .best { font-size: 15px; letter-spacing: 0.24em; color: rgba(176, 205, 219, 0.4); text-transform: uppercase; }
  #card .hint { margin-top: 0; font-size: 14px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
  #card .hint span { display: block; margin-top: 8px; text-wrap: balance; letter-spacing: 0.06em; text-transform: none; font-size: 14px; color: rgba(176, 205, 219, 0.42); line-height: 1.5; }
  @keyframes breathe { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.9; } }
  #card .hint strong { font-weight: 500; animation: breathe 2.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { #card .hint strong { animation: none; } }

  #seas {
    position: fixed; left: 0; right: 0; bottom: calc(46px + env(safe-area-inset-bottom));
    display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; padding: 0 12px; z-index: 4;
    transition: opacity 0.35s ease;
  }
  #seas.hidden { opacity: 0; pointer-events: none; }
  #seas button {
    font: inherit; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase;
    padding: 10px 16px; min-height: 44px; min-width: 132px; cursor: pointer; border-radius: 2px;
    border: 1px solid transparent; background: transparent; color: rgba(176, 205, 219, 0.4);
  }
  #seas button[aria-pressed="true"] { color: var(--text); border-color: var(--line); }
  #seas button:focus-visible, #gear:focus-visible, .panel button:focus-visible { outline: 2px solid var(--cool); outline-offset: 2px; }

  #gear {
    position: fixed; left: calc(14px + env(safe-area-inset-left)); bottom: calc(14px + env(safe-area-inset-bottom)); width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid var(--line); background: rgba(6, 14, 24, 0.6); color: var(--muted);
    display: grid; place-items: center; cursor: pointer; z-index: 5; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; transform: translateY(101%);
    transition: transform 0.32s cubic-bezier(0.22, 0.8, 0.3, 1);
    background: rgba(5, 12, 22, 0.94); border-top: 1px solid var(--line);
    padding: 16px 18px calc(18px + env(safe-area-inset-bottom)); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    max-height: 78vh; overflow-y: auto;
  }
  .panel.open { transform: translateY(0); }
  .panel h2 {
    margin: 0 0 4px; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 400;
    font-size: 22px; letter-spacing: 0.02em; color: var(--text);
  }
  .panel p.note { margin: 0 0 14px; font-size: 14px; color: var(--muted); line-height: 1.45; max-width: 62ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 10px 22px; }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 10px; }
  .row label { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .row output { font-size: 14px; color: var(--cool); font-variant-numeric: tabular-nums; }
  .row input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: #7ed6e6; height: 22px; }
  .toggles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .toggles button {
    font: inherit; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
    padding: 8px 14px; min-height: 44px; border-radius: 2px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--muted);
  }
  .toggles button[aria-pressed="true"] { color: var(--ink); background: var(--cool); border-color: var(--cool); }
  .panel .close {
    margin-top: 14px; width: 100%; min-height: 44px; font: inherit; font-size: 14px;
    letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 2px;
  }
</style>

<canvas id="stage"></canvas>

<div id="hud" aria-hidden="true">
  <div class="count" id="count">0</div>
  <div class="combo" id="combo">чисто ×0</div>
</div>

<div id="card">
  <div class="top">
    <div class="label" id="cardLabel">Лягушка</div>
    <div class="big" id="cardBig">0</div>
    <div class="best" id="cardBest"></div>
  </div>
  <div class="hint" id="cardHint"><strong>тап — бросок</strong><span>тапай в момент касания воды<br>тапнул сбоку от овцы — свернёт туда</span></div>
</div>

<div id="seas" aria-label="Море"></div>

<button id="gear" aria-label="Настройки прототипа">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"></circle>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.5.55.87 1.06 1H21a2 2 0 1 1 0 4h-.09c-.51.13-.92.5-1.06 1z"></path>
  </svg>
</button>

<section class="panel" id="panel" aria-label="Параметры прототипа">
  <h2>Крутилки прототипа</h2>
  <p class="note">Открытые вопросы дизайна, вынесенные в ползунки. Меняешь — заход перезапускается.</p>
  <div class="grid" id="sliders"></div>
  <div class="toggles" id="toggles"></div>
  <div class="toggles">
    <button type="button" id="hardReload">обновить игру (сбросить кеш)</button>
    <button type="button" id="settingsReset">вернуть стандартные настройки</button>
  </div>
  <h2 style="margin-top:16px">Журнал заходов</h2>
  <p class="note" id="logText" style="white-space:pre-line;font-variant-numeric:tabular-nums"></p>
  <h2 style="margin-top:16px">Статистика устройства</h2>
  <p class="note" id="statsText" style="white-space:pre-line;font-variant-numeric:tabular-nums"></p>
  <div class="toggles">
    <button type="button" id="statsCopy">скопировать</button>
    <button type="button" id="statsReset">сбросить</button>
  </div>
  <button class="close" id="closePanel">Играть</button>
</section>

<script>
(function () {
  "use strict";

  var BUILD = "2026-08-20 · два моря";

  var cv = document.getElementById("stage");
  var ctx = cv.getContext("2d", { alpha: false });
  var W = 0, H = 0, DPR = 1;

  var P = {
    windowPct: 26, windowFloor: 115, perfectPct: 34,
    latency: ('ontouchstart' in window) ? 80 : 25,
    hop: 7.6, decay: 0.918, perfectDecay: 0.962,
    gravity: 27, speed: 13, speedUp: 1.4,
    waveAmp: 0.22, waveLen: 11, wave2: 0.62, waveSpeed: 2.2, waveGain: 3.2,
    ceiling: 8.8, fatigue: 0.10, digAngle: 54, ringAmp: 0.1,
    push: 0.55, viscosity: 0.07, hopRef: 5.5, tide: 0.85, swellLen: 52,
    steerDead: 0.16, steerMax: 3.4, steerEase: 3.2,
    pitchMax: 26, assist: 0.78, goodAttack: 18, aimSpread: 4.5,
    lift: 1.55, press: 0.72
  };
  var OPT = { aim: true, mirror: true, sound: true, waves: true, ghost: true, gestures: true, tilt: false, tapsteer: false, attitude: false, invert: false, stars: false, echo: true, sheep: true, showErr: false };
  var tiltInited = false;
  // стандартные значения — для кнопки сброса; custom — ручные правки игрока,
  // они главнее моря и «сегодня» и переживают переключения
  var PDEF = {}, OPTDEF = {}, custom = {};
  Object.keys(P).forEach(function (k) { PDEF[k] = P[k]; });
  Object.keys(OPT).forEach(function (k) { OPTDEF[k] = OPT[k]; });
  function saveCustom() {
    try { localStorage.setItem("ns_custom", JSON.stringify(custom)); } catch (e) {}
  }
  function restoreCustomVals() {
    try {
      var d = JSON.parse(localStorage.getItem("ns_custom") || "null");
      if (d) Object.keys(d).forEach(function (k) {
        if (!(k in P) || typeof d[k] !== "number" || !isFinite(d[k])) return;
        var sl = SLIDERS.filter(function (x) { return x.k === k; })[0];
        var v = sl ? Math.max(sl.min, Math.min(sl.max, d[k])) : d[k];
        custom[k] = v; P[k] = v;
      });
    } catch (e) {}
  }
  function saveOpts() {
    try { localStorage.setItem("ns_opts", JSON.stringify({ o: OPT, lat: P.latency })); } catch (e) {}
  }
  (function restoreOpts() {
    try {
      var d = JSON.parse(localStorage.getItem("ns_opts") || "null");
      if (d && d.o) Object.keys(OPT).forEach(function (k) { if (typeof d.o[k] === "boolean") OPT[k] = d.o[k]; });
      if (d && typeof d.lat === "number") P.latency = d.lat;
    } catch (e) {}
  })();

  // Миры = только числа и цвета. Ни одного спрайта: проверка идеи «разные планеты» даром.
  // В бурное море камень бросают площе — иначе он сразу зароется в первый же гребень.
  var SEAS = [
    { id: "calm", name: "штиль", amp: 0.09, speed: 1.3, w2: 0.28, len: 15, hop: 8.1, g: 27, fwd: 13, assist: 0.9, varScale: 0.7,
      pal: { sky: ["#050b18", "#0d1c31"], gr: ["#0a1526", "#050c16", "#02050a"], line: "150,226,242", glow: "150,232,245", hot: "230,252,255", stone: "#33485a" } },
    { id: "swell", name: "волнение", amp: 0.34, speed: 2.2, w2: 0.55, len: 16, hop: 7.2, g: 27, fwd: 13, assist: 0.76, varScale: 0.55,
      pal: { sky: ["#050b18", "#0d1c31"], gr: ["#0a1526", "#050c16", "#02050a"], line: "150,226,242", glow: "150,232,245", hot: "230,252,255", stone: "#33485a" } }
  ];
  var sea = SEAS[1];
  var PAL = sea.pal;

  var SLIDERS = [
    { k: "latency", label: "компенсация задержки тапа", min: 0, max: 160, step: 5, unit: " мс" },
    { k: "windowPct", label: "окно тапа", min: 8, max: 45, step: 1, unit: " %" },
    { k: "windowFloor", label: "пол окна", min: 40, max: 220, step: 5, unit: " мс" },
    { k: "perfectPct", label: "«чисто» от окна", min: 15, max: 70, step: 1, unit: " %" },
    { k: "hop", label: "высота отскока", min: 3.5, max: 9, step: 0.1, unit: "" },
    { k: "decay", label: "затухание", min: 0.86, max: 0.99, step: 0.005, unit: "" },
    { k: "perfectDecay", label: "затухание при «чисто»", min: 0.9, max: 0.998, step: 0.002, unit: "" },
    { k: "waveGain", label: "сила склона", min: 0, max: 7, step: 0.1, unit: "" },
    { k: "ceiling", label: "потолок помощи воды", min: 2, max: 9, step: 0.1, unit: "" },
    { k: "fatigue", label: "усталость камня", min: 0, max: 0.5, step: 0.01, unit: " %" },
    { k: "push", label: "точность касания → энергия", min: 0, max: 1.2, step: 0.05, unit: "" },
    { k: "viscosity", label: "вязкость воды", min: 0, max: 0.2, step: 0.005, unit: "" },
    { k: "hopRef", label: "порог глиссирования", min: 2, max: 9, step: 0.1, unit: "" },
    { k: "tide", label: "приливное течение", min: 0, max: 2.5, step: 0.05, unit: "" },
    { k: "swellLen", label: "длина своей зыби", min: 15, max: 90, step: 1, unit: "" },
    { k: "digAngle", label: "угол, на котором зарывается", min: 25, max: 70, step: 1, unit: "°" },
    { k: "ringAmp", label: "эхо отскоков: высота", min: 0, max: 0.3, step: 0.01, unit: "" },

    { k: "steerDead", label: "мёртвая зона руля", min: 0, max: 0.45, step: 0.01, unit: "" },
    { k: "steerMax", label: "сила поворота", min: 0.5, max: 7, step: 0.1, unit: "" },
    { k: "steerEase", label: "плавность поворота", min: 1, max: 8, step: 0.1, unit: "" },
    { k: "gravity", label: "гравитация", min: 10, max: 34, step: 1, unit: "" },
    { k: "speed", label: "скорость", min: 7, max: 22, step: 0.5, unit: "" },
    { k: "speedUp", label: "разгон за отскок", min: 0, max: 4, step: 0.1, unit: " %" }
  ];
  restoreCustomVals();

  var TOGGLES = [
    { k: "sheep", label: "овца" },
    { k: "showErr", label: "ошибка тапа" },
    { k: "aim", label: "прицел" },
    { k: "mirror", label: "отражение" },
    { k: "echo", label: "эхо отскоков" },
    { k: "ghost", label: "призрак" },
    { k: "sound", label: "звук" }
  ];

  var CAM_Y = 2.0, FOLLOW = 7.0, FOLLOW_IDLE = 5.6, STEP = 1 / 240;
  var followNow = FOLLOW_IDLE;
  var focal = 700, horizon = 0, moonR = 40;

  // качество: если устройство не тянет, игра сама снижает детализацию
  var TIERS = [
    { dpr: 2,    stepZ: 1.3, cols: 13, sparks: 150, dist: 130 },
    { dpr: 1.5,  stepZ: 1.7, cols: 10, sparks: 100, dist: 110 },
    { dpr: 1.25, stepZ: 2.2, cols: 8,  sparks: 70,  dist: 90 }
  ];
  var tier = 0, Q = TIERS[0];

  // градиенты дороги в создании — собираем один раз на resize/смену палитры
  var G = {};
  function rebuildGradients() {
    G.sky = ctx.createLinearGradient(0, 0, 0, horizon);
    G.sky.addColorStop(0, PAL.sky[0]); G.sky.addColorStop(1, PAL.sky[1]);
    G.water = ctx.createLinearGradient(0, horizon, 0, H);
    G.water.addColorStop(0, PAL.gr[0]); G.water.addColorStop(0.45, PAL.gr[1]); G.water.addColorStop(1, PAL.gr[2]);
    G.vignette = ctx.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.28, W / 2, H * 0.55, Math.max(W, H) * 0.78);
    G.vignette.addColorStop(0, "rgba(0,0,0,0)"); G.vignette.addColorStop(1, "rgba(0,2,6,0.72)");
    G.moonGlow = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
    G.moonGlow.addColorStop(0, "rgba(" + PAL.hot + ",0.20)"); G.moonGlow.addColorStop(1, "rgba(" + PAL.hot + ",0)");
    G.moonDisc = ctx.createRadialGradient(-0.25, -0.25, 0.1, 0, 0, 1);
    G.moonDisc.addColorStop(0, "rgba(" + PAL.hot + ",0.95)");
    G.moonDisc.addColorStop(0.72, "rgba(" + PAL.hot + ",0.82)");
    G.moonDisc.addColorStop(1, "rgba(" + PAL.hot + ",0.5)");
    G.moonPath = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
    G.moonPath.addColorStop(0, "rgba(" + PAL.hot + ",0.16)");
    G.moonPath.addColorStop(0.35, "rgba(" + PAL.hot + ",0.07)");
    G.moonPath.addColorStop(1, "rgba(" + PAL.hot + ",0)");
    G.flash = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
    G.flash.addColorStop(0, "rgba(" + PAL.hot + ",0.75)");
    G.flash.addColorStop(0.35, "rgba(" + PAL.glow + ",0.28)");
    G.flash.addColorStop(1, "rgba(" + PAL.glow + ",0)");
    G.halo = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
    G.halo.addColorStop(0, "rgba(" + PAL.glow + ",0.28)"); G.halo.addColorStop(1, "rgba(" + PAL.glow + ",0)");
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, Q.dpr);
    // размер берём у самого холста: он растянут CSS на весь экран, поэтому
    // никакая рассинхронизация с браузерной панелью не оставит чёрных полей
    var r = cv.getBoundingClientRect();
    W = Math.round(r.width) || window.innerWidth;
    H = Math.round(r.height) || window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    focal = Math.max(H * 0.82, 380);
    // безопасный отступ сверху: под чёлкой/островом луне не место
    var cs = getComputedStyle(document.documentElement);
    var safeTop = parseFloat(cs.getPropertyValue("--sat")) || 0;
    var mr = Math.max(18, Math.min(W * 0.13, H * 0.082));
    // луна рисуется на высоте horizon*0.40, значит её верх = horizon*0.40 − radius.
    // требуем, чтобы верх был ниже островка с запасом; если не влезает — уменьшаем луну
    var maxHorizon = H * 0.44;
    var need = (safeTop + 14 + mr) / 0.40;
    if (need > maxHorizon) {
      mr = Math.max(14, maxHorizon * 0.40 - safeTop - 14);
      need = (safeTop + 14 + mr) / 0.40;
    }
    horizon = Math.max(H * 0.30, Math.min(need, maxHorizon));
    moonR = mr;
    var moonBottom = horizon * 0.40 + mr;
    // отступ считаем от фактической рамки карточки, а не от предположений о safe-area
    var cardEl = document.getElementById("card");
    var cardTop = cardEl ? cardEl.getBoundingClientRect().top : 64;
    document.documentElement.style.setProperty(
      "--card-pad", Math.max(0, Math.round(moonBottom + 18 - cardTop)) + "px");
    rebuildGradients();
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 300); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", resize);
    window.visualViewport.addEventListener("scroll", resize);
  }

  // звёздное небо: генерится один раз, слегка смещается вслед за камерой
  var STARS = [];
  (function () {
    for (var i = 0; i < 130; i++) {
      STARS.push({ x: Math.random(), y: Math.random(), m: 0.25 + Math.random() * 0.75, p: Math.random() * 9 });
    }
  })();

  function seedSparks(z0) {
    sparks.length = 0;
    for (var i = 0; i < Q.sparks; i++) sparks.push({ x: (Math.random() - 0.5) * 70, z: z0 + Math.random() * 200, p: Math.random() });
  }

  // отражения звёзд на воде — цели для отскоков: попал по отражению, звезда зажглась
  var refl = [], litOrder = [];
  function seedReflections() {
    refl.length = 0; litOrder.length = 0;
    for (var i = 1; i <= 16; i++) {
      refl.push({ x: (Math.random() - 0.5) * 7, z: 11 + i * 16 + Math.random() * 8, lit: false, big: Math.random() < 0.2, flare: 0 });
    }
  }

  // созвездие лежит на воде ТОЙ ЖЕ фигурой, что в небе: вода отражает задание.
  // фигура вытянута вдоль курса, пойманные звёзды в ней уже горят
  var questInst = [], questNextZ = 0;
  function spawnFigure() {
    var q = quest();
    questInst = [];
    var z0 = questNextZ;
    for (var i = 0; i < q.pts.length; i++) {
      var e = { x: (q.pts[i][1] - 0.5) * 10, z: z0 + q.pts[i][0] * 55, lit: !!questCaught[i], big: false, flare: 0, quest: i };
      refl.push(e);
      questInst.push(e);
    }
    questNextZ = z0 + 115;
  }

  function newRun() {
    S = {
      phase: "ready", t: 0, acc: 0,
      x: 0, y: 0.55, z: 0, vx: 0, vy: P.hop, vz: P.speed, hop: P.hop,
      camX: 0,
      nextContact: 0, interval: 0.6, fullInterval: 0.6,
      bounces: 0, perfects: 0, combo: 0,
      armed: false, pendingPerfect: false, gesture: 0, pitch: 0, pitchEff: 0,
      aiming: false, aimDx: 0, aimDy: 0, trail: [], tapErrs: [], lastErr: null, lastErrAt: -9,
      deadAt: 0, flash: 0, lift: 0, shake: 0, reason: null, ghostHit: 0
    };
    rings.length = 0; drops.length = 0;
    seedSparks(-20);
    paintCard("ready");
    paintSeas();
  }

  // угол атаки в точке касания: крутое падение + встречный склон = камень зарывается
  function attackAt(x, y, z, vx, vy0, vz, t0) {
    var c = solveContact(x, y, z, vx, vy0, vz, t0);
    var vyAt = vy0 - P.gravity * c.t;
    var sp = Math.sqrt(vz * vz + vx * vx) || 1;
    var sl = (waveGradZ(c.x, c.z, t0 + c.t) * vz + waveGradX(c.x, c.z, t0 + c.t) * vx) / sp;
    return Math.atan2(Math.abs(vyAt), sp) + Math.atan(Math.max(0, sl));
  }

  var appliedDay = null;
  function launch(vx0) {
    if (appliedDay !== todayKey()) { applySea(sea); return; }
    tiltZero = tiltRaw; betaZero = betaRaw;
    // вода — сегодняшняя, у всех одна; честный старт добирается
    // детерминированным сдвигом фазы, тоже одинаковым у всех
    off1 = daily ? daily.off1 : 0;
    off2 = daily ? daily.off2 : 0;
    var limit = (P.digAngle - 5) * Math.PI / 180 + P.assist * (P.pitchMax * Math.PI / 180);
    for (var a = 0; a < 40; a++) {
      if (attackAt(0, 0.55, 0, vx0 || 0, P.hop, P.speed, 0) < limit) break;
      off1 += 0.7; off2 += 1.1;
    }
    S.phase = "fly"; S.t = 0; S.acc = 0;
    S.x = 0; S.y = 0.55; S.z = 0; S.vx = vx0 || 0; S.vy = P.hop; S.vz = P.speed; S.hop = P.hop;
    S.camX = 0;
    S.bounces = 0; S.perfects = 0; S.combo = 0; S.armed = false; S.gesture = 0;
    S.tapErrs = []; S.lastErr = null; S.steerTarget = 0; S.steerShow = 0;
    S.reason = null; S.ghostHit = 0;
    predictContact();
    S.fullInterval = S.interval;
    rings.length = 0; drops.length = 0; RW.length = 0;
    seedReflections();
    questNextZ = 28; questInst = [];
    if (OPT.stars) spawnFigure();
    hideCard(); paintSeas();
    audioResume();
  }

  // численный поиск касания: поверхность движется и наклонена, формулы нет
  function solveContact(x0, y0, z0, vx, vy0, vz, t0) {
    vx += P.tide * tideForce() * (daily ? daily.tideDir : 1);
    var dt = 0.006, t = 0, x = x0, y = y0, z = z0, vy = vy0;
    for (var i = 0; i < 800; i++) {
      vy -= P.gravity * dt;
      x += vx * dt; y += vy * dt; z += vz * dt;
      t += dt;
      if (vy < 0 && y <= waveH(x, z, t0 + t)) return { t: t, x: x, z: z };
    }
    return { t: t, x: x, z: z };
  }
  function predictContact() {
    var c = solveContact(S.x, S.y, S.z, S.vx, S.vy, S.vz, S.t);
    S.nextContact = S.t + c.t;
    S.interval = c.t;
    S.aimX = c.x; S.aimZ = c.z;
  }

  // какой наклон камня был бы идеален для ближайшего касания (для шкалы-прибора)
  function idealPitch() {
    var tt = Math.max(0, S.nextContact - S.t);
    var vyAt = S.vy - P.gravity * tt;
    var sp = Math.sqrt(S.vz * S.vz + S.vx * S.vx) || 1;
    var sl = (waveGradZ(S.aimX, S.aimZ, S.t + tt) * S.vz + waveGradX(S.aimX, S.aimZ, S.t + tt) * S.vx) / sp;
    var bare = Math.atan2(Math.abs(Math.min(0, vyAt)), sp) + Math.atan(Math.max(0, sl));
    var lim = P.pitchMax * Math.PI / 180;
    return Math.max(-lim, Math.min(lim, bare - P.goodAttack * Math.PI / 180));
  }

  function windowMs() { return Math.max(P.windowFloor, (S.fullInterval || S.interval) * 1000 * (P.windowPct / 100)); }

  // ---- audio ----
  var AC = null, master = null, wet = null, panner = null, amb = null;

      for (var i = 0; i < len; i++) { d[i] = (Math.random() * 2 - 1) * e; e *= dk; }
    }
    return buf;
  }

  function audioResume() {
    if (!OPT.sound) return;
    try {
      if (!AC) {
        // в обработчике тапа делаем только то, что требует политика автоплея:
        // создаём контекст и запускаем его. Тяжёлые буферы — следующим тиком,
        // иначе первый тап замирает на десятки миллисекунд

        master = AC.createGain(); master.gain.value = 0.55;
        master.connect(AC.destination);

  }

    try {

      var buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
      var last = 0;
      for (var i = 0; i < len; i++) {
        var w = Math.random() * 2 - 1;
        last = (last + 0.02 * w) / 1.02;
        d[i] = last * 3.2;

      src.buffer = buf; src.loop = true;
      var bp = AC.createBiquadFilter();
      bp.type = "bandpass"; bp.frequency.value = 520; bp.Q.value = 0.5;

      var lfoG = AC.createGain(); lfoG.gain.value = 0.1;

      padG.gain.value = 0.07;
      var pad2 = AC.createOscillator();
      pad2.type = "sine"; pad2.frequency.value = 92.5;
      var pad2G = AC.createGain(); pad2G.gain.value = 0.028;
      var padLfo = AC.createOscillator(); padLfo.frequency.value = 0.055;

      padLfo.connect(padLfoG); padLfoG.connect(padG.gain);
      pad.connect(padG); padG.connect(master);

  }

  function outFor(pan) {

    return master;
  }

  // ЗВУК ВОДЫ. Настоящий «плюх» — это резонанс воздушной полости (Миннарт):
  // частота тона РАСТЁТ, пока пузырь схлопывается. Падающий тон звучит как
  // деревяшка/синтезатор, поэтому раньше на воду и не было похоже.
  var noiseBuf = null;
  function getNoise() {
    if (noiseBuf) return noiseBuf;
    var len = Math.floor(AC.sampleRate * 1.2);
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return noiseBuf;
  }

  // брызги: шумовой всплеск, фильтр съезжает вниз — так рассыпается капельная взвесь
  function spray(dest, amp, hz, dur, q, delay) {
    if (!AC || AC.state !== "running") return;
    var t0 = AC.currentTime + (delay || 0);
    var src = AC.createBufferSource();
    src.buffer = getNoise();
    src.loop = true;
    src.playbackRate.value = 0.75 + Math.random() * 0.5;
    var bp = AC.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.setValueAtTime(hz, t0);
    bp.frequency.exponentialRampToValueAtTime(Math.max(120, hz * 0.4), t0 + dur);
    bp.Q.value = q || 0.7;
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(amp, t0 + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(bp); bp.connect(g); g.connect(dest);
    src.start(t0); src.stop(t0 + dur + 0.03);
  }

  // пузырь: тон с восходящей частотой. Крупный пузырь — низкий и долгий
  function bubble(dest, fEnd, amp, dur, rise, delay) {
    if (!AC || AC.state !== "running") return;
    var t0 = AC.currentTime + (delay || 0);
    var r = rise || 1.9;
    var o = AC.createOscillator(), g = AC.createGain(), lp = AC.createBiquadFilter();
    o.type = "sine";
    o.frequency.setValueAtTime(fEnd / r, t0);
    o.frequency.exponentialRampToValueAtTime(fEnd, t0 + dur * 0.7);
    lp.type = "lowpass"; lp.frequency.value = fEnd * 4;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(amp, t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(lp); lp.connect(g); g.connect(dest);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }

  // касание овечки о воду: удар-шлепок + пузырь, чья итоговая частота и есть нота серии
  function tone(step, clean, mult) {
    if (!AC || !OPT.sound || AC.state !== "running") return;
    var semi = SCALE[Math.min(step, SCALE.length - 1)];
    var f = 246.94 * Math.pow(2, semi / 12) * (mult || 1);
    var dest = outFor((S ? S.x - S.camX : 0) / 7);

    // удар: короткий широкий шлепок, у чистого касания — суше и звонче
    spray(dest, clean ? 0.2 : 0.3, clean ? 2400 : 1500, clean ? 0.05 : 0.1, clean ? 1.1 : 0.6);
    // пузырь-нота
    bubble(dest, f, clean ? 0.3 : 0.2, clean ? 0.26 : 0.18, clean ? 2.1 : 1.6);
    // хвост капель
    spray(dest, clean ? 0.07 : 0.05, 5200, 0.12, 1.4, 0.02);
  }

  // «вдох» после подсечки: вода поднимает — низкий пузырь и всплеск
  function swell() {
    if (!AC || !OPT.sound || AC.state !== "running") return;
    var dest = outFor((S ? S.x - S.camX : 0) / 7);
    bubble(dest, 190, 0.14, 0.5, 2.6);
    spray(dest, 0.1, 900, 0.28, 0.5);
  }

  // «буль»: овечка ушла под воду — крупная полость и гурчание мелких пузырьков
  function thud() {
    if (!AC || !OPT.sound || AC.state !== "running") return;
    var dest = outFor((S ? S.x - S.camX : 0) / 7);
    spray(dest, 0.32, 700, 0.22, 0.5);          // всплеск входа
    bubble(dest, 150, 0.32, 0.45, 2.8);         // крупная полость
    bubble(dest, 320, 0.12, 0.2, 2.2, 0.12);    // пузырьки вдогонку
    bubble(dest, 480, 0.08, 0.14, 2.0, 0.22);
    spray(dest, 0.06, 3200, 0.3, 1.2, 0.05);    // оседающая взвесь
  }

  // мгновенное подтверждение тапа: тихий щелчок пальца, не синтезаторный писк
  function tick() {
    if (!AC || !OPT.sound || AC.state !== "running") return;
    spray(master, 0.05, 3400, 0.02, 1.6);
  }

  // ---- input ----
  // физика касания: сила (Touch.force / PointerEvent.pressure), площадь контакта
  // (radiusX/Y или width/height) и длительность. Датчик может врать константой —
  // тогда сам себя отключаем и остаёмся честной тайминг-игрой
  var TAP = { strength: 0.35, src: "нет", lo: 9, hi: -9, samples: 0, live: false };
  function noteTapPhysics(force, area) {
    var v = null, src = null;
    if (typeof force === "number" && force > 0) { v = Math.min(1, force); src = "сила"; }
    else if (typeof area === "number" && area > 0) { v = Math.min(1, area / 45); src = "площадь"; }
    if (v === null) { TAP.strength = 0.35; return; }
    TAP.lo = Math.min(TAP.lo, v); TAP.hi = Math.max(TAP.hi, v);
    TAP.samples++;
    if (TAP.samples > 4 && TAP.hi - TAP.lo > 0.05) { TAP.live = true; TAP.src = src; }
    if (!TAP.live) { TAP.strength = 0.35; return; }
    var span = Math.max(0.08, TAP.hi - TAP.lo);
    // ИНВЕРСИЯ: маленькое пятно контакта — касание кончиком пальца, точное и трудное;
    // шлепок всей подушечкой — размазанный. Точность вознаграждается энергией
    TAP.strength = Math.max(0, Math.min(1, 1 - (v - TAP.lo) / span));

  window.addEventListener("touchstart", function (e) {
    var t = e.touches && e.touches[0];

    noteTapPhysics(t.force, area);
  }, { passive: true });

  var down = null;
  // обратная проекция: точка экрана -> точка на воде (для водяной игрушки в меню)
  function screenToWater(px, py) {
    var dy = py - horizon;
    if (dy < 10) return null;
    var dz = focal * CAM_Y / dy;
    if (dz > 120) return null;
    return { x: (px - W / 2) * dz / focal + S.camX, z: (S.z - followNow) + dz };
  }
  function beginTap(x, y) {
    down = { x: x, y: y };
    anSession();
    if (OPT.sound && AC && AC.state !== "running") { try { AC.resume(); } catch (e) {} }
    if (OPT.tilt && !tiltInited) { tiltInited = true; enableTilt(); }
    if (!S) return;
    // пока не играем, вода — игрушка: тап по ней рождает настоящую волну
    if ((S.phase === "ready" || S.phase === "dead") && OPT.echo) {
      var wp = screenToWater(x, y);
      if (wp) {
        addRing(wp.x, wp.z, S.t, P.ringAmp * 1.5, 2.2, 0.6, 2.5);
        audioResume();

      }
    }
    if (S.phase === "ready") { launch(0); return; }
    if (S.phase === "dead") { if (S.t - S.deadAt > 0.45) { newRun(); launch(); } return; }
    if (S.phase !== "fly" || S.armed) return;

    var err = (tNow - S.nextContact) * 1000 - P.latency;

      S.pendingPerfect = Math.abs(err) <= perfectMs();
      S.tapErrs.push(Math.round(err));
      S.lastErr = Math.round(err); S.lastErrAt = tNow;
      S.tapStrength = TAP.live ? TAP.strength : 0.35;
      S.tapGlint = 1;

      // тапнул в стороне — поворачивает тем круче, чем дальше от неё палец
      var ref = (typeof S.screenX === "number") ? S.screenX : W / 2;
      var rel = Math.max(-1, Math.min(1, (x - ref) / (W * 0.5)));
      var mag = (Math.abs(rel) - P.steerDead) / Math.max(0.01, 1 - P.steerDead);
      S.steerTarget = mag <= 0 ? 0 : (rel < 0 ? -1 : 1) * Math.pow(Math.min(1, mag), 1.4) * P.steerMax;
      S.steerShow = 1;
      // овечка уже скользит по воде и ждёт — отскок происходит сразу,
      // а не на следующем шаге физики: иначе отклик опаздывает до четверти секунды
      if (S.sliding) { S.sliding = false; bounce(); }

  }
  function moveTap() {}   // жестов нет: игра управляется одним тапом
  window.addEventListener("pointerdown", function (e) {

  window.addEventListener("pointerup", function () { down = null; });
  window.addEventListener("keydown", function (e) {
    if (e.code === "Space") { e.preventDefault(); if (S && S.phase === "ready") launch(0); else { beginTap(W / 2, H / 2); down = null; } }
    else if (e.code === "ArrowLeft") { keyTilt = -18; }
    else if (e.code === "ArrowRight") { keyTilt = 18; }
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "ArrowLeft" || e.code === "ArrowRight") keyTilt = 0;
  });
  var betaRaw = 0, betaZero = 0, jerkAt = -9, sensorSeen = false, sensorGaveUp = false;
  function onOrient(e) {
