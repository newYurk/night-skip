<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#03060c">
<title>Лягушка по воде</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Barlow+Condensed:wght@400;500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Barlow+Condensed:wght@400;500&display=swap"></noscript>
<style>
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --ink: #03060c;
    --cool: #7ed6e6;
    --text: #cfe6ef;
    --muted: rgba(176, 205, 219, 0.55);
    --line: rgba(126, 214, 230, 0.18);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--ink); color: var(--text);
    font-family: "Barlow Condensed", "Avenir Next Condensed", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none; touch-action: none;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--ink); }
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    padding: calc(18px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) 0 calc(20px + env(safe-area-inset-left));
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 15px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted); pointer-events: none;
  }
  #hud .count {
    font-family: "Cormorant Garamond", Georgia, serif; font-size: 34px;
    letter-spacing: 0.04em; color: var(--text); text-transform: none;
    font-variant-numeric: tabular-nums; line-height: 1;
  }
  #hud .combo { color: var(--cool); opacity: 0; transition: opacity 0.25s ease; }
  #hud .combo.on { opacity: 1; }
  #card {
    position: fixed; left: 0; right: 0;
    top: calc(64px + env(safe-area-inset-top));
    bottom: calc(220px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    text-align: center; gap: 6px; pointer-events: none; padding: 0 24px;
    transition: opacity 0.4s ease; opacity: 1;
  }
  #card .top { display: grid; justify-items: center; gap: 6px; padding-top: var(--card-pad, 12vh); }
  #card.hidden { opacity: 0; }
  #card .big {
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 300;
    font-size: clamp(64px, 22vw, 132px); line-height: 0.9; color: var(--text);
    font-variant-numeric: tabular-nums; text-shadow: 0 0 44px rgba(150, 215, 235, 0.22);
  }
  #card .label { font-size: 14px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); }
  #card .best { font-size: 15px; letter-spacing: 0.24em; color: rgba(176, 205, 219, 0.4); text-transform: uppercase; }
  #card .hint { margin-top: 0; font-size: 14px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
  #card .hint span { display: block; margin-top: 8px; text-wrap: balance; letter-spacing: 0.06em; text-transform: none; font-size: 14px; color: rgba(176, 205, 219, 0.42); line-height: 1.5; }
  @keyframes breathe { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.9; } }
  #card .hint strong { font-weight: 500; animation: breathe 2.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { #card .hint strong { animation: none; } }

  /* Разбор остаётся внизу, но теперь он короткий — две строки вместо семи.
     Перенос наверх не помог: финал садится примерно на две трети высоты
     экрана, и панель в семь строк накрывала его и сверху, и снизу. Лечится
     не местом, а объёмом. */
  #debug {
    position: fixed; left: 0; right: 0;
    bottom: calc(84px + env(safe-area-inset-bottom));
    padding: 0 14px; z-index: 3; pointer-events: none;
    display: flex; justify-content: center;
    transition: opacity 0.3s ease; opacity: 0;
  }
  #debug.on { opacity: 1; }
  #debug .box {
    max-width: 520px; width: 100%;
    background: rgba(4, 10, 18, 0.72); border: 1px solid var(--line); border-radius: 3px;
    padding: 10px 14px; text-align: left;
    font-size: 12px; line-height: 1.5; letter-spacing: 0.02em;
    color: rgba(176, 205, 219, 0.72); font-variant-numeric: tabular-nums;
    white-space: pre-line;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  #pic {
    width: 100%; aspect-ratio: 2 / 3; display: block; border-radius: 2px;
    background: #05070d; border: 1px solid var(--line);
  }
  #debug b { color: var(--text); font-weight: 500; }
  #debug .now { color: var(--cool); }

  #seas {
    position: fixed; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom));
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 0 14px 0 78px; z-index: 4;
    transition: opacity 0.35s ease;
  }
  #seas.hidden { opacity: 0; pointer-events: none; }
  #seas button {
    font: inherit; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase;
    padding: 9px 14px; min-height: 44px; min-width: 118px; cursor: pointer; border-radius: 2px;
    border: 1px solid transparent; background: transparent; color: rgba(176, 205, 219, 0.4);
  }
  #seas button[aria-pressed="true"] { color: var(--text); border-color: var(--line); }
  #seas button:focus-visible, #gear:focus-visible, .panel button:focus-visible { outline: 2px solid var(--cool); outline-offset: 2px; }

  #gear {
    position: fixed; left: calc(14px + env(safe-area-inset-left)); bottom: calc(14px + env(safe-area-inset-bottom)); width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid var(--line); background: rgba(6, 14, 24, 0.6); color: var(--muted);
    display: grid; place-items: center; cursor: pointer; z-index: 5; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; transform: translateY(101%);
    transition: transform 0.32s cubic-bezier(0.22, 0.8, 0.3, 1);
    background: rgba(5, 12, 22, 0.94); border-top: 1px solid var(--line);
    padding: 16px 18px calc(18px + env(safe-area-inset-bottom)); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    max-height: 78vh; overflow-y: auto;
  }
  .panel.open { transform: translateY(0); }
  .panel h2 {
    margin: 0 0 4px; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 400;
    font-size: 22px; letter-spacing: 0.02em; color: var(--text);
  }
  .panel p.note { margin: 0 0 14px; font-size: 14px; color: var(--muted); line-height: 1.45; max-width: 62ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 10px 22px; }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 10px; }
  .row label { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .row output { font-size: 14px; color: var(--cool); font-variant-numeric: tabular-nums; }
  .row input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: #7ed6e6; height: 22px; }
  .toggles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .toggles button {
    font: inherit; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
    padding: 8px 14px; min-height: 44px; border-radius: 2px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--muted);
  }
  .toggles button[aria-pressed="true"] { color: var(--ink); background: var(--cool); border-color: var(--cool); }
  .panel .close {
    margin-top: 14px; width: 100%; min-height: 44px; font: inherit; font-size: 14px;
    letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 2px;
  }
</style>

<canvas id="stage"></canvas>

<div id="hud" aria-hidden="true">
  <div class="count" id="count">0</div>
  <div class="combo" id="combo">чисто ×0</div>
</div>

<div id="card">
  <div class="top">
    <div class="label" id="cardLabel">Лягушка</div>
    <div class="big" id="cardBig">0</div>
    <div class="best" id="cardBest"></div>
  </div>
  <div class="hint" id="cardHint"><strong>тап — бросок</strong><span>тапай в момент касания воды<br>тапнул сбоку от овцы — свернёт туда</span></div>
</div>

<div id="debug" aria-hidden="true"><div class="box" id="debugBox"></div></div>

<div id="seas" aria-label="Море"></div>

<button id="gear" aria-label="Настройки прототипа">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"></circle>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.5.55.87 1.06 1H21a2 2 0 1 1 0 4h-.09c-.51.13-.92.5-1.06 1z"></path>
  </svg>
</button>

<section class="panel" id="panel" aria-label="Параметры прототипа">
  <h2>Крутилки прототипа</h2>
  <p class="note">Открытые вопросы дизайна, вынесенные в ползунки. Меняешь — заход перезапускается.</p>
  <div class="grid" id="sliders"></div>
  <div class="toggles" id="toggles"></div>
  <div class="toggles">
    <button type="button" id="hardReload">обновить игру (сбросить кеш)</button>
    <button type="button" id="settingsReset">вернуть стандартные настройки</button>
  </div>
  <h2 style="margin-top:16px">Журнал заходов</h2>
  <p class="note" id="logText" style="white-space:pre-line;font-variant-numeric:tabular-nums"></p>
  <h2 style="margin-top:16px">Статистика устройства</h2>
  <p class="note" id="statsText" style="white-space:pre-line;font-variant-numeric:tabular-nums"></p>
  <div class="toggles">
    <button type="button" id="statsCopy">скопировать</button>
    <button type="button" id="statsReset">сбросить</button>
  </div>
  <h2 style="margin-top:16px">Стадо этой ночи</h2>
  <p class="note" id="flockNote" style="white-space:pre-line"></p>
  <div class="toggles">
    <button type="button" id="flockOpen">посмотреть</button>
  </div>
  <button class="close" id="closePanel">Играть</button>
</section>

<section class="panel" id="night" aria-label="Стадо этой ночи">
  <h2 id="nightTitle">Стадо этой ночи</h2>
  <canvas id="pic"></canvas>
  <p class="note" id="nightNote" style="white-space:pre-line"></p>
  <button class="close" id="closeNight">Закрыть</button>
</section>

<script>
(function () {
  "use strict";

  var BUILD = "2026-08-20 · два моря";

  var cv = document.getElementById("stage");
  var ctx = cv.getContext("2d", { alpha: false });
  var W = 0, H = 0, DPR = 1;

  var P = {
    windowPct: 26, windowFloor: 115, perfectPct: 34,
    latency: ('ontouchstart' in window) ? 80 : 25,
    hop: 7.6, decay: 0.918, perfectDecay: 0.962,
    gravity: 27, speed: 13, speedUp: 1.4,
    waveAmp: 0.22, waveLen: 11, wave2: 0.62, waveSpeed: 2.2, waveGain: 3.2,
    ceiling: 8.8, fatigue: 0.10, digAngle: 54, ringAmp: 0.1,
    push: 0.55, viscosity: 0.07, hopRef: 5.5, tide: 0.85, swellLen: 52,
    heroScale: 1, camRide: 0, camY: 2,
    steerDead: 0.16, steerMax: 3.4, steerEase: 3.2,
    pitchMax: 26, assist: 0.78, goodAttack: 18, aimSpread: 4.5
  };
  // ключи, снятые с производства (наклон, жесты, ручной угол, плоская вода,
  // созвездия), здесь намеренно отсутствуют: restoreOpts перебирает только
  // текущие ключи, поэтому старый localStorage их не оживит
  var OPT = { aim: true, mirror: true, sound: true, ghost: true, echo: true, sheep: true, showErr: false, debug: true, autocal: true, ripple: true };
  // стандартные значения — для кнопки сброса; custom — ручные правки игрока,
  // они главнее моря и «сегодня» и переживают переключения
  var PDEF = {}, OPTDEF = {}, custom = {};
  Object.keys(P).forEach(function (k) { PDEF[k] = P[k]; });
  Object.keys(OPT).forEach(function (k) { OPTDEF[k] = OPT[k]; });
  function saveCustom() {
    try { localStorage.setItem("ns_custom", JSON.stringify(custom)); } catch (e) {}
  }
  function restoreCustomVals() {
    try {
      var d = JSON.parse(localStorage.getItem("ns_custom") || "null");
      if (d) Object.keys(d).forEach(function (k) {
        if (!(k in P) || typeof d[k] !== "number" || !isFinite(d[k])) return;
        var sl = SLIDERS.filter(function (x) { return x.k === k; })[0];
        var v = sl ? Math.max(sl.min, Math.min(sl.max, d[k])) : d[k];
        custom[k] = v; P[k] = v;
      });
    } catch (e) {}
  }
  function saveOpts() {
    try { localStorage.setItem("ns_opts", JSON.stringify({ o: OPT, lat: P.latency })); } catch (e) {}
  }
  (function restoreOpts() {
    try {
      var d = JSON.parse(localStorage.getItem("ns_opts") || "null");
      if (d && d.o) Object.keys(OPT).forEach(function (k) { if (typeof d.o[k] === "boolean") OPT[k] = d.o[k]; });
      if (d && typeof d.lat === "number") P.latency = d.lat;
    } catch (e) {}
  })();

  // ВОЛНЫ ВОЗВРАЩЕНЫ В ИСХОДНОЕ (22.08.2026), и это решение автора.
  //
  // Пробовали уменьшить длину волны и амплитуду втрое вместе, чтобы видимая
  // вода не помещалась в полволны и не ходила единым блоком. Рывок это убрало,
  // крутизну (амплитуда/длина) сохранило до знака, то есть физику не тронуло, —
  // но волнение стало выглядеть как штиль. Автор: «должны быть шикарные,
  // мягкие, плавные, высокие волны, как было 20–21 августа; нельзя таким
  // образом убирать прыганье экрана».
  //
  // Значит высота волны неприкосновенна, а рывок лечится ТОЛЬКО камерой,
  // идущей по воде (см. CAM_RIDE). Ниже — исходные числа тех дней.
  // Миры = только числа и цвета. Ни одного спрайта: проверка идеи «разные планеты» даром.
  // В бурное море камень бросают площе — иначе он сразу зароется в первый же гребень.
  var SEAS = [
    { id: "calm", name: "штиль", amp: 0.09, speed: 1.3, w2: 0.28, len: 15, hop: 8.1, g: 27, fwd: 13, assist: 0.9, varScale: 0.7,
      pal: { sky: ["#050b18", "#0d1c31"], gr: ["#0a1526", "#050c16", "#02050a"], line: "150,226,242", glow: "150,232,245", hot: "230,252,255", stone: "#33485a" } },
    { id: "swell", name: "волнение", amp: 0.34, speed: 2.2, w2: 0.55, len: 16, hop: 7.2, g: 27, fwd: 13, assist: 0.76, varScale: 0.55,
      pal: { sky: ["#050b18", "#0d1c31"], gr: ["#0a1526", "#050c16", "#02050a"], line: "150,226,242", glow: "150,232,245", hot: "230,252,255", stone: "#33485a" } }
  ];
  // Штиль — море по умолчанию. Раньше игра стартовала с волнения, то есть сразу
  // со второй ступени собственной лестницы: в доке «Зыби» пролив 1 — «тихая вода,
  // только ритм (обучение)», а чтение воды идёт третьей ступенью.
  // Замер 21.08.2026: волнение примерно вдвое жёстче (бот с разбросом ±40 мс живёт
  // 123 отскока против 240), и держать ритм там нельзя — интервал между касаниями
  // меняется резче, чем всё окно тапа, примерно на половине отскоков.
  // Возвращается выбор игрока: последнее выбранное море переживает перезагрузку.
  var sea = SEAS[0];
  (function restoreSea() {
    try {
      var id = localStorage.getItem("ns_sea");
      if (id) for (var i = 0; i < SEAS.length; i++) if (SEAS[i].id === id) sea = SEAS[i];
    } catch (e) {}
  })();
  var PAL = sea.pal;

  var SLIDERS = [
    { k: "latency", label: "компенсация задержки тапа", min: 0, max: 160, step: 5, unit: " мс" },
    { k: "windowPct", label: "окно тапа", min: 8, max: 45, step: 1, unit: " %" },
    { k: "windowFloor", label: "пол окна", min: 40, max: 220, step: 5, unit: " мс" },
    { k: "perfectPct", label: "«чисто» от окна", min: 15, max: 70, step: 1, unit: " %" },
    { k: "hop", label: "высота отскока", min: 3.5, max: 9, step: 0.1, unit: "" },
    { k: "decay", label: "затухание", min: 0.86, max: 0.99, step: 0.005, unit: "" },
    { k: "perfectDecay", label: "затухание при «чисто»", min: 0.9, max: 0.998, step: 0.002, unit: "" },
    { k: "waveGain", label: "сила склона", min: 0, max: 7, step: 0.1, unit: "" },
    { k: "ceiling", label: "потолок помощи воды", min: 2, max: 9, step: 0.1, unit: "" },
    { k: "fatigue", label: "усталость камня", min: 0, max: 0.5, step: 0.01, unit: " %" },
    { k: "push", label: "точность касания → энергия", min: 0, max: 1.2, step: 0.05, unit: "" },
    { k: "viscosity", label: "вязкость воды", min: 0, max: 0.2, step: 0.005, unit: "" },
    { k: "hopRef", label: "порог глиссирования", min: 2, max: 9, step: 0.1, unit: "" },
    { k: "tide", label: "приливное течение", min: 0, max: 2.5, step: 0.05, unit: "" },
    { k: "swellLen", label: "длина своей зыби", min: 15, max: 90, step: 1, unit: "" },
    // чисто зрительная ручка: физику не трогает, поэтому масштабирует ВСЮ
    // компанию разом — овцу, облачко, круг и «z-z-z». По отдельности они
    // сразу разъедутся: облачко подстилается под овцу по её же размеру
    { k: "heroScale", label: "размер овцы", min: 0.6, max: 2.2, step: 0.05, unit: "×" },
    // По независимому замеру (2×2 сборки, окно 20 с игрового времени) езда
    // камеры не лечила рывок, а ДОБАВЛЯЛА его: на волнении размах полотна
    // 72.6 px при неподвижной камере против 95.5 при camRide 0.85, и доля
    // согласованного движения росла с 0.77 до 0.85 — то есть кадр сдвигался
    // как целое именно из-за камеры. По умолчанию 0.
    { k: "camRide", label: "камера идёт по воде", min: 0, max: 1, step: 0.05, unit: "" },
    // Высота камеры. Чем выше, тем больше воды в кадре и тем слабее качание:
    // размах пропорционален (строка − горизонт) · высота_волны / camY.
    // Цена — овца съезжает вниз и мельчает, это лечится «размером овцы».
    { k: "camY", label: "высота камеры", min: 1.5, max: 6, step: 0.1, unit: "" },
    { k: "digAngle", label: "угол, на котором зарывается", min: 25, max: 70, step: 1, unit: "°" },
    { k: "ringAmp", label: "эхо отскоков: высота", min: 0, max: 0.3, step: 0.01, unit: "" },

    { k: "steerDead", label: "мёртвая зона руля", min: 0, max: 0.45, step: 0.01, unit: "" },

  }

  // ---- state ----
  var S = null;
  var rings = [], sparks = [], drops = [];
  var best = 0, ghostZ = 0;

  // аналитика: локально — подробно (это главный источник), в сеть — только
  // анонимные счётчики-пиксели (hits.sh, без аккаунтов), и только с github.io
  var AN = { key: "ns_stats", mem: null, sessionSent: false };
  // ── Автокалибровка задержки по Калману ───────────────────────────────
  // Состояние: систематический сдвиг тапа в мс (сколько игрок стабильно
  // опаздывает или спешит сверх текущей компенсации). Измерение: ошибка
  // каждого принятого тапа. Фильтр отделяет постоянный сдвиг от дрожания руки
  // и заодно честно сообщает, насколько он в оценке уверен.
  var KF = { x: 0, P: 900, Q: 1.2, R: 900, n: 0 };
  function kfReset() { KF.x = 0; KF.P = 900; KF.R = 900; KF.n = 0; }
  (function restoreKF() {
    try {
      var d = JSON.parse(localStorage.getItem("ns_kf") || "null");
      if (!d || d.v !== 1 || typeof d.x !== "number" || !isFinite(d.x)) return;
      KF.x = d.x; KF.P = d.P || 900; KF.n = d.n || 0;
      // R обязан пережить перезагрузку вместе с P. Пока он всегда стартовал
      // с 900 (σ = 30 мс), соотношение с восстановленным маленьким P ломалось:
      // K = P/(P+R) выходил крошечным, и фильтр первые десятки тапов почти
      // не учился, пока R не сползёт множителем 0.97. Заодно R — это и есть
      // готовая мера разброса руки игрока, и она пропадала при каждом
      // закрытии вкладки.
      if (typeof d.R === "number" && isFinite(d.R)) KF.R = Math.max(150, d.R);
    } catch (e) {}
  })();
  // версия у записи нужна до любой следующей смены смысла состояния:
  // без неё старое состояние молча истолкуется по новым правилам
  function kfSave() { try { localStorage.setItem("ns_kf", JSON.stringify({ v: 1, x: KF.x, P: KF.P, R: KF.R, n: KF.n })); } catch (e) {} }
  function kfUpdate(err) {
    // при переигровке фильтр не учится: это клиентское удобство, а не часть
    // авторитетной симуляции, и он бы поехал от чужих заходов
    if (replaying) return;
    // выброс (случайный ляп, а не сдвиг) — не даём ему тянуть оценку
    var sd = Math.sqrt(KF.P + KF.R);
    if (KF.n > 6 && Math.abs(err - KF.x) > 3 * sd) return;
    KF.P += KF.Q;                       // прогноз: сдвиг медленно плывёт
    var K = KF.P / (KF.P + KF.R);       // усиление: доверие измерению против модели
    KF.x += K * (err - KF.x);
    KF.P = (1 - K) * KF.P;
    KF.n++;
    // шум измерения подстраивается под реальный разброс руки
    var innov = err - KF.x;
    KF.R = Math.max(150, KF.R * 0.97 + innov * innov * 0.03);
  }
  function kfSigma() { return Math.sqrt(KF.P); }
  // применяем только между заходами и только когда фильтр уверен —
  // двигать окно внутри серии нечестно по отношению к игроку
  function kfApply() {
    // Переигровка не имеет права трогать калибровку: она и физику захода
    // уводит в сторону посреди прогона, и — хуже — пишет чужое значение
    // в ns_custom/ns_opts игрока. kfUpdate был закрыт этой проверкой сразу,
    // а kfApply нет; нашлось на сверке ленты с оригиналом.
    if (replaying) return;
    if (!OPT.autocal) return;
    if (KF.n < 8 || kfSigma() > 9 || Math.abs(KF.x) < 6) return;
    // Доля 0.85, а не 0.7. Обоснование — замер усечения (см. HANDOFF):
    // окно приёма несимметрично, [-W, +0.6W], поэтому опоздания отбраковываются
    // чаще, и оценка сдвига ВСЕГДА занижена, никогда не завышена. Значит
    // применять её осторожно нет смысла: перелёта из-за усечения быть не может
    // по построению, а осторожность просто растягивает сходимость на лишние
    // заходы у того самого игрока, ради которого фильтр и писался.
    var shift = KF.x * 0.85;
    var next = Math.max(0, Math.min(160, P.latency + shift));
    if (Math.abs(next - P.latency) < 1) return;
    P.latency = Math.round(next);
    KF.x -= shift;            // сдвиг учтён компенсацией — снимаем его с оценки
    KF.P += 25;               // после подстройки уверенность чуть падает
    // В custom писать НЕЛЬЗЯ: это ячейка «игрок двигал ползунок вручную».
    // Автокалибровка срабатывает у всех, и признак ручной настройки
    // превращался в признак «человек хоть раз играл» — по нему, например,
    // решалось, сохранять ли числа переигровки. Сама задержка и так переживает
    // перезагрузку: saveOpts кладёт её в ns_opts.lat, а restoreOpts достаёт.
    saveOpts(); kfSave();
    if (typeof refreshSliders === "function") refreshSliders();
    say("калибровка: " + P.latency + " мс");
  }

  // журнал: по каждому заходу — ошибки тапов в мс, интервал и чем кончилось
  var LOG = [];
  (function loadLog() {
    try { LOG = JSON.parse(localStorage.getItem("ns_log") || "[]") || []; } catch (e) { LOG = []; }
    if (!Array.isArray(LOG)) LOG = [];
  })();
  function logRun(rec) {
    LOG.push(rec);
    while (LOG.length > 40) LOG.shift();
    try { localStorage.setItem("ns_log", JSON.stringify(LOG)); } catch (e) {}
  }
  function med(a) {
    if (!a.length) return 0;
    var b = a.slice().sort(function (x, y) { return x - y; });
    return b[Math.floor(b.length / 2)];
  }
  function seaName(id) {
    for (var i = 0; i < SEAS.length; i++) if (SEAS[i].id === id) return SEAS[i].name;
    return id;
  }
  function bar(n) { return n ? new Array(Math.min(10, n) + 1).join("▍") + " " + n : "·"; }

  // разбор по одному морю: где срывается, куда сдвинут тайминг, чем кончается
  function seaBlock(runs) {
    var errs = [], bs = [], ivs = [], byReason = {}, bins = [0, 0, 0, 0, 0];
    var names = ["0-3", "4-8", "9-15", "16-25", "26+"];
    runs.forEach(function (r) {
      bs.push(r.b);
      if (r.iv) ivs.push(r.iv);
      byReason[r.d] = (byReason[r.d] || 0) + 1;
      if (r.e && r.e.length) errs = errs.concat(r.e);
      bins[r.b <= 3 ? 0 : r.b <= 8 ? 1 : r.b <= 15 ? 2 : r.b <= 25 ? 3 : 4]++;
    });
    var peak = 0;
    for (var i = 1; i < bins.length; i++) if (bins[i] > bins[peak]) peak = i;
    var mErr = Math.round(med(errs));
    var reasons = Object.keys(byReason).sort(function (a, b) { return byReason[b] - byReason[a]; })
      .map(function (k) { return k + " " + byReason[k]; }).join(", ");
    return {
      n: runs.length, medB: med(bs), maxB: bs.length ? Math.max.apply(null, bs) : 0,
      mErr: mErr, medIv: Math.round(med(ivs)), peak: names[peak],
      text: "  серий " + runs.length + " · медиана " + med(bs) + " · максимум " + (bs.length ? Math.max.apply(null, bs) : 0) +
        "\n  тайминг: " + (Math.abs(mErr) < 12 ? "в момент" : (mErr > 0 ? "опаздываешь на " + mErr + " мс" : "спешишь на " + (-mErr) + " мс")) +
        " · интервал " + Math.round(med(ivs)) + " мс" +
        "\n  срывы: " + names.map(function (n, i) { return n + " " + bar(bins[i]); }).join(" · ") +
        "\n  итоги: " + (reasons || "—")
    };
  }

  // компактный разбор прямо на экране проигрыша: сначала этот заход,
  // потом сводка по текущему морю и по второму — чтобы не лазить в настройки
  function deathSummary(lastReason, lastBounces) {
    var mine = LOG.filter(function (r) { return r.sea === sea.id; });
    var other = SEAS.filter(function (sd) { return sd.id !== sea.id; })[0];
    var others = other ? LOG.filter(function (r) { return r.sea === other.id; }) : [];
    var last = LOG[LOG.length - 1] || {};
    var le = (last.e || []).slice(-6);
    var lastLine = "<b>" + lastBounces + " прыжков · " + lastReason + "</b>";
    if (le.length) {
      lastLine += "  тапы: " + le.map(function (v) { return (v > 0 ? "+" : "") + v; }).join("  ") + " мс";
    }
    function short(runs, name, isNow) {
      if (!runs.length) return (isNow ? "<span class=\"now\">" : "") + name + ": ещё нет данных" + (isNow ? "</span>" : "");
      var st = seaBlock(runs);
      var bias = Math.abs(st.mErr) < 12 ? "в момент" : (st.mErr > 0 ? "поздно " + st.mErr : "рано " + (-st.mErr)) ;
      var txt = name + ": медиана " + st.medB + " · рекорд " + st.maxB +
        " · тайминг " + bias + " мс · срывы на " + st.peak + " · серий " + st.n;
      return isNow ? "<span class=\"now\">" + txt + "</span>" : txt;
    }
    var kfLine = "калибровка " + P.latency + " мс" +
      (KF.n >= 4
        ? " · сдвиг " + (KF.x > 0 ? "+" : "") + Math.round(KF.x) + " ± " + Math.round(kfSigma()) + " мс" +
          (OPT.autocal ? (kfSigma() > 9 ? " (набираю уверенность)" : " (подстроится на следующем броске)") : " (автокалибровка выключена)")
        : " · собираю данные");
    var lines = [lastLine, short(mine, seaName(sea.id), true), kfLine];
    if (other) lines.push(short(others, seaName(other.id), false));
    // вердикт: тайминг или вода
    if (mine.length >= 3) {
      var st = seaBlock(mine);
      var late = 0, early = 0, dig = 0;
      mine.forEach(function (r) {
        if (r.d === "поздно") late++;
        else if (r.d === "рано") early++;
        else dig++;
      });
      var verdict;
      if (Math.abs(st.mErr) >= 25) verdict = st.mErr > 0
        ? "систематически опаздываешь — попробуй компенсацию задержки выше"
        : "систематически спешишь — компенсацию ниже";
      else if (dig > late + early) verdict = "тайминг ровный — губит вода (гребни и усталость)";
      else verdict = "тайминг ровный — срывы случайные, дело в скорости ритма";
      lines.push("→ " + verdict);
    }
    return lines.join("\n");
  }

  function logSummary() {
    if (!LOG.length) return "журнал пуст — сыграй пару заходов";
    var runs = LOG.length;
    var lastRun = LOG[LOG.length - 1];
    var lastErrs = (lastRun.e || []).slice(-10);
    // разбивка по морям и автоматический вывод, что именно виновато
    var blocks = [], ids = [];
    SEAS.forEach(function (sd) {
      var rs = LOG.filter(function (r) { return r.sea === sd.id; });
      if (rs.length) { blocks.push(seaName(sd.id).toUpperCase() + "\n" + seaBlock(rs).text); ids.push({ id: sd.id, st: seaBlock(rs) }); }
    });
    var verdict = "";
    if (ids.length >= 2) {
      var a0 = ids[0].st, b0 = ids[1].st;
      var dErr = Math.abs(a0.mErr - b0.mErr);
      var ratio = (Math.max(a0.medB, b0.medB) + 1) / (Math.min(a0.medB, b0.medB) + 1);
      var worse = a0.medB < b0.medB ? ids[0] : ids[1];
      if (ratio < 1.6) verdict = "моря даются примерно одинаково — крутить нечего";
      else if (dErr >= 15) verdict = "на «" + seaName(worse.id) + "» ты опаздываешь сильнее (" + worse.st.mErr + " мс против " + (worse === ids[0] ? b0.mErr : a0.mErr) + ") — это тайминг: расширить окно или поднять компенсацию задержки";
      else verdict = "тайминг на обоих морях одинаковый, а результат разный — дело в воде: крутить высоту валов, автодоворот и вязкость на «" + seaName(worse.id) + "»";
    }

    return "заходов в журнале: " + runs +
      "\n\n" + blocks.join("\n\n") +
      (verdict ? "\n\nвывод: " + verdict : "") +
      "\n\nпоследний заход: " + lastRun.b + " отскоков, " + lastRun.d + " (" + seaName(lastRun.sea) + ")" +
      (lastErrs.length ? "\n  ошибки последних тапов, мс: " + lastErrs.join(", ") : "");
  }
  function anDayKey(off) {
    var d = new Date();
    if (off) d.setDate(d.getDate() + off);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function anLoad() {
    if (AN.mem) return AN.mem;
    try { AN.mem = JSON.parse(localStorage.getItem(AN.key) || "null"); } catch (e) { AN.mem = null; }
    if (!AN.mem || !AN.mem.days) AN.mem = { v: 1, days: {} };
    return AN.mem;
  }
  function anSave() { try { localStorage.setItem(AN.key, JSON.stringify(AN.mem)); } catch (e) {} }
  function anDay() {
    var st = anLoad(), k = anDayKey(0);
    if (!st.days[k]) {
      st.days[k] = { s: 0, r: 0, b: [], d: {}, ms: 0 };
      var keys = Object.keys(st.days).sort();
      while (keys.length > 60) { delete st.days[keys.shift()]; }
    }
    return st.days[k];
  }
  function anPing(name) {
    if (!/github\.io$/.test(location.hostname)) return;
    try { new Image().src = "https://hits.sh/newyurk.github.io/night-skip/" + name + ".svg?r=" + Math.random(); } catch (e) {}
  }
  function anSession() {
    if (AN.sessionSent) return;
    AN.sessionSent = true;
    var st = anLoad(), day = anDay();
    day.s++;
    anPing("session");
    if (st.days[anDayKey(-1)] && !day.ret) { day.ret = 1; anPing("return"); }
    anSave();
  }
  function anRun(bounces, reason, seconds, seaId) {
    var day = anDay();
    day.r++;
    // час суток: от него зависит, имеет ли смысл утренний ритуал вообще.
    // Три строки сейчас дешевле недели работы вслепую.
    if (!day.h) day.h = new Array(24).fill(0);
    day.h[new Date().getHours()]++;
    if (day.b.length < 400) day.b.push(bounces);
    day.d[reason] = (day.d[reason] || 0) + 1;
    day.ms += Math.round(seconds * 1000);
    // и отдельно по морям — чтобы видеть, где именно тяжело
    if (seaId) {
      if (!day.sea) day.sea = {};
      var q = day.sea[seaId] || (day.sea[seaId] = { r: 0, b: [], d: {}, ms: 0 });
      q.r++;
      if (q.b.length < 400) q.b.push(bounces);
      q.d[reason] = (q.d[reason] || 0) + 1;
      q.ms += Math.round(seconds * 1000);
    }
    anSave();
    anPing(bounces <= 5 ? "run-0-5" : bounces <= 15 ? "run-6-15" : bounces <= 30 ? "run-16-30" : "run-31plus");
  }
  function seaTotals(st) {
    var acc = {};
    Object.keys(st.days).forEach(function (k) {
      var sd = st.days[k].sea; if (!sd) return;
      Object.keys(sd).forEach(function (id) {
        var q = acc[id] || (acc[id] = { r: 0, b: [], ms: 0 });
        q.r += sd[id].r; q.ms += sd[id].ms; q.b = q.b.concat(sd[id].b || []);
      });
    });
    var ids = Object.keys(acc);
    if (!ids.length) return "";
    return "\n" + ids.map(function (id) {
      var q = acc[id];
      return "  " + seaName(id) + ": серий " + q.r + " · медиана " + med(q.b) +
        " · максимум " + (q.b.length ? Math.max.apply(null, q.b) : 0) +
        " · " + Math.round(q.ms / 60000) + " мин";
    }).join("\n");
  }

  function anSummary() {
    var st = anLoad(), days = Object.keys(st.days).sort();
    var runs = 0, sess = 0, ms = 0, all = [], deaths = {}, rets = 0;
    days.forEach(function (k) {
      var d = st.days[k];
      runs += d.r; sess += d.s; ms += d.ms; all = all.concat(d.b);
      if (d.ret) rets++;
      Object.keys(d.d).forEach(function (r) { deaths[r] = (deaths[r] || 0) + d.d[r]; });
    });
    all.sort(function (x, y) { return x - y; });
    // не med: так называется глобальная функция медианы, и переменная её затеняла —
    // любой будущий вызов med() внутри anSummary уронил бы панель
    var medAll = all.length ? all[Math.floor(all.length / 2)] : 0;
    var mx = all.length ? all[all.length - 1] : 0;
    var saved = 0, slept = 0;
    Object.keys(deaths).forEach(function (r) { if (r === "выдохся") slept += deaths[r]; else saved += deaths[r]; });
    var detail = Object.keys(deaths).map(function (r) { return r + " " + deaths[r]; }).join(", ");
    var dstr = (saved || slept)
      ? ("на облаке " + saved + (slept ? " · уснула " + slept : "") + (detail ? " (" + detail + ")" : ""))
      : "—";
    var verLine = "сборка: " + BUILD;
    var tapLine = "касание: " + (TAP.live ? (TAP.src + " · сила " + TAP.strength.toFixed(2)) : "датчик молчит (нейтраль)");
    return verLine + "\n" + tapLine + "\nдней: " + days.length + " (возвратов: " + rets + ") · сессий: " + sess + " · прыжковых серий: " + runs +
      "\nпрыжки за серию: медиана " + medAll + ", максимум " + mx +
      "\nсредняя серия: " + (runs ? Math.round(ms / runs / 100) / 10 : 0) + " с · всего в игре: " + Math.round(ms / 60000) + " мин" +
      "\nитоги: " + dstr + seaTotals(st);
  }


  // ─────────────────────────────────────────────────────────────────────────
  // КАРТИНА НОЧИ. Блок сплошной и самодостаточный: он ничего не решает в игре,
  // только смотрит. Ни одно значение P или OPT от него не зависит, ни один
  // пиксель не появляется на игровом экране во время захода. Удаляется одним
  // вырезанием от этой черты до парной ниже.
  //
  // Модель в трёх словах: каждое касание воды — источник волны. Длина волны
  // источника равна длине самого шага (пространственный период походки овцы),
  // скорость — по той же дисперсии c = sqrt(g*L/2pi), что уже стоит в
  // swellSpeed(). Картина ночи — сумма всех этих волн, снятая в момент их
  // рождения: у каждой гребень в точке касания, фаза нулевая у всех. Это
  // пространственная интерференция, карта того, где волны встретились бы, —
  // а НЕ эволюция во времени. Если брать реальное прошедшее время, c*t за
  // ночь набегает на километры и поле вырождается в шум; не «чинить».
  var PIC = {
    key: "ns_night", gkey: "ns_gallery", hkey: "ns_hop", seenKey: "ns_pic_seen",
    maxSrc: 3000,        // потолок источников на ночь
    keepFull: 21,        // ночей с полными данными
    cut: 5,              // обрезание огибающей, в длинах волны
    kappa: 2.5,
    gw: 128, gh: 192,    // сетка картины
    zSpan: 420,          // МИРОВАЯ высота кадра, не подгоняется под ночь
    nref: 4,             // насыщение «уверенности»
    budget: 12e6,        // сторож стоимости, ячеек*источников
    saveFail: 0
  };

  function b64enc(bytes) {
    var s = "", i, n = bytes.length;
    for (i = 0; i < n; i += 4096) s += String.fromCharCode.apply(null, bytes.slice(i, i + 4096));
    try { return btoa(s); } catch (e) { return ""; }
  }

  // Источник — 3 байта, и это приращения от прошлого касания, а не абсолют:
  // dz редко больше 32, |dx| редко больше 16, а z у рекордного захода доходит
  // до полутора тысяч — абсолютные координаты стоили бы вдвое дороже.
  // Длина шага d НЕ хранится: она выводится как hypot(dx,dz), поэтому не может
  // разойтись с координатами.
  function picPush(q, dx, dz, hop, clean) {
    q.push(Math.max(0, Math.min(255, Math.round(dx * 8) + 128)));
    q.push(Math.max(0, Math.min(255, Math.round(dz * 8))));
    q.push(Math.min(127, Math.max(0, Math.round(hop * 8))) | (clean ? 128 : 0));
  }
  // ЛЕНТА ТАПОВ. Игра и так собирает её каждый заход (S.tape) и выбрасывает
  // на рестарте, хотя в коде рядом написано, что ленты вместе с датой и морем
  // достаточно, чтобы переиграть заход целиком. Значит сохранять надо её,
  // а не выбранный сегодня набор признаков: любой будущий рисовальщик
  // пересчитает из неё что угодно — наклон воды под касанием, угол атаки,
  // момент, когда овечка догнала собственную зыбь, — включая ночи, сыгранные
  // до того, как он был написан.
  //
  // Семь байт на тап, и точность тут не роскошь. Заход хаотичен: одно
  // касание, съехавшее с «чисто» на «обычное», переключает затухание
  // с 0.962 на 0.918, и дальше расходится вся энергетическая дорожка.
  // Проверено измерением: при кванте в миллисекунду и сотую руля заход
  // на 23 отскока переигрывался в 21, на 26 — в 19. Кванты ниже (сотая
  // миллисекунды по времени, десятитысячная по рулю и силе) дают
  // совпадение отскок в отскок.
  // Время — АБСОЛЮТНОЕ и с той же точностью, с какой оно лежит в памяти
  // (микросекунда). Приращения по сотой миллисекунды казались экономнее,
  // но их приходится складывать, и ошибка копится вдоль захода: измерено —
  // при накоплении на пятом-седьмом касании переворачивался флаг «чисто»,
  // затухание переключалось с 0.962 на 0.918, и заход дальше шёл другой
  // дорогой (49 отскоков против 25 при переигровке). Лишний байт на тап
  // против бессмысленного архива.
  function picTapeEnc(tape) {
    if (!tape || !tape.length) return "";
    var b = [], i;
    for (i = 0; i < tape.length; i++) {
      var simT = (typeof tape[i].st === "number") ? tape[i].st : tape[i].t;
      var us = Math.max(0, Math.min(4294967295, Math.round(simT * 1000000)));
      b.push(us & 255, (us >>> 8) & 255, (us >>> 16) & 255, (us >>> 24) & 255);
      // поправка доставки события: разница между судимым и физическим временем
      var sh = Math.max(0, Math.min(65535, Math.round((tape[i].t - simT) * 1000000) + 32768));
      b.push(sh & 255, (sh >> 8) & 255);
      var rl = Math.max(0, Math.min(20000, Math.round((tape[i].rel + 1) * 10000)));
      b.push(rl & 255, (rl >> 8) & 255);
      var pw = Math.max(0, Math.min(20000, Math.round((tape[i].s === undefined ? 0.35 : tape[i].s) * 10000)));
      b.push(pw & 255, (pw >> 8) & 255);
    }
    return b64enc(b);
  }
  function picTapeDec(p) {
    var s; try { s = atob(p || ""); } catch (e) { return []; }
    var n = (s.length / 10) | 0, out = [], i;
    for (i = 0; i < n; i++) {
      var o = i * 10;
      var us = (s.charCodeAt(o) | (s.charCodeAt(o + 1) << 8) | (s.charCodeAt(o + 2) << 16) | (s.charCodeAt(o + 3) << 24)) >>> 0;
      var t = us / 1000000;
      var sh = ((s.charCodeAt(o + 4) | (s.charCodeAt(o + 5) << 8)) - 32768) / 1000000;
      out.push({
        st: +t.toFixed(6),
        t: +(t + sh).toFixed(6),
        rel: +((s.charCodeAt(o + 6) | (s.charCodeAt(o + 7) << 8)) / 10000 - 1).toFixed(4),
        s: +((s.charCodeAt(o + 8) | (s.charCodeAt(o + 9) << 8)) / 10000).toFixed(4)
      });
    }
    return out;
  }

  function picDecode(p) {
    var s; try { s = atob(p); } catch (e) { return []; }
    var n = (s.length / 3) | 0, out = [], x = 0, z = 0, i;
    for (i = 0; i < n; i++) {
      var dx = (s.charCodeAt(i * 3) - 128) / 8;
      var dz = s.charCodeAt(i * 3 + 1) / 8;
      var b2 = s.charCodeAt(i * 3 + 2);
      x += dx; z += dz;
      out.push({ x: x, z: z, d: Math.sqrt(dx * dx + dz * dz), a: (b2 & 127) / 8, c: (b2 & 128) ? 1 : 0 });
    }
    return out;
  }

  // ── распределение длины шага ─────────────────────────────────────────────
  // Сиблинг Калмана из kfUpdate: тот оценивает систематический сдвиг тапа,
  // этот — распределение длины твоего шага, чтобы цвет означал «длинный ДЛЯ
  // ТЕБЯ», а не «длиннее восьми». Гистограмма, а не EWMA среднего с дисперсией:
  // распределение скошено вправо, и гауссовы перцентили сожмут ровно тот
  // правый хвост, который и есть «длинный шаг». Плюс главное — гистограммы
  // складываются между игроками, а EWMA нет: когда появятся чужие данные,
  // общее распределение будет поэлементной суммой, и рисовальщик не изменится.
  var HD = { v: 1, n: 0, bins: new Array(24).fill(0), seen: null, src: "self" };
  // априор снят ботом на штиле: пока проб мало, оценка тянется к нему
  var HD_PRIOR = [0, 0, 0, .01, .03, .10, .22, .19, .15, .11, .07, .05, .03, .02, .01, .01, 0, 0, 0, 0, 0, 0, 0, 0];
  var HD_PRIOR_W = 40;
  function hdLoad() {
    try {
      var o = JSON.parse(localStorage.getItem(PIC.hkey) || "null");
      if (o && o.bins && o.bins.length === 24) { HD.bins = o.bins; HD.n = o.n || 0; HD.seen = o.seen || null; }
    } catch (e) {}
  }
  function hdSave() { try { localStorage.setItem(PIC.hkey, JSON.stringify({ v: 1, n: HD.n, bins: HD.bins, seen: HD.seen })); } catch (e) { PIC.saveFail++; } }
  function hdAdd(d) { HD.bins[Math.max(0, Math.min(23, d | 0))]++; HD.n++; }
  // затухание раз в ночь: игрок растёт, и цвет должен показывать контраст
  // внутри его СЕГОДНЯШНЕЙ манеры, а не хвалить за то, как он прыгал полгода назад
  function hdNight(k) { if (HD.seen !== k) { for (var i = 0; i < 24; i++) HD.bins[i] *= 0.97; HD.seen = k; } }
  function hdPriorPct(d) {
    var i = Math.max(0, Math.min(23, d | 0)), f = d - i, c = 0, j;
    for (j = 0; j < i; j++) c += HD_PRIOR[j];
    return c + HD_PRIOR[i] * f;
  }
  function hdPct(d) {
    var i = Math.max(0, Math.min(23, d | 0)), f = d - i, tot = 0, cum = 0, j;
    for (j = 0; j < 24; j++) tot += HD.bins[j];
    if (tot <= 0) return hdPriorPct(d);
    for (j = 0; j < i; j++) cum += HD.bins[j];
    var p = (cum + HD.bins[i] * f) / tot;
    var w = HD.n / (HD.n + HD_PRIOR_W);
    return w * p + (1 - w) * hdPriorPct(d);
  }
  // средние 70% собственного распределения растягиваются на весь пандус —
  // отсюда гарантия, что внутри одной ночи короткие и длинные шаги разойдутся
  function hdHue(d) { return Math.max(0, Math.min(1, (hdPct(d) - 0.15) / 0.70)); }

  // ── хранение ночи ────────────────────────────────────────────────────────
  function picNightLoad() {
    try { var o = JSON.parse(localStorage.getItem(PIC.key) || "null"); if (o && o.v === 1 && o.runs) return o; } catch (e) {}
    return null;
  }
  function picGalLoad() {
    try { var o = JSON.parse(localStorage.getItem(PIC.gkey) || "null"); if (o && o.v === 1 && o.nights) return o; } catch (e) {}
    return { v: 1, dropped: 0, nights: [] };
  }
  function picSave(k, o) { try { localStorage.setItem(k, JSON.stringify(o)); return true; } catch (e) { PIC.saveFail++; return false; } }

  function picNightStats(n) {
    var runs = n.runs || [], src = 0, b = 0, z = 0, cl = 0, i;
    for (i = 0; i < runs.length; i++) {
      var s = picDecode(runs[i].p);
      src += s.length; b += runs[i].b || 0;
      if (s.length) { z = Math.max(z, s[s.length - 1].z); }
      for (var j = 0; j < s.length; j++) if (s[j].c) cl++;
    }
    return { k: n.k, r: runs.length, n: src, b: b, z: Math.round(z), sea: n.sea || "", clean: src ? cl / src : 0, cut: n.cut || 0 };
  }

  // Перекат ночи: увидели новый ключ дня — прошлая ночь уезжает в галерею.
  // Свёртка старых ночей в строку и есть «компоновка результатов»: данные
  // ужимаются до чисел, картинка потом перерисовывается из того, что осталось.
  function picRoll(k) {
    var cur = picNightLoad();
    if (cur && cur.k !== k) {
      var g = picGalLoad(), st = picNightStats(cur);
      st.full = true; st.runs = cur.runs;
      g.nights = g.nights.filter(function (e) { return e.k !== cur.k; });
      g.nights.unshift(st);
      var full = 0;
      for (var i = 0; i < g.nights.length; i++) {
        if (g.nights[i].full) { full++; if (full > PIC.keepFull) { delete g.nights[i].runs; g.nights[i].full = false; } }
      }
      while (g.nights.length > 400) { g.nights.pop(); g.dropped++; }
      picSave(PIC.gkey, g);
      cur = null;
    }
    if (!cur) cur = { v: 1, k: k, sea: sea.id, runs: [], cut: 0 };
    return cur;
  }

  function picLogRun(seaId, q, bounces, tape, reason) {
    if (!q || !q.length) return;
    var k = todayKey();
    hdNight(k);
    var night = picRoll(k);
    var have = 0, i;
    for (i = 0; i < night.runs.length; i++) have += (night.runs[i].b || 0);
    if (have * 3 >= PIC.maxSrc * 3) { night.cut++; picSave(PIC.key, night); return; }
    var rec = { s: seaId, o: 0, b: bounces, p: b64enc(q) };
    if (tape && tape.length) rec.t = picTapeEnc(tape);
    if (reason) rec.d = reason;
    // Компенсация задержки обязана лежать рядом с лентой. Её двигает
    // автокалибровка между заходами, сама, без участия игрока — и переигровка
    // ленты по сегодняшнему значению судит те же тапы другими числами.
    // Проверено: заход на 20 отскоков переигрался в 5, потому что фильтр
    // успел сдвинуть latency. Два байта против бессмысленного архива.
    rec.l = Math.round(P.latency);
    // Числа переигровки нужны, только если игрок их двигал. Осторожно с
    // latency: в ту же ячейку `custom` пишет и автокалибровка, поэтому после
    // первого же её срабатывания ключ появляется у всех — и признак «игрок
    // настраивал вручную» превращается в «игрок хоть раз играл». Задержка
    // и так лежит отдельно в rec.l, здесь она лишняя.
    var ck = Object.keys(custom).filter(function (k) { return k !== "latency"; });
    if (ck.length) { rec.pp = {}; for (var c = 0; c < ck.length; c++) rec.pp[ck[c]] = custom[ck[c]]; }
    night.runs.push(rec);
    picSave(PIC.key, night);
    // гистограмма кормится расшифрованными шагами — тем же путём, каким их
    // потом прочитает рисовальщик, чтобы источник истины был один
    var src = picDecode(night.runs[night.runs.length - 1].p);
    for (i = 0; i < src.length; i++) hdAdd(src[i].d);
    hdSave();
  }

  // ── рисовальщик ──────────────────────────────────────────────────────────
  function srcLen(d) { return Math.max(1.5, Math.min(20, d)); }
  var ENV_LUT = null, WAV_LUT = null;
  function picLUT() {
    if (ENV_LUT) return;
    ENV_LUT = new Float32Array(512); WAV_LUT = new Float32Array(512);
    for (var j = 0; j < 512; j++) {
      var u = j / 511 * PIC.cut;
      // exp(-u/k) — затухание с пробегом, пропорциональным длине волны;
      // 1/sqrt(1+2u) — честное цилиндрическое расхождение, родственник
      // множителя 1/(1+R*0.12) в ringH
      var e = Math.exp(-u / PIC.kappa) / Math.sqrt(1 + 2 * u);
      ENV_LUT[j] = e; WAV_LUT[j] = e * Math.cos(2 * Math.PI * u);
    }
  }

  function picPrepare(night, opts) {
    picLUT();
    var runs = night.runs || [], all = [], i, j;
    for (i = 0; i < runs.length; i++) {
      var s = picDecode(runs[i].p);
      for (j = 0; j < s.length; j++) all.push(s[j]);
    }
    var gw = (opts && opts.gw) || PIC.gw, gh = (opts && opts.gh) || PIC.gh;
    var xs = [], zs = [];
    for (i = 0; i < all.length; i++) { xs.push(Math.abs(all[i].x)); zs.push(all[i].z); }
    xs.sort(function (a, b) { return a - b; }); zs.sort(function (a, b) { return a - b; });
    var xr = Math.max(10, xs.length ? xs[Math.floor(xs.length * 0.98)] * 1.15 : 10);
    // Кадр по дальности ФИКСИРОВАН. Подгонка под ночь стирала главное:
    // ночь на 20 отскоков и ночь на 55 одинаково заполняли лист, то есть
    // единственное настоящее достижение ночи — как далеко ты ушла —
    // вычиталось масштабированием. Теперь короткая ночь занимает низ кадра,
    // а выше остаётся вода, куда никто не дошёл. Рамка растёт только под
    // исключительную ночь, и это честно: масштаб один для всех обычных.
    var zr = (opts && opts.zr) || PIC.zSpan;
    var zmax = zs.length ? zs[zs.length - 1] : 0;
    if (zmax > zr) zr = zmax * 1.04;
    // сторож стоимости: плотную ночь роняем в разрешении, а не ждём секунду
    var perSrc = (2 * PIC.cut * 6.5 / (2 * xr / gw)) * (2 * PIC.cut * 6.5 / (zr / gh));
    if (all.length * perSrc > PIC.budget) { gw = Math.round(gw * 0.75); gh = Math.round(gh * 0.75); }
    return {
      night: night,
      src: all, i: 0, gw: gw, gh: gh, x0: -xr, x1: xr, z1: zr,
      cw: 2 * xr / gw, ch: zr / gh,
      F: new Float32Array(gw * gh), N: new Float32Array(gw * gh),
      Hn: new Float32Array(gw * gh), Hd: new Float32Array(gw * gh),
      W: new Float32Array(gw * gh),
      flat: 0
    };
  }

  // Вода дня — фон картины, и это не украшение. Без неё картина не зависит
  // от даты вовсе: угол и длина валов приходят из дневного сида, то есть
  // грань узора у каждой ночи своя, и утверждение «каждая ночь выглядит
  // по-своему, потому что вода своя» становится правдой, а не обещанием.
  // Берётся при t = 0: эхо отскоков (RW) при нулевом времени не срабатывает —
  // возраст колец отрицательный, — поэтому фон чист от следов последнего захода.
  function picWater(st) {
    var mn = 1e9, mx = -1e9, i, j;
    for (j = 0; j < st.gh; j++) {
      var wz = j * st.ch;
      for (i = 0; i < st.gw; i++) {
        var wx = st.x0 + i * st.cw;
        // 2x2 на ячейку: короткая составляющая валов иначе попадает почти
        // в шаг сетки и даёт полосы вместо воды
        var v = (waveH(wx - st.cw * 0.25, wz - st.ch * 0.25, 0) +
                 waveH(wx + st.cw * 0.25, wz - st.ch * 0.25, 0) +
                 waveH(wx - st.cw * 0.25, wz + st.ch * 0.25, 0) +
                 waveH(wx + st.cw * 0.25, wz + st.ch * 0.25, 0)) * 0.25;
        st.W[j * st.gw + i] = v;
        if (v < mn) mn = v; if (v > mx) mx = v;
      }
    }
    var span = Math.max(1e-6, mx - mn);
    for (i = 0; i < st.W.length; i++) st.W[i] = (st.W[i] - mn) / span * 2 - 1;
  }

  function picAddSource(st, s) {
    var lam = srcLen(s.d), R = PIC.cut * lam;
    var a = Math.max(0.05, Math.min(1.2, s.a / 9));
    var hue = hdHue(s.d);
    // «не разрешено — не рисуем»: если волна проецируется меньше чем в две
    // ячейки, косинус даст муар, а не рябь. Тогда источник кладётся одной
    // огибающей — короткие рваные шаги честно превращаются в туман,
    // длинные ровные остаются видимым рельефом
    var flat = (lam / st.cw < 2) || (lam / st.ch < 2);
    if (flat) st.flat++;
    var gx = (s.x - st.x0) / st.cw, gz = s.z / st.ch;
    var i0 = Math.max(0, Math.floor(gx - R / st.cw)), i1 = Math.min(st.gw - 1, Math.ceil(gx + R / st.cw));
    var j0 = Math.max(0, Math.floor(gz - R / st.ch)), j1 = Math.min(st.gh - 1, Math.ceil(gz + R / st.ch));
    var invLam = 1 / lam, scale = 511 / PIC.cut;
    for (var j = j0; j <= j1; j++) {
      var wz = j * st.ch - s.z, row = j * st.gw;
      for (var i = i0; i <= i1; i++) {
        var wx = st.x0 + i * st.cw - s.x;
        var u = Math.sqrt(wx * wx + wz * wz) * invLam;
        if (u > PIC.cut) continue;
        var idx = (u * scale) | 0;
        var e = ENV_LUT[idx], w = a * e;
        st.F[row + i] += flat ? 0 : a * WAV_LUT[idx];
        st.N[row + i] += e;
        st.Hn[row + i] += w * hue;
        st.Hd[row + i] += w;
      }
    }
  }

  function picHex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  // Палитра ТОЛЬКО картины. PAL игры одноцветно-циановая, и на одном тоне
  // «длинный шаг выглядит иначе» невыполнимо без потери яркостной оси.
  var PICPAL = { cold: [78, 142, 204], warm: [226, 190, 132], crest: [236, 246, 255] };

  // Композитор: СТАДО НОЧИ.
  //
  // Две прошлые попытки (интерференционное поле и гребни воды) провалились
  // одинаково: получалась визуализация данных, а не вещь из игры. Здесь
  // картинка рисуется ТЕМ ЖЕ кодом, которым игра рисует героя, — drawSheep,
  // drawCloud, drawZzz, — поэтому похожей на игру она получается по построению,
  // а не по стараниям.
  //
  // Смысл прямой и совпадает с премисой: игра про то, как считают овец перед
  // сном. Утром ты видишь, скольких насчитала. Один заход — одна овца.
  // Дальше ушла — выше и мельче, ушла в темноту. Выдохлась — спит, над ней
  // «z-z-z»; сорвалась — облачко успело подхватить. Лучший заход светится.
  // Ничего не копится между ночами: стадо — это ровно твои заходы, не больше.
  var FL = { scale: 3, focal: 640, near: 4.6, far: 13.5, spread: 0.62 };

  function picComposite(st) {
    var S2 = FL.scale, W2 = st.gw * S2, H2 = st.gh * S2;
    var cvs = document.createElement("canvas");
    cvs.width = W2; cvs.height = H2;
    var g = cvs.getContext("2d");

    // ночь: небо игры, к низу — вода
    var sky = g.createLinearGradient(0, 0, 0, H2);
    sky.addColorStop(0, PAL.sky[0]);
    sky.addColorStop(0.62, PAL.gr[0]);
    sky.addColorStop(1, PAL.gr[2]);
    g.fillStyle = sky; g.fillRect(0, 0, W2, H2);

    var runs = (st.night && st.night.runs) || [];
    if (!runs.length) return cvs;

    var seed = xmur3(String((st.night && st.night.k) || "") + ":flock");
    var rnd = mulberry32(seed());

    var info = [], i, maxB = 1, bestI = 0;
    for (i = 0; i < runs.length; i++) {
      var src = picDecode(runs[i].p);
      var b = runs[i].b || src.length;
      if (b > maxB) { maxB = b; bestI = i; }
      info.push({ b: b, d: runs[i].d || "", lastX: src.length ? src[src.length - 1].x : 0, r: rnd() });
    }

    var order = info.map(function (o, k) { return k; }).sort(function (a, c) { return info[a].b - info[c].b; });

    var savedCtx = ctx, savedS = S, savedFocal = focal;
    focal = FL.focal;
    try {
      ctx = g;
      for (var oi = order.length - 1; oi >= 0; oi--) {
        var k = order[oi], o = info[k];
        var t = maxB > 1 ? Math.pow(o.b / maxB, 0.75) : 0;      // как далеко ушла
        var dz = FL.near + (FL.far - FL.near) * t;
        var y = H2 * 0.87 - t * H2 * 0.60;
        var x = W2 * 0.5 + (o.r - 0.5) * W2 * FL.spread + o.lastX * 1.6;
        x = Math.max(W2 * 0.11, Math.min(W2 * 0.89, x));
        var sleeping = o.d === "выдохся";

        S = { t: o.r * 7, vy: 0, vyVis: 0, squash: 0, tuckNow: sleeping ? 0 : 1 };

        var fade = 0.28 + 0.72 * (1 - t);                        // дальние тусклее

  // Считается ТОЛЬКО по открытию экрана и кусками по 8 мс — путь 60 fps
  // к этому коду не прикасается вовсе.
  function buildPicture(night, opts, done) {
    var st = picPrepare(night, opts), t0 = performance.now();
    picWater(st);
    (function stepBuild() {
      var t = performance.now();
      while (st.i < st.src.length && performance.now() - t < 8) picAddSource(st, st.src[st.i++]);
      if (st.i < st.src.length) return setTimeout(stepBuild, 0);
      var cv = picComposite(st);

  // ── конец блока «картина ночи» ───────────────────────────────────────────


  function bestKey() { return "skip_best_" + sea.id; }
  function dayBestKey() { return "skip_dbest_" + sea.id + "_" + todayKey(); }
  function dayBest() {
    try { return parseInt(localStorage.getItem(dayBestKey()) || "0", 10) || 0; } catch (e) { return 0; }
  }
  function loadBest() {
    try {
      best = parseInt(localStorage.getItem(bestKey()) || "0", 10) || 0;
      ghostZ = parseFloat(localStorage.getItem(bestKey() + "_z") || "0") || 0;
    } catch (e) { best = 0; ghostZ = 0; }
  }

  // Кольца эха НЕ привязаны к амплитуде моря — и это осознанно.
  // Пробовали `ringAmp = daily.amp * 1.15`: совет был верен для укороченных
  // волн (штиль 0.03, волнение 0.117), но когда волны вернулись в исходные,
  // на волнении вышло 0.39 вместо 0.1 — вчетверо сильнее. А при посадке
  // кольцо ещё умножается на 1.7 и 2.4, так что всплеск шёл во весь экран.
  // Фиксированные 0.1 держатся с самого начала и работают на обоих морях.
  function applySea(s) {
    sea = s;
    try { localStorage.setItem("ns_sea", s.id); } catch (e) {}   // выбор переживает перезагрузку
    appliedDay = todayKey();
    refreshMoon();          // сутки могли смениться — пересчитываем фазу и прилив
    daily = computeDaily(s);
    P.waveAmp = daily.amp; P.waveSpeed = daily.speed; P.wave2 = daily.w2; P.waveLen = daily.len; P.hop = s.hop;
    P.gravity = s.g; P.speed = s.fwd; PAL = s.pal; P.assist = s.assist;
    Object.keys(custom).forEach(function (k) { if (k in P) P[k] = custom[k]; });
    setWaveAngles(daily.a1, daily.a2);
    rebuildGradients();
    refreshSliders();
    loadBest();
    paintSeas();
    newRun();
  }

  // звёздное небо: генерится один раз, слегка смещается вслед за камерой
  var STARS = [];
  (function () {
    for (var i = 0; i < 130; i++) {
      STARS.push({ x: Math.random(), y: Math.random(), m: 0.25 + Math.random() * 0.75, p: Math.random() * 9 });
    }
  })();

  function seedSparks(z0) {
    sparks.length = 0;
    for (var i = 0; i < Q.sparks; i++) sparks.push({ x: (Math.random() - 0.5) * 70, z: z0 + Math.random() * 200, p: Math.random() });
  }

  function newRun() {
    S = {
      phase: "ready", t: 0, acc: 0,
      x: 0, y: 0.55, z: 0, vx: 0, vy: P.hop, vz: P.speed, hop: P.hop,
      camX: 0,
      nextContact: 0, interval: 0.6, fullInterval: 0.6,
      bounces: 0, perfects: 0, combo: 0,
      armed: false, pendingPerfect: false,
      trail: [], tapErrs: [], lastErr: null, lastErrAt: -9,
      srcQ: [], lx: 0, lz: 0,
      deadAt: 0, flash: 0, lift: 0, shake: 0, reason: null, ghostHit: 0
    };
    rings.length = 0; drops.length = 0;
    seedSparks(-20);
    paintCard("ready");
    paintSeas();
  }

  // угол атаки в точке касания: крутое падение + встречный склон = камень зарывается
  function attackAt(x, y, z, vx, vy0, vz, t0) {
    var c = solveContact(x, y, z, vx, vy0, vz, t0);
    var vyAt = vy0 - P.gravity * c.t;
    var sp = Math.sqrt(vz * vz + vx * vx) || 1;
    var sl = (waveGradZ(c.x, c.z, t0 + c.t) * vz + waveGradX(c.x, c.z, t0 + c.t) * vx) / sp;
    return Math.atan2(Math.abs(vyAt), sp) + Math.atan(Math.max(0, sl));
  }

  var appliedDay = null;
  function launch(vx0) {
    // Полночь: вода сменилась — пересобираем море и ПРОДОЛЖАЕМ бросок.
    // Раньше здесь стоял return, и первый тап игрока после полуночи пропадал
    // впустую: заход перезапускался, а бросок не происходил.
    if (appliedDay !== todayKey()) applySea(sea);
    kfApply();   // подстройка компенсации задержки — только на старте нового захода
    // вода — сегодняшняя, у всех одна; честный старт добирается
    // детерминированным сдвигом фазы, тоже одинаковым у всех
    off1 = daily ? daily.off1 : 0;
    off2 = daily ? daily.off2 : 0;
    var limit = (P.digAngle - 5) * Math.PI / 180 + P.assist * (P.pitchMax * Math.PI / 180);
    for (var a = 0; a < 40; a++) {
      if (attackAt(0, 0.55, 0, vx0 || 0, P.hop, P.speed, 0) < limit) break;
      off1 += 0.7; off2 += 1.1;
    }
    S.phase = "fly"; S.t = 0; S.acc = 0;
    S.x = 0; S.y = 0.55; S.z = 0; S.vx = vx0 || 0; S.vy = P.hop; S.vz = P.speed; S.hop = P.hop;
    S.camX = 0;
    S.bounces = 0; S.perfects = 0; S.combo = 0; S.armed = false;
    S.tapErrs = []; S.lastErr = null; S.steerTarget = 0;
    S.srcQ = []; S.lx = 0; S.lz = 0;
    S.reason = null; S.ghostHit = 0;
    S.nextPredict = 0;
    // лента тапов: полное описание ввода за заход. Вместе с морем и датой
    // (вода детерминирована календарным днём) её достаточно, чтобы переиграть
    // заход и пересчитать счёт независимо от клиента
    S.tape = [];
    predictContact();
    S.fullInterval = S.interval;
    rings.length = 0; drops.length = 0; RW.length = 0;
    hideCard(); paintSeas();
    audioResume();
  }

  // численный поиск касания: поверхность движется и наклонена, формулы нет
  function solveContact(x0, y0, z0, vx, vy0, vz, t0) {
    vx += tideDrift();
    var dt = 0.006, t = 0, x = x0, y = y0, z = z0, vy = vy0;
    for (var i = 0; i < 800; i++) {
      vy -= P.gravity * dt;
      x += vx * dt; y += vy * dt; z += vz * dt;
      t += dt;
      if (vy < 0 && y <= waveH(x, z, t0 + t)) return { t: t, x: x, z: z };
    }
    return { t: t, x: x, z: z };
  }
  function predictContact() {
    var c = solveContact(S.x, S.y, S.z, S.vx, S.vy, S.vz, S.t);
    S.nextContact = S.t + c.t;
    S.interval = c.t;
    S.aimX = c.x; S.aimZ = c.z;
  }

  function windowMs() { return Math.max(P.windowFloor, (S.fullInterval || S.interval) * 1000 * (P.windowPct / 100)); }
  function perfectMs() { return windowMs() * (P.perfectPct / 100); }

  // ---- audio ----
  var AC = null, master = null, wet = null, amb = null;
  var SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28, 31, 33, 36];

  function makeReverb(seconds, decay) {
    var rate = AC.sampleRate, len = Math.floor(rate * seconds);
    var buf = AC.createBuffer(2, len, rate);
    // огибающая считается инкрементально: без Math.pow на каждый сэмпл
    var dk = Math.pow(1e-4, 1 / len);
    for (var ch = 0; ch < 2; ch++) {
      var d = buf.getChannelData(ch), e = 1;
      for (var i = 0; i < len; i++) { d[i] = (Math.random() * 2 - 1) * e; e *= dk; }
    }
    return buf;
  }

  function audioResume() {
    if (!OPT.sound) return;
    try {
      if (!AC) {
        // в обработчике тапа делаем только то, что требует политика автоплея:
        // создаём контекст и запускаем его. Тяжёлые буферы — следующим тиком,
        // иначе первый тап замирает на десятки миллисекунд
        AC = new (window.AudioContext || window.webkitAudioContext)();
        master = AC.createGain(); master.gain.value = 0.55;
        master.connect(AC.destination);
        watchAudioState();
        // Три буфера — это порядка 380 000 сэмплов шума, и раньше они считались
        // в одной задаче: первые секунды игры получали единый затык на главном потоке.
        // Теперь каждый буфер — своя задача, так что ни один кусок работы не длинный.
        setTimeout(function () {
          if (!AC || wet) return;
          try {
            var conv = AC.createConvolver();
            conv.buffer = makeReverb(1.4, 2.4);
            wet = AC.createGain(); wet.gain.value = 0.3;
            master.connect(conv); conv.connect(wet); wet.connect(AC.destination);
          } catch (e) {}
        }, 0);
        setTimeout(function () { if (AC) { try { getNoise(); } catch (e) {} } }, 0);
        setTimeout(function () { if (AC) { try { startAmbience(); } catch (e) {} } }, 0);
      }
      // не только "suspended": после звонка iOS оставляет контекст в "interrupted",
      // и проверка на одно лишь "suspended" молча не поднимала бы звук
      if (AC.state !== "running") AC.resume();
    } catch (e) {
      // сбрасываем весь граф, а не один AC: иначе master/wet/amb остаются
      // висеть на осиротевшем контексте, следующий вызов создаёт второй,
      // а его setTimeout выходит по уже истинному wet — и звук навсегда
      // остаётся без реверба и амбиенса до перезагрузки страницы
      AC = null; master = null; wet = null; amb = null;
    }
  }

  // iOS: во время звонка или Siri контекст уходит в состояние "interrupted", и раньше
  // из него никто не выводил — все звуки молча пропадали до конца сессии, а звук
  // в этой игре несёт тайминг. Возврат делаем и по событию, и по первому касанию.
  function watchAudioState() {
    if (!AC || AC.__watched) return;
    AC.__watched = true;
    try {
      AC.addEventListener("statechange", function () {
        if (!OPT.sound || !AC) return;
        if (AC.state === "interrupted" || AC.state === "suspended") {
          try { AC.resume(); } catch (e) {}
        }
      });
    } catch (e) {}
  }

  // тихий фон: дыхание моря + низкий гул ночи. Живёт всё время, ни разу не повторяется
  function startAmbience() {
    if (!AC || amb) return;
    try {
      var len = Math.floor(AC.sampleRate * 4);
      var buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
      var last = 0;
      for (var i = 0; i < len; i++) {
        var w = Math.random() * 2 - 1;
        last = (last + 0.02 * w) / 1.02;
        d[i] = last * 3.2;
      }
      var src = AC.createBufferSource();
      src.buffer = buf; src.loop = true;
      var bp = AC.createBiquadFilter();
      bp.type = "bandpass"; bp.frequency.value = 520; bp.Q.value = 0.5;
      var g = AC.createGain(); g.gain.value = 0.17;
      var lfo = AC.createOscillator(); lfo.frequency.value = 0.09;
      var lfoG = AC.createGain(); lfoG.gain.value = 0.1;
      lfo.connect(lfoG); lfoG.connect(g.gain);
      src.connect(bp); bp.connect(g); g.connect(master);
      src.start(); lfo.start();

      var pad = AC.createOscillator(), padG = AC.createGain();
      pad.type = "sine"; pad.frequency.value = 61.74;
      padG.gain.value = 0.07;
      var pad2 = AC.createOscillator();
      pad2.type = "sine"; pad2.frequency.value = 92.5;
      var pad2G = AC.createGain(); pad2G.gain.value = 0.028;
      var padLfo = AC.createOscillator(); padLfo.frequency.value = 0.055;
      var padLfoG = AC.createGain(); padLfoG.gain.value = 0.02;
      padLfo.connect(padLfoG); padLfoG.connect(padG.gain);
      pad.connect(padG); padG.connect(master);
      pad2.connect(pad2G); pad2G.connect(master);

  function outFor(pan) {
