  }
  // резкий толчок телефоном от себя = подсечка (жест-бонус при включённом наклоне)
  function onMotion(e) {
    var a2 = e.acceleration;
    if (!a2 || !S) return;
    if (Math.abs(a2.z || 0) + Math.abs(a2.y || 0) > 14) jerkAt = S.t;
  }
  var uiMsg = "", uiMsgUntil = 0;
  function say(m) { uiMsg = m; uiMsgUntil = performance.now() + 3000; }
  function enableTilt() {
    var D = window.DeviceOrientationEvent, M = window.DeviceMotionEvent;
    if (!D && !M) { sensorGaveUp = true; say("датчиков нет — руль тапами у краёв"); return true; }
    function ok() {
      window.addEventListener("deviceorientation", onOrient);
      window.addEventListener("devicemotion", onMotion);
      say("наклон включён — покрути телефон");
      setTimeout(function () {
        if (!sensorSeen) { sensorGaveUp = true; say("датчики молчат — руль тапами у краёв"); }
      }, 1500);
    }
    function fail(why) {
      sensorSeen = false; sensorGaveUp = true;
      say("наклона нет (" + why + ") — руль тапами у краёв");
    }
    try {
      if (D && typeof D.requestPermission === "function") {
        D.requestPermission().then(function (r) {
          if (r === "granted") ok(); else fail("доступ не дан");
        }).catch(function () { fail("закрыт песочницей браузера"); });
        if (M && typeof M.requestPermission === "function") {
          M.requestPermission().catch(function () {});
        }
      } else {
        ok();
      }
    } catch (e) { fail("ошибка запроса"); return false; }
    return true;
  }
  function tiltValue() {
    if (!OPT.tilt) return 0;
    if (keyTilt) return keyTilt;
    var d = tiltRaw - tiltZero;
    return Math.max(-35, Math.min(35, d));
  }

  function die(reason) {
    if (!S || S.phase === "dead") return;
    S.phase = "dead"; S.deadAt = S.t; S.reason = reason; S.shake = 0.35;
    var snap = { sea: sea.id, b: S.bounces, e: (S.tapErrs || []).slice(-24), iv: Math.round((S.fullInterval || 0) * 1000), hop: +S.hop.toFixed(1), lastErr: S.lastErr, t: S.t };
    setTimeout(function () {
      anRun(snap.b, reason, snap.t, snap.sea);
      logRun({ d: reason, b: snap.b, sea: sea.id, e: snap.e, iv: snap.iv, hop: snap.hop, lastErr: snap.lastErr });
    }, 0);

    S.rescue = OPT.sheep ? (reason === "выдохся" ? "sleep" : "buoy") : null;
    S.landed = false; S.landAt = 0;
    S.sinkV = reason === "выдохся" ? 0.45 : 1.6;
    S.fDamp = reason === "выдохся" ? 2.2 : 5.5;
    // прощальная волна: последний медленный круг от места, где камень ушёл под воду,
    // расходится по всему морю и покачивает отражения звёзд, проходя сквозь них
    if (OPT.echo) addRing(S.x, S.z, S.t, P.ringAmp * 2.4, 1.7, 1.5, 8);
    for (var bi = 0; bi < (OPT.sheep ? 0 : 9); bi++) {
      drops.push({ x: S.x + (Math.random() - 0.5) * 0.3, y: -0.15 - Math.random() * 0.7, z: S.z + (Math.random() - 0.5) * 0.3,
                   vx: 0, vz: 0, vy: 0.35 + Math.random() * 0.6, life: 1.6 + Math.random(), b: 1 });
    }
    thud();
    for (var i = 0; i < 10; i++) {
      drops.push({ x: S.x + (Math.random() - 0.5) * 0.5, y: 0.1 + Math.random() * 0.5, z: S.z + (Math.random() - 0.5) * 0.5,
                   vy: 1.2 + Math.random() * 1.8, vx: (Math.random() - 0.5) * 2, vz: (Math.random() - 0.5) * 2, life: 1 });
    }
    rings.push({ x: S.x, z: S.z, r: 0.25, grow: 1.6, life: 1, fade: 0.9 });
    if (S.bounces > best) {
      best = S.bounces; ghostZ = S.z;
      try { localStorage.setItem(bestKey(), String(best)); localStorage.setItem(bestKey() + "_z", String(ghostZ)); } catch (e) {}
    }
    if (S.bounces > dayBest()) {
      try { localStorage.setItem(dayBestKey(), String(S.bounces)); } catch (e) {}
    }
    paintCard("dead"); paintSeas();
  }

  // овечка коснулась воды после неудачи: всплеск, круги и мягкий звук
  function onSheepLanded() {
    rings.push({ x: S.x, z: S.z, r: 0.15, grow: 2.4, life: 1, fade: 1.0 });
    rings.push({ x: S.x, z: S.z, r: 0.05, grow: 3.6, life: 1, fade: 1.4 });
    for (var i = 0; i < 6; i++) {
      drops.push({ x: S.x + (Math.random() - 0.5) * 0.4, y: waveH(S.x, S.z, S.t) + 0.05, z: S.z + (Math.random() - 0.5) * 0.4,
                   vy: 1.2 + Math.random() * 1.6, vx: (Math.random() - 0.5) * 2, vz: (Math.random() - 0.5) * 2, life: 0.9 });
    }
    if (OPT.echo) addRing(S.x, S.z, S.t, P.ringAmp * 1.6, 2.2, 0.8, 4);
    if (AC && OPT.sound && AC.state === "running") {
      var dest = outFor((S.x - S.camX) / 7);
      spray(dest, 0.26, 1200, 0.16, 0.6);
      bubble(dest, 210, 0.2, 0.3, 2.2);
    }
  }

  function bounce() {
    var clean = !!S.pendingPerfect;
    // мягкое насыщение у потолка вместо линейного гашения: приход энергии
    // доступен на всём рабочем диапазоне, а не только «умирающему» камню
    var sat = Math.max(0.12, 1 - Math.pow(Math.max(0, S.hop) / P.ceiling, 3));
    var head = sat;
    var sp = Math.sqrt(S.vz * S.vz + S.vx * S.vx) || 1;
    // склон включает и валы моря, и собственное эхо отскоков (интерференция):
    // прыгнул на восходящий склон своей же волны — вода вернула энергию
    var slope = (waveGradZ(S.x, S.z, S.t) * S.vz + waveGradX(S.x, S.z, S.t) * S.vx) / sp;
    // замер: сколько в этом склоне от собственного эха
    S.echoPart = (OPT.echo && RW.length)
      ? ((ringH(S.x, S.z + 0.06, S.t) - ringH(S.x, S.z - 0.06, S.t)) / 0.12 * S.vz
        + (ringH(S.x + 0.06, S.z, S.t) - ringH(S.x - 0.06, S.z, S.t)) / 0.12 * S.vx) / sp
      : 0;
    S.echoSum = (S.echoSum || 0) + Math.abs(S.echoPart);
    var raw = Math.max(-0.32, Math.min(0.34, slope * P.waveGain));
    var wave = 1 + (raw > 0 ? raw * (0.15 + 0.85 * sat) : raw);

    // угол атаки: крутое падение + встречная стенка вала = камень зарывается.
    // отсюда риск высокого прыжка — он возвращается круче
    // угол атаки = крутизна падения + встречный склон − наклон плоскости камня.
    // автодоворот подтягивает камень к правильному углу; его доля — это сложность мира
    var bare = Math.atan2(Math.abs(S.vy), sp) + Math.atan(Math.max(0, slope));
    var ideal = Math.max(-P.pitchMax * Math.PI / 180, Math.min(P.pitchMax * Math.PI / 180, bare - P.goodAttack * Math.PI / 180));
    var pitchEff = ideal * (0.55 + 0.45 * P.assist);   // прощение угла зависит от моря
    S.pitchEff = pitchEff;
    var attack = bare - pitchEff;
    var graze = false;
    if (attack > P.digAngle * Math.PI / 180) {
      // правило честности: идеальный тап всегда спасает. Чистый тап на злом
      // гребне — камень срезает его с потерей силы; грязный — зарывается
      if (clean) {
        graze = true;
        rings.push({ x: S.x, z: S.z, r: 0.2, grow: 2.2, life: 1, fade: 1.1 });
      } else {
        S.y = waveH(S.x, S.z, S.t);
        rings.push({ x: S.x, z: S.z, r: 0.2, grow: 1.4, life: 1, fade: 0.9 });
        die("зарылся");
        return;
      }
    }
    var mod = 1;
    S.pendingPerfect = false;

    S.bounces++;
    if (clean) { S.perfects++; S.combo++; } else { S.combo = 0; }

    var tired = Math.max(0.55, 1 - (P.fatigue / 100) * S.bounces);
    if (graze) mod *= 0.6;

    // сила тапа: слабое касание теряет энергию, сильное добавляет.
    // нейтраль 0.35 — на устройствах без датчика силы множитель ровно 1
    var strength = (typeof S.tapStrength === "number") ? S.tapStrength : 0.35;
    var pushMul = 1 + P.push * (strength - 0.35) * (0.2 + 0.8 * sat);

    // вязкость: низкая дуга не глиссирует и вязнет в воде, высокая скользит даром
    var lowness = Math.max(0, Math.min(1, 1 - S.hop / P.hopRef));
    var visc = 1 - P.viscosity * lowness;

    var prevHop = S.hop;
    S.hop = Math.max(1.15, Math.min(P.ceiling * 1.05, S.hop * (clean ? P.perfectDecay : P.decay) * tired * wave * mod * pushMul * visc));
    S.y = waveH(S.x, S.z, S.t);
    S.vy = S.hop;
    S.vz = S.vz * (1 + P.speedUp / 100);
    S.flash = clean ? 1 : 0.55;

    if (OPT.echo) {
      // короткая рябь — атмосфера; длинная зыбь уходит вперёд почти со скоростью овцы,
      // и когда та разгоняется, она догоняет и переезжает собственную волну
      addRing(S.x, S.z, S.t, P.ringAmp * (clean ? 1.3 : 1), 2.8, 0.5, 3);
      addRing(S.x, S.z, S.t, P.ringAmp * (clean ? 1.15 : 0.85), swellSpeed(), 2.6, 7);
    }

    S.squash = clean ? 1 : 0.75;
    S.camKick = clean ? 0.9 : 0.6;
    var gained = S.hop > prevHop * 1.02;
    if (gained) { S.lift = 1; swell(); }
    var big = gained ? 1.5 : 1;
    rings.push({ x: S.x, z: S.z, r: 0.15, grow: (clean ? 3.4 : 2.6) * big, life: 1, fade: clean ? 0.62 : 0.8 });
    rings.push({ x: S.x, z: S.z, r: 0.05, grow: (clean ? 5.2 : 4.0) * big, life: 1, fade: 1.25 });
    for (var i = 0; i < (clean ? 7 : 3); i++) {
      drops.push({ x: S.x + (Math.random() - 0.5) * 0.35, y: S.y + 0.05, z: S.z + (Math.random() - 0.5) * 0.35,
                   vy: 1.4 + Math.random() * 2.2, vx: (Math.random() - 0.5) * 2.4, vz: (Math.random() - 0.5) * 2.4, life: 1 });
    }
    tone(S.bounces - 1, clean, gained ? 1.5 : 1);

    // попал по отражению звезды — она зажигается и вплетается в созвездие
    if (OPT.stars) {
      for (var k = 0; k < refl.length; k++) {
        var r0 = refl[k];
        if (r0.lit) continue;
        var dx0 = r0.x - S.x, dz0 = r0.z - S.z;
        if (dx0 * dx0 + dz0 * dz0 < ((r0.big || r0.quest !== undefined) ? 7.5 : 5.0)) {
          r0.lit = true; r0.flare = 1;
          litOrder.push(r0);
          S.lit = (S.lit || 0) + (r0.big ? 2 : 1);
          drops.push({ x: r0.x, y: 0.1, z: r0.z, vx: 0, vz: 0, vy: 5.5, life: 1.5, b: 2 });
          if (r0.quest !== undefined && !questCaught[r0.quest]) {
            questCaught[r0.quest] = true;
            questFlash = Math.max(questFlash, 0.7);
            tone(Math.min(SCALE.length - 1, 10), true, 2);
            if (questCaught.every(function (c) { return c; })) {
              questInst.forEach(function (qe) { qe.quest = undefined; });
              questDone++;
              questCaught = quest().pts.map(function () { return false; });
              questFlash = 2;
              tone(11, true, 2);
              setTimeout(function () { tone(13, true, 2); }, 140);
              setTimeout(function () { tone(15, true, 2.5); }, 300);
            }
            saveQuest();
          } else {
            tone(Math.min(SCALE.length - 1, litOrder.length + 4), true, r0.big ? 2 : 1.5);
          }
          S.flash = Math.max(S.flash, r0.big ? 1 : 0.8);
          break;
        }
      }
    }

    S.armed = false; S.gesture = 0; S.pitch = 0;
    predictContact();
    S.fullInterval = S.interval;
    if (S.hop < 1.3 && !clean) die("выдохся");
  }

  function step(dt) {
    S.t += dt;
    if (S.phase === "fly") {
      S.vy -= P.gravity * dt;
      // плавный набор боковой скорости к цели, заданной последним тапом
      S.vx += ((S.steerTarget || 0) - S.vx) * Math.min(1, dt * P.steerEase);
      // приливное течение: несёт вбок, руль его компенсирует
      var cur = P.tide * tideForce() * (daily ? daily.tideDir : 1);
      S.x += (S.vx + cur) * dt; S.y += S.vy * dt; S.z += S.vz * dt;
      var surf = waveH(S.x, S.z, S.t);
      if (S.y <= surf && S.vy < 0) {
        if (S.armed) bounce();
        else {
          S.y = surf; S.vy = 0; S.sliding = true;
          // глиссада: пока окно не закрылось, камень скользит и оставляет мелкую рябь —
          // видно, что он жив и ждёт тапа, а не завис
          S.slideTick = (S.slideTick || 0) + 1;
          S.vz *= Math.max(0, 1 - dt * 0.9);
          if (S.slideTick % 8 === 0) rings.push({ x: S.x, z: S.z, r: 0.08, grow: 1.4, life: 0.5, fade: 1.8 });
          if (S.slideTick % 5 === 0) drops.push({ x: S.x + 0.1, y: 0.08, z: S.z + 0.3, vx: (Math.random() - 0.5) * 1.5, vy: 1 + Math.random(), vz: 1.5, life: 0.5 });
          if ((S.t - S.nextContact) * 1000 - P.latency > windowMs() * 0.6) die("поздно");
        }
      }
      // фигура всегда ждёт впереди; прошёл мимо — она выложится снова
      if (OPT.stars && S.z + 75 > questNextZ) spawnFigure();
      for (var ri = refl.length - 1; ri >= 0; ri--) {
        if (refl[ri].z < S.z - FOLLOW - 4) refl.splice(ri, 1);
      }
      if (OPT.ghost && best > 0 && ghostZ > 0 && !S.ghostHit && S.z > ghostZ) { S.ghostHit = 1; S.flash = Math.max(S.flash, 0.85); swell(); }
    } else if (S.phase === "dead") {
      S.z += S.vz * dt; S.x += S.vx * dt;
      S.vz *= Math.max(0, 1 - dt * (S.fDamp || 2.2));
      S.vx *= Math.max(0, 1 - dt * (S.fDamp || 2.2));
      if (OPT.sheep) {
        if (S.rescue === "sleep") { S.y += dt * 0.55; }
        else if (!S.landed) {
          // не телепорт к воде, а настоящее падение: доигрывается дуга, потом посадка
          S.vy -= P.gravity * dt * 0.85;
          S.y += S.vy * dt;
          var surfD = waveH(S.x, S.z, S.t);
          if (S.y <= surfD) { S.y = surfD; S.landed = true; S.landAt = S.t; onSheepLanded(); }
        } else {
          S.y = waveH(S.x, S.z, S.t) + 0.03;
        }
      }
      else if (S.y > -1.8) S.y -= dt * ((S.sinkV || 0.5) + Math.max(0, -S.y) * 0.9);
    } else {
      S.z += 1.2 * dt;
      if (OPT.sheep) S.y = waveH(S.x, S.z, S.t) + 0.03;   // ждёт броска, качаясь в круге
    }
    // камера тянется за камнем с отставанием — горизонт остаётся ровным
    S.camX += (S.x - S.camX) * Math.min(1, dt * 3.2);
  }

  function update(dt) {
    if (!S) return;
    S.acc += dt;
    var guard = 0;
    // положение предыдущего шага — для интерполяции кадра между шагами физики
    S.px = S.x; S.py = S.y; S.pz = S.z; S.pcam = S.camX;
    var stepped = false;
    while (S.acc >= STEP && guard < 400) {
      if (!stepped) { S.px = S.x; S.py = S.y; S.pz = S.z; S.pcam = S.camX; }
      else { S.px = S.x; S.py = S.y; S.pz = S.z; S.pcam = S.camX; }
      step(STEP); S.acc -= STEP; guard++; stepped = true;
    }
    // сглаженные координаты для отрисовки: убирают дрожание в доли шага
    var al = Math.max(0, Math.min(1, S.acc / STEP));
    S.rx = S.px + (S.x - S.px) * al;
    S.ry = S.py + (S.y - S.py) * al;
    S.rz = S.pz + (S.z - S.pz) * al;
    S.rcam = S.pcam + (S.camX - S.pcam) * al;
    for (var fi = 0; fi < refl.length; fi++) if (refl[fi].flare > 0) refl[fi].flare = Math.max(0, refl[fi].flare - dt * 1.5);
    // прогноз пересчитывается в полёте (камень сносит вбок), но замирает у самой воды —
    // иначе момент касания уезжал бы из-под пальца и промах никогда не наступал
    S.pTick = (S.pTick || 0) + 1;
    if (S.phase === "fly" && !S.armed && (S.pTick % 3) === 0) {
      var surfNow = waveH(S.x, S.z, S.t);
      if (S.y > surfNow + 0.06 && (S.nextContact - S.t) > 0.16) predictContact();
    }
    if (S.phase === "fly") {
      S.trail.push({ x: S.x, y: S.y, z: S.z });
      if (S.trail.length > 15) S.trail.shift();
    } else if (S.trail.length) {
      S.trail.shift();
    }
    questFlash = Math.max(0, questFlash - dt * 0.6);
    // визуальная скорость отстаёт от физической: поза меняется плавно, а не флипом
    S.vyVis = (S.vyVis === undefined ? S.vy : S.vyVis) + (S.vy - (S.vyVis || 0)) * Math.min(1, dt * 14);
    S.tuckNow = (S.tuckNow === undefined ? 1 : S.tuckNow) + (((S.vy > 0) ? 0.4 : 1) - (S.tuckNow || 1)) * Math.min(1, dt * 12);
    S.squash = Math.max(0, (S.squash || 0) - dt * 6);
    S.camKick = Math.max(0, (S.camKick || 0) - dt * 5);
    S.tapGlint = Math.max(0, (S.tapGlint || 0) - dt * 3.5);
    S.steerShow = Math.max(0, (S.steerShow || 0) - dt * 1.6);
    S.flash = Math.max(0, S.flash - dt * 3.2);
    S.lift = Math.max(0, S.lift - dt * 1.6);
    S.shake = Math.max(0, S.shake - dt * 1.4);

    var i;
    for (i = rings.length - 1; i >= 0; i--) {
      var r = rings[i];
      r.r += r.grow * dt; r.life -= r.fade * dt;
      if (r.life <= 0) rings.splice(i, 1);
    }
    for (i = drops.length - 1; i >= 0; i--) {
      var d = drops[i];
      if (d.b === 2) {
        d.y += d.vy * dt;
        d.vy *= Math.max(0, 1 - dt * 0.4);
        d.life -= dt * 0.65;
        if (d.life <= 0) drops.splice(i, 1);
        continue;
      }
      if (d.b) {
        d.y += d.vy * dt;
        d.life -= dt * 0.8;
        if (d.y >= waveH(d.x, d.z, S.t) || d.life <= 0) drops.splice(i, 1);
        continue;
      }
      d.vy -= P.gravity * dt * 0.9;
      d.x += d.vx * dt; d.y += d.vy * dt; d.z += d.vz * dt;
      d.life -= dt * 1.1;
      if (d.y < -0.3 || d.life <= 0) drops.splice(i, 1);
    }
    var followTarget = (S.phase === "fly") ? FOLLOW : FOLLOW_IDLE;
    followNow += (followTarget - followNow) * Math.min(1, dt * 2.5);
    var camZ = S.z - followNow;
    var curNow = P.tide * tideForce() * (daily ? daily.tideDir : 1);
    for (i = 0; i < sparks.length; i++) {
      sparks[i].x += curNow * dt;
      if (sparks[i].z < camZ + 1) { sparks[i].z = camZ + 150 + Math.random() * 60; sparks[i].x = S.camX + (Math.random() - 0.5) * 70; }
    }
    paintHud();
  }

  // ---- render ----
  function render() {
    if (!S) return;
    var camZ = (S.rz !== undefined ? S.rz : S.z) - followNow, camX = (S.rcam !== undefined ? S.rcam : S.camX);
    var sx = (S.rx !== undefined ? S.rx : S.x), sy = (S.ry !== undefined ? S.ry : S.y), sz = (S.rz !== undefined ? S.rz : S.z);
    var shakeX = S.shake > 0 ? (Math.random() - 0.5) * S.shake * 14 : 0;
    var shakeY = (S.shake > 0 ? (Math.random() - 0.5) * S.shake * 10 : 0)
      + (S.camKick || 0) * 7;   // короткая просадка камеры в момент касания

    ctx.save();
    ctx.translate(shakeX, shakeY);

    ctx.fillStyle = G.sky; ctx.fillRect(-20, -20, W + 40, horizon + 20);
    ctx.fillStyle = G.water; ctx.fillRect(-20, horizon - 1, W + 40, H - horizon + 40);

    // звёзды
    for (var si = 0; si < STARS.length; si++) {
      var st = STARS[si];
      var sxp = ((st.x * W - camX * 6) % W + W) % W;
      var syp = st.y * horizon * 0.95;
      var tw = 0.45 + 0.55 * Math.abs(Math.sin(S.t * 0.7 + st.p));
      ctx.fillStyle = "rgba(" + PAL.glow + "," + (st.m * tw * 0.55).toFixed(3) + ")";
      var ss = st.m > 0.85 ? 2 : 1;
      ctx.fillRect(sxp, syp, ss, ss);
    }

    // луна и лунная дорожка — будущая «тихая вода», пока просто романтика
    var moonX = W * 0.5 - camX * 10, moonY = horizon * 0.40;
    var lum = 0.35 + 0.65 * moonIllum();
    ctx.save();
    ctx.globalAlpha = lum;
    ctx.translate(moonX, moonY); ctx.scale(moonR * 4.5, moonR * 4.5);
    ctx.fillStyle = G.moonGlow;
    ctx.beginPath(); ctx.arc(0, 0, 1, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.translate(moonX, moonY); ctx.scale(moonR, moonR);
    ctx.fillStyle = G.moonDisc;
    ctx.beginPath(); ctx.arc(0, 0, 1, 0, Math.PI * 2); ctx.fill();
    // кратеры — как в ранней версии, только внутри диска и под тенью фазы
    ctx.fillStyle = PAL.sky[1];
    ctx.globalAlpha = 0.3;
    ctx.beginPath(); ctx.arc(-0.4, -0.28, 0.24, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0.28, 0.3, 0.16, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.2;
    ctx.beginPath(); ctx.arc(0.05, -0.05, 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    // настоящая фаза: тёмный диск наезжает сбоку; в полнолуние уходит совсем
    var mf = moonFrac();
    var sh = Math.cos(mf * Math.PI * 2);   // 1 = новолуние (тень по центру), -1 = полнолуние (тени нет)
    if (sh > -0.985) {
      var dir = mf < 0.5 ? -1 : 1;         // растущая — тень уходит влево, убывающая — вправо
      // серп наклонён по диагонали: компромисс между «стоячей» луной северных
      // широт и «лежащей» тропической — читается естественно отовсюду
      var md = (1 - sh) * 1.05;
      ctx.beginPath(); ctx.arc(0, 0, 1.001, 0, Math.PI * 2); ctx.clip();
      ctx.fillStyle = PAL.sky[0];
      ctx.globalAlpha = 0.92;
      ctx.beginPath(); ctx.arc(dir * md * 0.86, -md * 0.5, 1.02, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    ctx.strokeStyle = "rgba(" + PAL.line + ",0.13)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, horizon); ctx.lineTo(W, horizon); ctx.stroke();

    // лунная дорожка: мягкое пятно света, растянутое к зрителю
    ctx.save();
    ctx.globalAlpha = lum;
    ctx.translate(moonX, horizon);
    ctx.scale(0.5 * H * 0.62, 1.7 * H * 0.62);
    ctx.fillStyle = G.moonPath;
    ctx.beginPath(); ctx.arc(0, 0, 1, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // созвездие-задание в небе: тусклый чертёж, который зажигается по мере сбора
    if (OPT.stars) {
      var q = quest();
      var qSide = (questDone % 2 === 0) ? 0.24 : 0.76;
      var qx0 = W * qSide - W * 0.15, qy0 = H * 0.05, qw = W * 0.3, qh = H * 0.16;
      var glowUp = Math.min(1, questFlash);
      var e2, p1q, p2q;
      for (e2 = 0; e2 < q.edges.length; e2++) {
        p1q = q.pts[q.edges[e2][0]]; p2q = q.pts[q.edges[e2][1]];
        var bothLit = questCaught[q.edges[e2][0]] && questCaught[q.edges[e2][1]];
        ctx.strokeStyle = "rgba(" + PAL.hot + "," + (bothLit ? (0.4 + glowUp * 0.4) : 0.07).toFixed(3) + ")";
        ctx.lineWidth = bothLit ? 1.4 : 1;
        ctx.beginPath();
        ctx.moveTo(qx0 + p1q[0] * qw, qy0 + p1q[1] * qh);
        ctx.lineTo(qx0 + p2q[0] * qw, qy0 + p2q[1] * qh);
        ctx.stroke();
      }
      for (e2 = 0; e2 < q.pts.length; e2++) {
        var qpx = qx0 + q.pts[e2][0] * qw, qpy = qy0 + q.pts[e2][1] * qh;
        if (questCaught[e2]) {
          ctx.fillStyle = "rgba(" + PAL.hot + "," + (0.9 + glowUp * 0.1).toFixed(2) + ")";
          ctx.beginPath(); ctx.arc(qpx, qpy, 2.6, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = "rgba(" + PAL.hot + ",0.4)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(qpx - 6, qpy); ctx.lineTo(qpx + 6, qpy);
          ctx.moveTo(qpx, qpy - 6); ctx.lineTo(qpx, qpy + 6);
          ctx.stroke();
        } else {
          var qp = 0.2 + 0.12 * Math.abs(Math.sin(S.t * 1.6 + e2));
          ctx.fillStyle = "rgba(" + PAL.hot + "," + qp.toFixed(3) + ")";
          ctx.beginPath(); ctx.arc(qpx, qpy, 1.6, 0, Math.PI * 2); ctx.fill();
        }
      }
      if (questFlash > 1) {
        var qg = ctx.createRadialGradient(qx0 + qw / 2, qy0 + qh / 2, 0, qx0 + qw / 2, qy0 + qh / 2, qw * 0.7);
        qg.addColorStop(0, "rgba(" + PAL.hot + "," + ((questFlash - 1) * 0.3).toFixed(3) + ")");
        qg.addColorStop(1, "rgba(" + PAL.hot + ",0)");
        ctx.fillStyle = qg;
        ctx.beginPath(); ctx.arc(qx0 + qw / 2, qy0 + qh / 2, qw * 0.7, 0, Math.PI * 2); ctx.fill();
      }
    }

    // поверхность: линии глубины, изогнутые валами; восходящий склон светлее
    var stepZ = Q.stepZ, cols = Q.cols;
    for (var z = Math.ceil((camZ + 1.2) / stepZ) * stepZ; z < camZ + Q.dist; z += stepZ) {
      var dz = z - camZ;
      var base = Math.max(0, 0.15 - dz * 0.0016);
      if (base <= 0.004) break;
      var halfW = (W / 2) * dz / focal;
      ctx.beginPath();
      var lit = 0;
      for (var c = 0; c <= cols; c++) {
        var wx = camX - halfW + (2 * halfW) * (c / cols);
        var wh = waveH(wx, z, S.t);
        var p = proj(wx, wh, z, camZ, camX);
        if (c === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        if (c === Math.floor(cols / 2)) lit = Math.max(0, waveGradZ(wx, z, S.t));
      }
      var norm = P.waveAmp > 0 ? 1 / (P.waveAmp * k1() + 0.0001) : 0;
      ctx.strokeStyle = "rgba(" + PAL.line + "," + Math.min(0.5, base * (1 + lit * norm * 1.6) * moonLight()).toFixed(3) + ")";
      ctx.lineWidth = Math.max(1, focal * 0.02 / dz);
      ctx.stroke();
    }

    for (var i = 0; i < sparks.length; i++) {
      var s = sparks[i];
      var sp2 = proj(s.x, waveH(s.x, s.z, S.t), s.z, camZ, camX);
      if (sp2.y < horizon || sp2.y > H || sp2.x < -20 || sp2.x > W + 20) continue;
      var sa = Math.max(0, 0.5 - sp2.dz * 0.004) * (0.4 + 0.6 * Math.abs(Math.sin(S.t * 1.4 + s.p * 9)));
      if (sa <= 0.01) continue;
      ctx.fillStyle = "rgba(" + PAL.line + "," + (sa * moonLight()).toFixed(3) + ")";
      var sw = Math.max(1, focal * 0.012 / sp2.dz);
      ctx.fillRect(sp2.x - sw / 2, sp2.y, sw, Math.max(1, sw * 0.4));
    }

    // отражения звёзд и линии созвездия
    if (OPT.stars) {
      var i2, prev = null;
      for (i2 = 0; i2 < litOrder.length; i2++) {
        var cur = litOrder[i2];
        if (prev) {
          var pa = proj(prev.x, waveH(prev.x, prev.z, S.t), prev.z, camZ, camX);
          var pb = proj(cur.x, waveH(cur.x, cur.z, S.t), cur.z, camZ, camX);
          if (pa.dz > 0.4 && pb.dz > 0.4 && pb.y < H + 200) {
            ctx.strokeStyle = "rgba(" + PAL.hot + ",0.22)";
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
          }
        }
        prev = cur;
      }
      for (i2 = 0; i2 < refl.length; i2++) {
        var rf = refl[i2];
        if (rf.z < camZ + 1 || rf.z > camZ + 120) continue;
        var pr2 = proj(rf.x, waveH(rf.x, rf.z, S.t), rf.z, camZ, camX);
        if (pr2.y < horizon || pr2.y > H + 10) continue;
        var sz = Math.max(1.5, focal * (rf.big ? 0.03 : 0.018) / pr2.dz);
        var al = rf.lit ? 0.95 : 0.42;
        if (rf.flare > 0) {
          var fg = ctx.createRadialGradient(pr2.x, pr2.y, 0, pr2.x, pr2.y, sz * 14 * rf.flare);
          fg.addColorStop(0, "rgba(" + PAL.hot + "," + (0.5 * rf.flare).toFixed(3) + ")");
          fg.addColorStop(1, "rgba(" + PAL.hot + ",0)");
          ctx.fillStyle = fg;
          ctx.beginPath(); ctx.arc(pr2.x, pr2.y, sz * 14 * rf.flare, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = "rgba(" + PAL.hot + "," + al.toFixed(2) + ")";
        ctx.beginPath(); ctx.ellipse(pr2.x, pr2.y, sz, Math.max(0.8, sz * 0.5), 0, 0, Math.PI * 2); ctx.fill();
        if (!rf.lit) {
          if (rf.quest !== undefined && !questCaught[rf.quest]) {
            var qpulse = 0.3 + 0.3 * Math.abs(Math.sin(S.t * 2.6 + rf.z));
            ctx.strokeStyle = "rgba(" + PAL.hot + "," + qpulse.toFixed(3) + ")";
            ctx.lineWidth = 1.4;
            ctx.beginPath(); ctx.ellipse(pr2.x, pr2.y, sz * 4.2, Math.max(1.2, sz * 1.8), 0, 0, Math.PI * 2); ctx.stroke();
          } else {
            ctx.strokeStyle = "rgba(" + PAL.glow + ",0.16)";
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.ellipse(pr2.x, pr2.y, sz * 3.4, Math.max(1, sz * 1.4), 0, 0, Math.PI * 2); ctx.stroke();
          }
        }
      }
    }

    // контур созвездия на воде — зеркало небесного чертежа
    if (OPT.stars && questInst.length) {
      var qq = quest();
      for (var qe2 = 0; qe2 < qq.edges.length; qe2++) {
        var ea = questInst[qq.edges[qe2][0]], eb = questInst[qq.edges[qe2][1]];
        if (!ea || !eb) continue;
        if (eb.z < camZ + 1 && ea.z < camZ + 1) continue;
        var pa2 = proj(ea.x, waveH(ea.x, ea.z, S.t), ea.z, camZ, camX);
        var pb2 = proj(eb.x, waveH(eb.x, eb.z, S.t), eb.z, camZ, camX);
        if (pa2.dz <= 0.4 || pb2.dz <= 0.4) continue;
        var bl = ea.lit && eb.lit;
        ctx.strokeStyle = "rgba(" + PAL.hot + "," + (bl ? 0.4 : 0.12) + ")";
        ctx.lineWidth = bl ? 1.4 : 1;
        ctx.beginPath(); ctx.moveTo(pa2.x, pa2.y); ctx.lineTo(pb2.x, pb2.y); ctx.stroke();
      }
    }

    if (OPT.ghost && best > 0 && ghostZ > camZ + 1 && ghostZ < camZ + 130) {
      strokeWaterEllipse(S.camX, ghostZ, 1.1, camZ, camX, "rgba(" + PAL.glow + ",0.2)", 1.4);
      strokeWaterEllipse(S.camX, ghostZ, 0.7, camZ, camX, "rgba(" + PAL.glow + ",0.12)", 1);
    }

    for (i = 0; i < rings.length; i++) {
      var r = rings[i];
      strokeWaterEllipse(r.x, r.z, r.r, camZ, camX, "rgba(" + PAL.glow + "," + (Math.max(0, r.life) * 0.5).toFixed(3) + ")", 1.6);
    }

    if (OPT.aim && S.phase === "fly") {
      var tt = S.nextContact - S.t;
      if (tt > 0 && tt < 1.6) {
        var pr = 0.9 * Math.min(1, tt / 0.9);
        var aimA = 0.34 * Math.min(1, tt * 3);
        strokeWaterEllipse(S.aimX, S.aimZ, pr, camZ, camX, "rgba(" + PAL.glow + "," + aimA.toFixed(3) + ")", 1.4);
      }
    }

    if (OPT.mirror && S.phase !== "ready") {
      var surf = waveH(sx, sz, S.t);
      var above = sy - surf;
      if (above > 0.01) {
        var pm = proj(sx, surf - above, sz, camZ, camX);
        if (OPT.sheep) {
          var rw = Math.max(4, focal * 0.13 / pm.dz);
          ctx.fillStyle = "rgba(226,232,238," + Math.max(0, 0.4 - above * 0.09).toFixed(3) + ")";
          ctx.beginPath(); ctx.ellipse(pm.x, pm.y, rw, rw * 0.4, 0, 0, Math.PI * 2); ctx.fill();
        } else {
          drawStone(pm.x, pm.y, pm.dz, "rgba(" + PAL.line + "," + Math.max(0, 0.52 - above * 0.1).toFixed(3) + ")", true);
        }
      }
    }

    if (S.flash > 0.01) {
      var pf = proj(sx, waveH(sx, sz, S.t), sz, camZ, camX);
      var rad = Math.max(6, focal * (0.6 + 1.6 * (1 - S.flash)) / pf.dz);
      ctx.save();
      ctx.globalAlpha = S.flash;
      ctx.translate(pf.x, pf.y); ctx.scale(rad, rad);
      ctx.fillStyle = G.flash;
      ctx.beginPath(); ctx.arc(0, 0, 1, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    for (i = 0; i < drops.length; i++) {
      var d = drops[i];
      var pd = proj(d.x, d.y, d.z, camZ, camX);
      if (pd.y < -20 || pd.y > H) continue;
      if (d.b === 2) {
        var sa2 = Math.max(0, Math.min(1, d.life));
        ctx.strokeStyle = "rgba(" + PAL.hot + "," + (sa2 * 0.9).toFixed(3) + ")";
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(pd.x - 6, pd.y); ctx.lineTo(pd.x + 6, pd.y);
        ctx.moveTo(pd.x, pd.y - 6); ctx.lineTo(pd.x, pd.y + 6);
        ctx.stroke();
        ctx.fillStyle = "rgba(" + PAL.hot + "," + sa2.toFixed(3) + ")";
        ctx.beginPath(); ctx.arc(pd.x, pd.y, 2.4, 0, Math.PI * 2); ctx.fill();
        continue;
      }
      ctx.fillStyle = "rgba(" + PAL.hot + "," + Math.max(0, d.life * 0.7).toFixed(3) + ")";
      var dw = Math.max(1, focal * 0.008 / pd.dz);
      ctx.fillRect(pd.x, pd.y, dw, dw);
    }

    // след полёта: гаснущая нить за камнем, чтобы его было видно в движении
    if (S.trail.length > 2) {
      ctx.lineWidth = 1.5;
      for (var ti = 1; ti < S.trail.length; ti++) {
        var ta = S.trail[ti - 1], tb = S.trail[ti];
        var p1 = proj(ta.x, ta.y, ta.z, camZ, camX);
        var p2 = proj(tb.x, tb.y, tb.z, camZ, camX);
        ctx.strokeStyle = "rgba(" + PAL.glow + "," + (0.35 * ti / S.trail.length).toFixed(3) + ")";
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
      }
    }
    var ps = proj(sx, sy, sz, camZ, camX);
    S.screenX = ps.x;
    var surfS = waveH(sx, sz, S.t);
    var depth = surfS - sy;
    if (OPT.sheep && (S.phase === "dead" || S.phase === "ready")) {
      if (S.rescue === "sleep") {
        // устала — уснула: сворачивается и уплывает облачком к звёздам
        var dream = Math.max(0, 1 - (S.t - S.deadAt) / 2.4);
        if (dream > 0.02) {
          ctx.globalAlpha = dream;
          drawSheep(ps.x, ps.y, ps.dz, true);
          ctx.globalAlpha = 1;
        }
      } else if (!S.landed && S.phase === "dead") {
        // ещё летит: доигрываем падение, круга пока нет
        drawSheep(ps.x, ps.y, ps.dz);
      } else {
        // села в круг: он всплывает за четверть секунды, овечка оседает следом
        var age = Math.max(0, S.t - (S.landAt || 0));
        var pop = Math.min(1, age / 0.25);
        var scale = 0.55 + 0.45 * (1 - Math.pow(1 - pop, 3)) + Math.sin(pop * Math.PI) * 0.08;
        var rock = Math.sin(S.t * 1.7) * 0.08 * pop;
        drawLifebuoy(ps.x, ps.y, ps.dz, rock, scale);
        drawSheep(ps.x, ps.y - Math.max(8, focal * 0.24 / ps.dz) * 0.42 * scale, ps.dz);
      }
    } else if (S.phase === "dead" && depth > 0.02) {
      // утопление: силуэт тускнеет и растворяется в толще, лунный свет туда не достаёт
      var da = Math.max(0, 1 - depth * 1.2);
      if (da > 0.02) {
        ctx.globalAlpha = da * 0.75;
        drawStone(ps.x, ps.y, ps.dz, "#16232e", true);
        ctx.globalAlpha = 1;
      }
    } else {
      // мягкое свечение вокруг камня — он всегда виден на чёрной воде
      var armGlow = S.armed ? 1 : 0;
      var haloR = Math.max(10, focal * 0.15 / ps.dz) * (1 + 0.35 * armGlow);
      ctx.save();
      ctx.globalAlpha = 1 + 0.5 * armGlow;
      ctx.translate(ps.x, ps.y); ctx.scale(haloR, haloR);
      ctx.fillStyle = G.halo;
      ctx.beginPath(); ctx.arc(0, 0, 1, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.restore();
      if (OPT.sheep) drawSheep(ps.x, ps.y, ps.dz);
      else drawStone(ps.x, ps.y, ps.dz, PAL.stone, false);
    }
    // куда повернули: короткий шеврон сбоку от овцы
    if (S.steerShow > 0.01 && Math.abs(S.steerTarget || 0) > 0.05) {
      var dir = S.steerTarget < 0 ? -1 : 1;
      var off = Math.max(14, focal * 0.06 / ps.dz);
      ctx.strokeStyle = "rgba(" + PAL.hot + "," + (S.steerShow * 0.55).toFixed(3) + ")";
      ctx.lineWidth = 2;
      for (var cvi = 0; cvi < 2; cvi++) {
        var cxp = ps.x + dir * (off + cvi * 8);
        ctx.beginPath();
        ctx.moveTo(cxp - dir * 5, ps.y - 6);
        ctx.lineTo(cxp, ps.y);
        ctx.lineTo(cxp - dir * 5, ps.y + 6);
        ctx.stroke();
      }
    }
    if (S.tapGlint > 0.01) {
      // кольцо принятого тапа: рождается снаружи силуэта и уходит вширь,
      // чтобы отклик был виден мгновенно, а не тонул в белом теле овцы
      var base = Math.max(10, focal * 0.32 / ps.dz);
      var gr2 = base * (1 + 0.9 * Math.pow(1 - S.tapGlint, 0.6));
      ctx.strokeStyle = "rgba(" + PAL.glow + "," + (Math.pow(S.tapGlint, 1.6) * 0.85).toFixed(3) + ")";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ps.x, ps.y, gr2, 0, Math.PI * 2); ctx.stroke();
    }

    if (S.lift > 0.01) {
      ctx.strokeStyle = "rgba(" + PAL.hot + "," + (S.lift * 0.4).toFixed(3) + ")";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(ps.x, ps.y + 16, 16 + 22 * (1 - S.lift), Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();
    }

    ctx.fillStyle = G.vignette; ctx.fillRect(0, 0, W, H);

    ctx.restore();
  }

  function strokeWaterEllipse(x, z, r, camZ, camX, color, lw) {
    var wh = waveH(x, z, S.t);
    var c = proj(x, wh, z, camZ, camX);
    var l = proj(x - r, wh, z, camZ, camX);
    var rr = proj(x + r, wh, z, camZ, camX);
    var n = proj(x, waveH(x, z - r, S.t), z - r, camZ, camX);
    var f = proj(x, waveH(x, z + r, S.t), z + r, camZ, camX);
    var rx = Math.abs(rr.x - l.x) / 2;
    var ry = Math.abs(n.y - f.y) / 2;
    if (rx < 0.4 || !isFinite(rx) || !isFinite(ry)) return;
    var cy = (n.y + f.y) / 2;
    if (cy < horizon - 40 || cy > H + 120) return;
    ctx.strokeStyle = color; ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.ellipse(c.x, cy, rx, Math.max(0.6, ry), 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  // овечка из кружочков: тело-облако, тёмная мордочка с ушами, ножки.
  // в полёте вытягивается и поджимает ноги, у воды приседает
  function drawSheep(sx, sy, dz, sleeping) {
    var w = Math.max(8, focal * 0.24 / dz);
    var vv = (S.vyVis === undefined ? (S.vy || 0) : S.vyVis);
    var stretch = sleeping ? 0 : Math.max(-0.35, Math.min(0.35, vv * 0.03)) - (S.squash || 0) * 0.5;
    var sq = 1 + stretch, sqx = 1 - stretch * 0.55;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(sqx, sleeping ? sq * 0.92 : sq);
    ctx.rotate(sleeping ? Math.sin(S.t * 1.3) * 0.08 : Math.max(-0.3, Math.min(0.3, -stretch * 0.6)));
    // ножки: четыре, со спины видны попарно
    ctx.strokeStyle = "#1a232e";
    ctx.lineWidth = Math.max(1.2, w * 0.09);
    var tuck = sleeping ? 0.2 : (S.tuckNow === undefined ? 1 : S.tuckNow);
    ctx.beginPath();
    [-0.42, -0.15, 0.15, 0.42].forEach(function (lx) {
      ctx.moveTo(w * lx, w * 0.3);
      ctx.lineTo(w * lx - w * 0.03, w * 0.3 + w * 0.3 * tuck);
    });
    ctx.stroke();
    // тело-облако (вид со спины)
    ctx.fillStyle = "rgba(236,240,244,0.96)";
    ctx.beginPath();
    ctx.arc(-w * 0.35, 0, w * 0.42, 0, Math.PI * 2);
    ctx.arc(0, -w * 0.14, w * 0.48, 0, Math.PI * 2);
    ctx.arc(w * 0.35, 0, w * 0.42, 0, Math.PI * 2);
    ctx.arc(0, w * 0.16, w * 0.44, 0, Math.PI * 2);
    ctx.fill();
    // хвостик
    ctx.fillStyle = "rgba(220,226,232,0.9)";
    ctx.beginPath(); ctx.arc(0, w * 0.42, w * 0.11, 0, Math.PI * 2); ctx.fill();
    // затылок с ушами СВЕРХУ: овца смотрит вдаль, от игрока
    ctx.fillStyle = "#232d3a";
    ctx.beginPath(); ctx.arc(0, -w * 0.52, w * 0.27, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.ellipse(-w * 0.34, -w * 0.6, w * 0.16, w * 0.07, -0.55, 0, Math.PI * 2);
    ctx.ellipse(w * 0.34, -w * 0.6, w * 0.16, w * 0.07, 0.55, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // спасательный круг: белый тор с красными сегментами, качается на волне
  function drawLifebuoy(sx, sy, dz, rock, scale) {
    var w = Math.max(8, focal * 0.24 / dz) * (scale || 1);
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(rock);
    ctx.lineWidth = w * 0.3;
    ctx.strokeStyle = "#dfe3e8";
    ctx.beginPath(); ctx.ellipse(0, 0, w * 0.75, w * 0.34, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = "#b45a50";
    for (var i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.ellipse(0, 0, w * 0.75, w * 0.34, 0, i * Math.PI / 2 - 0.28, i * Math.PI / 2 + 0.28);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawStone(sx, sy, dz, color, flat) {
    var w = Math.max(3.2, focal * (flat ? 0.07 : 0.1) / dz);
    var h = Math.max(1.6, w * 0.46);
    var rot = flat ? 0 : Math.max(-0.4, Math.min(0.4, (S.vx || 0) * 0.05));
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(sx, sy, w, h, rot, 0, Math.PI * 2);
    ctx.fill();
    if (!flat) {
      // лунный ободок: камень читается силуэтом со светящейся кромкой
      ctx.strokeStyle = "rgba(" + PAL.glow + ",0.8)";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.ellipse(sx, sy, w, h, rot, 0, Math.PI * 2);
      ctx.stroke();
    }
    if (!flat) {
      ctx.fillStyle = "rgba(150,200,220,0.35)";
      ctx.beginPath();
      ctx.ellipse(sx - w * 0.18, sy - h * 0.34, w * 0.5, h * 0.32, -0.3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- hud / card / seas ----
  var elCount = document.getElementById("count");
  var elCombo = document.getElementById("combo");
  var elCard = document.getElementById("card");
  var elLabel = document.getElementById("cardLabel");
  var elBig = document.getElementById("cardBig");
  var elBest = document.getElementById("cardBest");
  var elHint = document.getElementById("cardHint");
  var elSeas = document.getElementById("seas");

  function paintHud() {
    if (S.phase === "fly") {
      elCount.textContent = String(S.bounces);
      if (OPT.showErr && S.lastErr !== null && S.t - S.lastErrAt < 0.9) {
        elCombo.textContent = (S.lastErr > 0 ? "+" : "") + S.lastErr + " мс" + (Math.abs(S.lastErr) <= perfectMs() ? " чисто" : "");
        elCombo.classList.add("on");
      }
      else if (S.combo >= 2) { elCombo.textContent = "чисто ×" + S.combo; elCombo.classList.add("on"); }
      else elCombo.classList.remove("on");
    } else {
      elCount.textContent = "";
      if (uiMsgUntil > performance.now()) { elCombo.textContent = uiMsg; elCombo.classList.add("on"); }
      else elCombo.classList.remove("on");
    }
  }
  function hideCard() { elCard.classList.add("hidden"); }
  function paintCard(kind) {
    elCard.classList.remove("hidden");
    if (kind === "ready") {
      elLabel.textContent = sea.name + " · " + todayLabel();
      elBig.textContent = best > 0 ? String(best) : "";
      var db0 = dayBest();
      elBest.textContent = (best > 0 ? "рекорд" : "") + (db0 > 0 && db0 < best ? " · сегодня " + db0 : "");
      elHint.innerHTML = "<strong>тап — бросок</strong><span>тапай в момент касания воды<br>тапнул сбоку от овцы — свернёт туда</span>";
    } else {
      elLabel.textContent = OPT.sheep ? (S.rescue === "sleep" ? "уснула" : "спасена") : (S.reason || "выдохся");
      elBig.textContent = String(S.bounces);
      var db = dayBest();
      elBest.textContent = "рекорд " + best + (db > 0 && db < best ? " · сегодня " + db : "") + (S.perfects > 0 ? " · чисто " + S.perfects : "");
      elHint.innerHTML = "<strong>тап — ещё раз</strong><span></span>";
    }
  }
  function paintSeas() {
    var show = !S || S.phase !== "fly";
    elSeas.classList.toggle("hidden", !show);
    var kids = elSeas.children;
    for (var i = 0; i < kids.length; i++) kids[i].setAttribute("aria-pressed", SEAS[i] === sea ? "true" : "false");
  }
  SEAS.forEach(function (s) {
    var b = document.createElement("button");
    b.type = "button"; b.textContent = s.name;
    b.addEventListener("click", function () { applySea(s); });
    elSeas.appendChild(b);
  });

  // ---- panel ----
  var panel = document.getElementById("panel");
  var slidersBox = document.getElementById("sliders");
  var togglesBox = document.getElementById("toggles");
  var toggleBtns = {};

  var SLREG = [];
  SLIDERS.forEach(function (s) {
    var row = document.createElement("div");
    row.className = "row";
    var id = "sl_" + s.k;
    row.innerHTML = '<label for="' + id + '">' + s.label + '</label><output></output>' +
      '<input id="' + id + '" type="range" min="' + s.min + '" max="' + s.max + '" step="' + s.step + '" value="' + P[s.k] + '">';
    slidersBox.appendChild(row);
    var input = row.querySelector("input"), out = row.querySelector("output");
    function show() { out.textContent = (+input.value).toFixed(s.step < 0.01 ? 3 : (s.step < 1 ? 2 : 0)) + s.unit; }
    show();
    SLREG.push({ k: s.k, input: input, show: show });
    input.addEventListener("input", function () {
      P[s.k] = parseFloat(input.value);
      custom[s.k] = P[s.k];
      saveCustom();
      show();
      if (s.k === "latency") saveOpts();
      newRun();
    });
  });
  refreshSliders = function () {
    SLREG.forEach(function (r) { r.input.value = P[r.k]; r.show(); });
  };

  function paintToggles() {
    Object.keys(toggleBtns).forEach(function (k) { toggleBtns[k].setAttribute("aria-pressed", OPT[k] ? "true" : "false"); });
  }
  TOGGLES.forEach(function (t) {
    var b = document.createElement("button");
    b.type = "button"; b.textContent = t.label;
    toggleBtns[t.k] = b;
    b.addEventListener("click", function () {
      OPT[t.k] = !OPT[t.k];
      paintToggles();
      if (t.k === "sound") { if (OPT.sound) audioResume(); else if (AC) { try { AC.suspend(); } catch (e2) {} } }
      if (t.k === "tilt" && OPT.tilt) { tiltInited = true; enableTilt(); }
      if (t.k === "waves") newRun();
      saveOpts();
    });
    togglesBox.appendChild(b);
  });
  paintToggles();

  document.getElementById("gear").addEventListener("click", function () {
    panel.classList.toggle("open");
    if (panel.classList.contains("open")) {
      document.getElementById("statsText").textContent = anSummary();
      document.getElementById("logText").textContent = logSummary();
    }
  });
  document.getElementById("hardReload").addEventListener("click", function () {
    say("обновляю…");
    var done = function () {
      var u = location.origin + location.pathname + "?v=" + Date.now();
      location.replace(u);
    };
    try {
      var jobs = [];
      if (window.caches && caches.keys) {
        jobs.push(caches.keys().then(function (ks) {
          return Promise.all(ks.map(function (k) { return caches.delete(k); }));
        }));
      }
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        }));
      }
      if (jobs.length) { Promise.all(jobs).then(done, done); setTimeout(done, 1200); }
      else done();
    } catch (e) { done(); }
  });
  document.getElementById("settingsReset").addEventListener("click", function () {
    custom = {};
    try { localStorage.removeItem("ns_custom"); } catch (e) {}
    Object.keys(PDEF).forEach(function (k) { P[k] = PDEF[k]; });
    Object.keys(OPTDEF).forEach(function (k) { OPT[k] = OPTDEF[k]; });
    saveOpts();
    paintToggles();
    applySea(sea);
  });
  document.getElementById("statsCopy").addEventListener("click", function () {
    var t = anSummary() + "\n\n" + logSummary() + "\n\n" + JSON.stringify({ stats: anLoad(), log: LOG });
    if (navigator.clipboard) navigator.clipboard.writeText(t).catch(function () {});
  });
  document.getElementById("statsReset").addEventListener("click", function () {
    AN.mem = { v: 1, days: {} }; anSave();
    LOG = []; try { localStorage.removeItem("ns_log"); } catch (e) {}
    document.getElementById("statsText").textContent = anSummary();
    document.getElementById("logText").textContent = logSummary();
  });
  document.getElementById("closePanel").addEventListener("click", function () { panel.classList.remove("open"); });

  var last = 0, ftAcc = 0, ftN = 0, fitTick = 0;
  function frame(ts) {
    if (!last) last = ts;
    if (++fitTick % 30 === 0) {
      var rr = cv.getBoundingClientRect();
      if (Math.abs(rr.width - W) > 1 || Math.abs(rr.height - H) > 1) resize();
    }
    var dt = Math.min((ts - last) / 1000, 0.05);
    last = ts;
    // слежение за кадром: не тянем — тихо снижаем детализацию
    if (S && S.phase === "fly" && !panel.classList.contains("open") && document.visibilityState === "visible") {
      ftAcc += dt; ftN++;
    } else { ftAcc = 0; ftN = 0; }
    if (ftN >= 90) {
      var avg = ftAcc / ftN;
      ftAcc = 0; ftN = 0;
      if (avg > 0.024 && tier < TIERS.length - 1) {
        tier++;
        Q = TIERS[tier];
        resize();
        seedSparks(S ? S.z - 20 : -20);
      }
    }
    update(dt); render();
    requestAnimationFrame(frame);
  }

  window.__skip = {
    state: function () { return S; },
    params: P, opts: OPT, seas: SEAS,
    setSea: function (id) { for (var i = 0; i < SEAS.length; i++) if (SEAS[i].id === id) applySea(SEAS[i]); },
    setStrength: function (v) { TAP.live = true; TAP.strength = v; },
    tapInfo: function () { return { live: TAP.live, src: TAP.src, strength: TAP.strength }; },
    tap: function (g) {
      if (S && S.phase === "ready") { launch(0); return; }
      beginTap(W / 2, H / 2);
      if (g && S) S.gesture = g;
    },
    throwDir: function (d) { if (S && S.phase === "ready") launch((d || 0) * P.aimSpread); },
    setTilt: function (v) { keyTilt = v; },
    windowMs: function () { return windowMs(); },
    idealPitch: function () { return idealPitch(); },
    reset: function () { newRun(); },
    clearBest: function () {
      SEAS.forEach(function (s) { try { localStorage.removeItem("skip_best_" + s.id); localStorage.removeItem("skip_best_" + s.id + "_z"); } catch (e) {} });
      best = 0; ghostZ = 0;
    }
  };

  resize();
  loadQuest();
  applySea(sea);
  requestAnimationFrame(frame);
})();
</script>
