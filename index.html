    if (p) { p.pan.value = Math.max(-1, Math.min(1, pan)); p.connect(master); return p; }
    return master;
  }

  // ЗВУК ВОДЫ. Настоящий «плюх» — это резонанс воздушной полости (Миннарт):
  // частота тона РАСТЁТ, пока пузырь схлопывается. Падающий тон звучит как
  // деревяшка/синтезатор, поэтому раньше на воду и не было похоже.
  var noiseBuf = null;
  function getNoise() {
    if (noiseBuf) return noiseBuf;
    var len = Math.floor(AC.sampleRate * 1.2);
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return noiseBuf;
  }

  // брызги: шумовой всплеск, фильтр съезжает вниз — так рассыпается капельная взвесь
  function spray(dest, amp, hz, dur, q, delay) {
    if (!AC || AC.state !== "running") return;
    var t0 = AC.currentTime + (delay || 0);
    var src = AC.createBufferSource();
    src.buffer = getNoise();
    src.loop = true;
    src.playbackRate.value = 0.75 + Math.random() * 0.5;
    var bp = AC.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.setValueAtTime(hz, t0);
    bp.frequency.exponentialRampToValueAtTime(Math.max(120, hz * 0.4), t0 + dur);
    bp.Q.value = q || 0.7;
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(amp, t0 + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(bp); bp.connect(g); g.connect(dest);
    src.start(t0); src.stop(t0 + dur + 0.03);
  }

  // пузырь: тон с восходящей частотой. Крупный пузырь — низкий и долгий
  function bubble(dest, fEnd, amp, dur, rise, delay) {
    if (!AC || AC.state !== "running") return;
    var t0 = AC.currentTime + (delay || 0);
    var r = rise || 1.9;
    var o = AC.createOscillator(), g = AC.createGain(), lp = AC.createBiquadFilter();
    o.type = "sine";
    o.frequency.setValueAtTime(fEnd / r, t0);
    o.frequency.exponentialRampToValueAtTime(fEnd, t0 + dur * 0.7);
    lp.type = "lowpass"; lp.frequency.value = fEnd * 4;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(amp, t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(lp); lp.connect(g); g.connect(dest);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }

  // касание овечки о воду: удар-шлепок + пузырь, чья итоговая частота и есть нота серии
  function tone(step, clean, mult) {
    if (!AC || !OPT.sound || AC.state !== "running") return;
    var semi = SCALE[Math.min(step, SCALE.length - 1)];
    var f = 246.94 * Math.pow(2, semi / 12) * (mult || 1);
    var dest = outFor((S ? S.x - S.camX : 0) / 7);

    // удар: короткий широкий шлепок, у чистого касания — суше и звонче
    spray(dest, clean ? 0.2 : 0.3, clean ? 2400 : 1500, clean ? 0.05 : 0.1, clean ? 1.1 : 0.6);
    // пузырь-нота
    bubble(dest, f, clean ? 0.3 : 0.2, clean ? 0.26 : 0.18, clean ? 2.1 : 1.6);
    // хвост капель
    spray(dest, clean ? 0.07 : 0.05, 5200, 0.12, 1.4, 0.02);
  }

  // Облачко подхватывает овечку. Это НЕ всплеск: у spray() атака 4 мс, а такой
  // резкий фронт ухо читает как щелчок по воде. Здесь всё наоборот — медленная
  // атака больше 100 мс, только низ и середина, длинный мягкий хвост.
  // Получается вдох, а не удар.
  function catchPuff() {
    if (!AC || !OPT.sound || AC.state !== "running") return;
    var dest = outFor((S ? S.x - S.camX : 0) / 7);
    var t0 = AC.currentTime;

    // воздушный слой: шум, задавленный низким фильтром; фильтр чуть приоткрывается
    // на вдохе и закрывается обратно — так дышит объём, а не брызги
    var src = AC.createBufferSource();
    src.buffer = getNoise();
    src.loop = true;
    src.playbackRate.value = 0.26 + Math.random() * 0.1;
    var lp = AC.createBiquadFilter();
    lp.type = "lowpass";
    lp.Q.value = 0.25;
    // потолок фильтра 560 Гц: замер офлайн-рендера показал, что при 760 звук
    // получается заметно ярче (частота перехода через ноль 127 против 103),
    // то есть ближе к шипению, чем к вдоху
    lp.frequency.setValueAtTime(200, t0);
    lp.frequency.linearRampToValueAtTime(560, t0 + 0.22);
    lp.frequency.exponentialRampToValueAtTime(150, t0 + 1.0);
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(0.075, t0 + 0.14);      // медленный фронт: без щелчка
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.0);
    src.connect(lp); lp.connect(g); g.connect(dest);
    src.start(t0); src.stop(t0 + 1.05);

    // тихий низкий вздох под шумом: тон мягко оседает, как выдох
    var o = AC.createOscillator(), og = AC.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(148, t0);
    o.frequency.exponentialRampToValueAtTime(92, t0 + 0.75);
    og.gain.setValueAtTime(0.0001, t0);
    og.gain.linearRampToValueAtTime(0.055, t0 + 0.16);
    og.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.85);
    o.connect(og); og.connect(dest);
    o.start(t0); o.stop(t0 + 0.9);
  }

  // «вдох» после подсечки: вода поднимает — низкий пузырь и всплеск
  function swell() {
    if (!AC || !OPT.sound || AC.state !== "running") return;
    var dest = outFor((S ? S.x - S.camX : 0) / 7);
    bubble(dest, 190, 0.14, 0.5, 2.6);
    spray(dest, 0.1, 900, 0.28, 0.5);
  }

  // «буль»: овечка ушла под воду — крупная полость и гурчание мелких пузырьков
  function thud() {
    if (!AC || !OPT.sound || AC.state !== "running") return;
    var dest = outFor((S ? S.x - S.camX : 0) / 7);
    spray(dest, 0.32, 700, 0.22, 0.5);          // всплеск входа
    bubble(dest, 150, 0.32, 0.45, 2.8);         // крупная полость
    bubble(dest, 320, 0.12, 0.2, 2.2, 0.12);    // пузырьки вдогонку
    bubble(dest, 480, 0.08, 0.14, 2.0, 0.22);
    spray(dest, 0.06, 3200, 0.3, 1.2, 0.05);    // оседающая взвесь
  }

  // мгновенное подтверждение тапа: тихий щелчок пальца, не синтезаторный писк
  function tick() {
    if (!AC || !OPT.sound || AC.state !== "running") return;
    spray(master, 0.05, 3400, 0.02, 1.6);
  }

  // ---- input ----
  // физика касания: сила (Touch.force / PointerEvent.pressure), площадь контакта
  // (radiusX/Y или width/height) и длительность. Датчик может врать константой —
  // тогда сам себя отключаем и остаёмся честной тайминг-игрой
  var TAP = { strength: 0.35, src: "нет", lo: 9, hi: -9, samples: 0, live: false };
  function noteTapPhysics(force, area) {
    var v = null, src = null;
    if (typeof force === "number" && force > 0) { v = Math.min(1, force); src = "сила"; }
    else if (typeof area === "number" && area > 0) { v = Math.min(1, area / 45); src = "площадь"; }
    if (v === null) { TAP.strength = 0.35; return; }
    TAP.lo = Math.min(TAP.lo, v); TAP.hi = Math.max(TAP.hi, v);
    TAP.samples++;
    if (TAP.samples > 4 && TAP.hi - TAP.lo > 0.05) { TAP.live = true; TAP.src = src; }
    if (!TAP.live) { TAP.strength = 0.35; return; }
    var span = Math.max(0.08, TAP.hi - TAP.lo);
    // ИНВЕРСИЯ: маленькое пятно контакта — касание кончиком пальца, точное и трудное;
    // шлепок всей подушечкой — размазанный. Точность вознаграждается энергией
    TAP.strength = Math.max(0, Math.min(1, 1 - (v - TAP.lo) / span));
  }
  window.addEventListener("touchstart", function (e) {
    var t = e.touches && e.touches[0];
    if (!t) return;
    var area = (typeof t.radiusX === "number" && typeof t.radiusY === "number")
      ? Math.PI * t.radiusX * t.radiusY / 40 : null;
    noteTapPhysics(t.force, area);
  }, { passive: true });

  var down = null;
  // обратная проекция: точка экрана -> точка на воде (для водяной игрушки в меню)
  function screenToWater(px, py) {
    var dy = py - horizon;
    if (dy < 10) return null;
    var dz = focal * camYNow / dy;
    if (dz > 120) return null;
    return { x: (px - W / 2) * dz / focal + S.camX, z: (S.z - followNow) + dz };
  }
  // Сколько симуляционного времени прошло между последним отрисованным кадром
  // и настоящим моментом касания. Часы у rAF, performance.now() и timeStamp события
  // общие, поэтому разность прямая. Значение обычно положительное: событие приходит
  // ПОСЛЕ последнего кадра, и симуляция до него ещё не дошла.
  // Ограничение ±80 мс — защита от нелепых значений (заснувшая вкладка, чужие
  // синтетические события с нулевым timeStamp), а не от нормального разброса.
  var lastFrameTs = 0, tapShiftSum = 0, tapShiftN = 0;
  function tapShift(evTs) {
    if (typeof evTs !== "number" || !isFinite(evTs) || evTs <= 0 || !lastFrameTs) return 0;
    var ms = evTs - lastFrameTs;
    if (ms > 80) ms = 80; else if (ms < -80) ms = -80;
    tapShiftSum += ms; tapShiftN++;
    return ms;
  }

  // evTs — момент касания по часам события (DOMHighResTimeStamp). До этого судейство
  // считалось по часам симуляции на момент ВЫЗОВА обработчика, то есть вся задержка
  // доставки события и квантование по кадру сваливались прямо в судимую ошибку
  // и маскировались ползунком компенсации. См. tapShift() ниже.
  function beginTap(x, y, evTs) {
    down = { x: x, y: y };
    anSession();
    if (OPT.sound && AC && AC.state !== "running") { try { AC.resume(); } catch (e) {} }
    if (!S) return;
    // пока не играем, вода — игрушка: тап по ней рождает настоящую волну
    if ((S.phase === "ready" || S.phase === "dead") && OPT.echo) {
      var wp = screenToWater(x, y);
      if (wp) {
        addRing(wp.x, wp.z, S.t, P.ringAmp * 1.5, 2.2, 0.6, 2.5);
        audioResume();
        if (AC && OPT.sound) { spray(master, 0.22, 1700, 0.09, 0.6); bubble(master, 300, 0.16, 0.2, 2.0); }
      }
    }
    if (S.phase === "ready") { launch(0); return; }
    // Пауза перед перезапуском. Была 0.45 с — и в неё не попадал ровно тот тап,
    // ради которого игрок и тянулся: опоздал к касанию, окно закрылось, заход
    // кончился, а его запоздавшее нажатие тут же начинало новый. Со стороны
    // это выглядит как «ничего не нажалось, и вдруг я уже играю заново».
    // 0.8 с проглатывают запоздавший тап и не мешают осознанному перезапуску;
    // само нажатие при этом не пропадает — по воде расходится круг.
    if (S.phase === "dead") { if (S.t - S.deadAt > 0.8) { newRun(); launch(); } return; }
    if (S.phase !== "fly" || S.armed) return;
    // Времени два, и путать их нельзя. tSim — где физика была в момент вызова
    // обработчика; tNow — время, ПО КОТОРОМУ тап судится, туда добавлена
    // поправка на задержку доставки события (до ±80 мс). В ленту нужны оба:
    // переигровка обязана довести физику до tSim, а судить по tNow. Пока
    // хранилось одно, переигровка доводила физику до судимого времени, то есть
    // до другой точки, — отсюда и расхождение на волнении.
    var tSim = S.t + (S.acc || 0);   // точное время внутри шага, не ступенька
    var shiftMs = tapShift(evTs);    // поправка на время события, в мс (может быть ±)
    var tNow = tSim + shiftMs / 1000;
    S.tapSimT = tSim;
    S.lastShift = shiftMs;
    // руль: точка тапа относительно самой овцы. Тапнул рядом — идёт прямо,
    // тапнул в стороне — поворачивает тем круче, чем дальше от неё палец.
    // В ленту пишется именно эта безразмерная величина, а не экранный x:
    // она не зависит ни от разрешения, ни от того, что вернул рендер.
    var ref = (typeof S.screenX === "number") ? S.screenX : W / 2;
    var rel = Math.max(-1, Math.min(1, (x - ref) / (W * 0.5)));
    applyTap(tNow, rel, TAP.live ? TAP.strength : 0.35);
  }

  // Ядро судейства: всё, что решает судьбу тапа, и ничего экранного.
  // Именно эта функция переигрывается по ленте — и в браузере, и, когда дойдёт
  // до сервера, в Deno тем же кодом.
  function applyTap(tNow, rel, strength) {
    var err = (tNow - S.nextContact) * 1000 - P.latency;
    var simT = (typeof S.tapSimT === "number") ? S.tapSimT : (S.t + (S.acc || 0));
    S.tapSimT = null;
    if (S.tape) S.tape.push({ t: +tNow.toFixed(6), st: +simT.toFixed(6), rel: +rel.toFixed(4), s: +strength.toFixed(4) });
    if (err >= -windowMs() && err <= windowMs() * 0.6) {
      S.armed = true;
      S.pendingPerfect = Math.abs(err) <= perfectMs();
      S.tapErrs.push(Math.round(err));
      kfUpdate(err);
      S.lastErr = Math.round(err); S.lastErrAt = tNow;
      S.tapStrength = strength;
      S.tapGlint = 1;
      tick();
      var mag = (Math.abs(rel) - P.steerDead) / Math.max(0.01, 1 - P.steerDead);
      S.steerTarget = mag <= 0 ? 0 : (rel < 0 ? -1 : 1) * Math.pow(Math.min(1, mag), 1.4) * P.steerMax;
      // овечка уже скользит по воде и ждёт — отскок происходит сразу,
      // а не на следующем шаге физики: иначе отклик опаздывает до четверти секунды
      if (S.sliding) { S.sliding = false; bounce(); }
    } else {
      die(err < 0 ? "рано" : "поздно");
    }
  }
  window.addEventListener("pointerdown", function (e) {
    if (e.isPrimary === false || down) return;
    if (e.pointerType !== "touch") {
      var ar = (e.width && e.height) ? e.width * e.height / 40 : null;
      noteTapPhysics(e.pressure && e.pressure !== 0.5 ? e.pressure : null, ar);
    }
    var t = e.target;
    if (t && typeof t.closest === "function" && (t.closest("#panel") || t.closest("#night") || t.closest("#gear") || t.closest("#seas"))) return;
    beginTap(e.clientX, e.clientY, e.timeStamp);
  });
  window.addEventListener("pointerup", function () { down = null; });
  // системный жест (свайп-назад, шторка) обрывает касание без pointerup:
  // без этого down залипает и игра перестаёт принимать тапы
  window.addEventListener("pointercancel", function () { down = null; });
  window.addEventListener("keydown", function (e) {
    if (e.code === "Space") { e.preventDefault(); if (S && S.phase === "ready") launch(0); else { beginTap(W / 2, H / 2, e.timeStamp); down = null; } }
    // стрелки раньше подменяли наклон; руль теперь только тапом по стороне экрана
    else if (e.code === "ArrowLeft") { e.preventDefault(); beginTap(W * 0.12, H / 2); down = null; }
    else if (e.code === "ArrowRight") { e.preventDefault(); beginTap(W * 0.88, H / 2); down = null; }
  });
  // Наклон, датчики движения и жест-подсечка удалены целиком (21.08.2026).
  // Причина не только в дизайне: запрос доступа к датчикам движения ради функции,
  // которой нет, — лишняя строка в декларации приватности и повод для вопросов
  // на ревью в App Store. Руль — зоны экрана относительно овцы, см. beginTap.
  var uiMsg = "", uiMsgUntil = 0;
  function say(m) { uiMsg = m; uiMsgUntil = performance.now() + 3000; }

  function die(reason) {
    if (!S || S.phase === "dead") return;
    S.phase = "dead"; S.deadAt = S.t; S.reason = reason; S.shake = 0.35;
    var snap = { sea: sea.id, b: S.bounces, e: (S.tapErrs || []).slice(-24), iv: Math.round((S.fullInterval || 0) * 1000), hop: +S.hop.toFixed(1), lastErr: S.lastErr, t: S.t, q: (S.srcQ || []).slice(), tape: (S.tape || []).slice() };
    if (!replaying) setTimeout(function () {
      anRun(snap.b, reason, snap.t, snap.sea);
      logRun({ d: reason, b: snap.b, sea: sea.id, e: snap.e, iv: snap.iv, hop: snap.hop, lastErr: snap.lastErr });
      picLogRun(snap.sea, snap.q, snap.b, snap.tape, reason);
    }, 0);

    // Финал говорит игроку, ЧТО он сделал, — и слова для этого не нужны.
    // Опоздал — овечка заждалась и уснула. Поторопился — дёрнул раньше
    // времени, и её подхватило облачко. Выдохлась — тоже уснула, это та же
    // усталость. Зарылась — тоже облачко: её поймали, а не усыпили.
    // Отсюда прямое следствие: подписей «рано» и «поздно» в игре не нужно,
    // человек читает причину из самой картинки.
    S.rescue = OPT.sheep ? ((reason === "выдохся" || reason === "поздно") ? "sleep" : "buoy") : null;
    S.landed = false; S.landAt = 0;
    S.cloudAt = S.t;                 // облачко подстилается сразу, ещё в воздухе
    S.sinkV = (S.rescue === "sleep" || reason === "выдохся") ? 0.45 : 1.6;
    // Гашение скорости зависит от того, ГДЕ застал промах.
    // «Поздно» и «зарылся» — овечка уже на воде: длинный прокат читался бы
    // как керлинг, поэтому облачко её принимает и останавливает.
    // «Рано» — она в воздухе, посреди дуги. Прежнее общее значение 7.0
    // съедало скорость вперёд за четыре десятых секунды, вертикаль при этом
    // продолжала работать — и овечка падала почти отвесно, будто её выключили.
    // Дуга обрывается только тогда, когда её действительно что-то остановило.
    S.fDamp = reason === "выдохся" ? 2.2 : (reason === "рано" ? 0.9 : 7.0);

    // Спасение облачком — не утопление, поэтому в момент промаха не должно быть
    // ни «буля», ни всплеска, ни брызг: овечка ещё в воздухе, ей ничто не ударило.
    // Весь удар — один раз, когда она действительно коснётся воды (onSheepLanded).
    // Раньше звук смерти и звук приземления накладывались друг на друга.
    if (S.rescue === "buoy") {
      S.shake = 0.12;                // толчок камеры мягче: её поймали, а не уронили
    } else {
      // прощальная волна: последний медленный круг от места, где герой ушёл под воду,
      // расходится по всему морю и покачивает отражения звёзд, проходя сквозь них
      if (OPT.echo) addRing(S.x, S.z, S.t, P.ringAmp * 2.4, 1.7, 1.5, 8);
      for (var bi = 0; bi < (OPT.sheep ? 0 : 9); bi++) {
        drops.push({ x: S.x + (Math.random() - 0.5) * 0.3, y: -0.15 - Math.random() * 0.7, z: S.z + (Math.random() - 0.5) * 0.3,
                     vx: 0, vz: 0, vy: 0.35 + Math.random() * 0.6, life: 1.6 + Math.random(), b: 1 });
      }
      thud();
      for (var i = 0; i < 10; i++) {
        drops.push({ x: S.x + (Math.random() - 0.5) * 0.5, y: 0.1 + Math.random() * 0.5, z: S.z + (Math.random() - 0.5) * 0.5,
                     vy: 1.2 + Math.random() * 1.8, vx: (Math.random() - 0.5) * 2, vz: (Math.random() - 0.5) * 2, life: 1 });
      }
      rings.push({ x: S.x, z: S.z, r: 0.25, grow: 1.6, life: 1, fade: 0.9 });
    }
    // переигровка не должна оставлять следов: ни рекордов, ни дневного лучшего
    if (!replaying) {
      if (S.bounces > best) {
        best = S.bounces; ghostZ = S.z;
        try { localStorage.setItem(bestKey(), String(best)); localStorage.setItem(bestKey() + "_z", String(ghostZ)); } catch (e) {}
      }
      if (S.bounces > dayBest()) {
        try { localStorage.setItem(dayBestKey(), String(S.bounces)); } catch (e) {}
      }
    }
    paintCard("dead"); paintSeas();
  }

  // овечку подхватило облачко. Ничего не плещет и не бьёт: воздух, а не удар о воду.
  // Круги на воде остаются — вода честно отзывается, — но медленные и широкие,
  // и брызг нет вовсе: брызги делали из этого «керлинг» вместо мягкой посадки.
  function onSheepLanded() {
    rings.push({ x: S.x, z: S.z, r: 0.2, grow: 1.5, life: 1, fade: 0.55 });
    rings.push({ x: S.x, z: S.z, r: 0.08, grow: 2.2, life: 1, fade: 0.8 });
    if (OPT.echo) {
      addRing(S.x, S.z, S.t, P.ringAmp * 1.1, 2.2, 1.1, 5);
      // прощальная волна по всему морю: медленная и низкая
      addRing(S.x, S.z, S.t, P.ringAmp * 1.7, 1.7, 1.8, 9);
    }
    catchPuff();
  }

  function bounce() {
    var clean = !!S.pendingPerfect;
    // мягкое насыщение у потолка вместо линейного гашения: приход энергии
    // доступен на всём рабочем диапазоне, а не только «умирающему» камню
    var sat = Math.max(0.12, 1 - Math.pow(Math.max(0, S.hop) / P.ceiling, 3));
    var sp = Math.sqrt(S.vz * S.vz + S.vx * S.vx) || 1;
    // склон включает и валы моря, и собственное эхо отскоков (интерференция):
    // прыгнул на восходящий склон своей же волны — вода вернула энергию
    var slope = (waveGradZ(S.x, S.z, S.t) * S.vz + waveGradX(S.x, S.z, S.t) * S.vx) / sp;
    var raw = Math.max(-0.32, Math.min(0.34, slope * P.waveGain));
    var wave = 1 + (raw > 0 ? raw * (0.15 + 0.85 * sat) : raw);

    // угол атаки: крутое падение + встречная стенка вала = камень зарывается.
    // отсюда риск высокого прыжка — он возвращается круче
    // угол атаки = крутизна падения + встречный склон − наклон плоскости камня.
    // автодоворот подтягивает камень к правильному углу; его доля — это сложность мира
    var bare = Math.atan2(Math.abs(S.vy), sp) + Math.atan(Math.max(0, slope));
    var ideal = Math.max(-P.pitchMax * Math.PI / 180, Math.min(P.pitchMax * Math.PI / 180, bare - P.goodAttack * Math.PI / 180));
    var pitchEff = ideal * (0.55 + 0.45 * P.assist);   // прощение угла зависит от моря
    var attack = bare - pitchEff;
    var graze = false;
    if (attack > P.digAngle * Math.PI / 180) {
      // правило честности: идеальный тап всегда спасает. Чистый тап на злом
      // гребне — камень срезает его с потерей силы; грязный — зарывается
      if (clean) {
        graze = true;
        rings.push({ x: S.x, z: S.z, r: 0.2, grow: 2.2, life: 1, fade: 1.1 });
      } else {
        S.y = waveH(S.x, S.z, S.t);
        rings.push({ x: S.x, z: S.z, r: 0.2, grow: 1.4, life: 1, fade: 0.9 });
        // она реально ткнулась в воду — источник есть и здесь
        if (S.srcQ) { picPush(S.srcQ, S.x - S.lx, S.z - S.lz, S.hop, false); S.lx = S.x; S.lz = S.z; }
        die("зарылся");
        return;
      }
    }
    var mod = 1;
    S.pendingPerfect = false;

    S.bounces++;
    if (clean) { S.perfects++; S.combo++; } else { S.combo = 0; }

    var tired = Math.max(0.55, 1 - (P.fatigue / 100) * S.bounces);
    if (graze) mod *= 0.6;

    // ТОЧНОСТЬ касания, не сила: TAP.strength уже инвертирован в noteTapPhysics,
    // поэтому маленькое пятно контакта (кончик пальца) даёт БОЛЬШЕ энергии,
    // а шлепок подушечкой — меньше. Нейтраль 0.35: без датчика множитель ровно 1
    var strength = (typeof S.tapStrength === "number") ? S.tapStrength : 0.35;
    var pushMul = 1 + P.push * (strength - 0.35) * (0.2 + 0.8 * sat);

    // вязкость: низкая дуга не глиссирует и вязнет в воде, высокая скользит даром
    var lowness = Math.max(0, Math.min(1, 1 - S.hop / P.hopRef));
    var visc = 1 - P.viscosity * lowness;

    var prevHop = S.hop;
    S.hop = Math.max(1.15, Math.min(P.ceiling * 1.05, S.hop * (clean ? P.perfectDecay : P.decay) * tired * wave * mod * pushMul * visc));
    S.y = waveH(S.x, S.z, S.t);
    S.vy = S.hop;
    S.vz = S.vz * (1 + P.speedUp / 100);
    S.flash = clean ? 1 : 0.55;

    if (OPT.echo) {
      // короткая рябь — атмосфера; длинная зыбь уходит вперёд почти со скоростью овцы,
      // и когда та разгоняется, она догоняет и переезжает собственную волну
      addRing(S.x, S.z, S.t, P.ringAmp * (clean ? 1.3 : 1), 2.8, 0.5, 3);
      addRing(S.x, S.z, S.t, P.ringAmp * (clean ? 1.15 : 0.85), swellSpeed(), 2.6, 7);
    }

    // картина ночи: касание = источник волны. Ничего из этого не влияет на
    // физику — наблюдатель, поэтому и стоит после всех решений bounce().
    // Энергия берётся ПОСЛЕ отскока: это та, из которой сделан следующий
    // прыжок, и она уже зажата в [1.15, ceiling], то есть дёшево квантуется.
    if (S.srcQ) { picPush(S.srcQ, S.x - S.lx, S.z - S.lz, S.hop, clean); S.lx = S.x; S.lz = S.z; }

    S.squash = clean ? 1 : 0.75;
    S.camKick = clean ? 0.9 : 0.6;
    var gained = S.hop > prevHop * 1.02;
    if (gained) { S.lift = 1; swell(); }
    var big = gained ? 1.5 : 1;
    rings.push({ x: S.x, z: S.z, r: 0.15, grow: (clean ? 3.4 : 2.6) * big, life: 1, fade: clean ? 0.62 : 0.8 });
    rings.push({ x: S.x, z: S.z, r: 0.05, grow: (clean ? 5.2 : 4.0) * big, life: 1, fade: 1.25 });
    for (var i = 0; i < (clean ? 7 : 3); i++) {
      drops.push({ x: S.x + (Math.random() - 0.5) * 0.35, y: S.y + 0.05, z: S.z + (Math.random() - 0.5) * 0.35,
                   vy: 1.4 + Math.random() * 2.2, vx: (Math.random() - 0.5) * 2.4, vz: (Math.random() - 0.5) * 2.4, life: 1 });
    }
    tone(S.bounces - 1, clean, gained ? 1.5 : 1);


    S.armed = false;
    predictContact();
    S.fullInterval = S.interval;
    if (S.hop < 1.3 && !clean) die("выдохся");
  }

  function step(dt) {
    S.t += dt;
    if (S.phase === "fly") {
      S.vy -= P.gravity * dt;
      // плавный набор боковой скорости к цели, заданной последним тапом
      S.vx += ((S.steerTarget || 0) - S.vx) * Math.min(1, dt * P.steerEase);
      // приливное течение: несёт вбок, руль его компенсирует
      var cur = tideDrift();
      S.x += (S.vx + cur) * dt; S.y += S.vy * dt; S.z += S.vz * dt;
      var surf = waveH(S.x, S.z, S.t);
      if (S.y <= surf && S.vy < 0) {
        if (S.armed) bounce();
        else {
          S.y = surf; S.vy = 0; S.sliding = true;
          // глиссада: пока окно не закрылось, камень скользит и оставляет мелкую рябь —
          // видно, что он жив и ждёт тапа, а не завис
          S.slideTick = (S.slideTick || 0) + 1;
          S.vz *= Math.max(0, 1 - dt * 0.9);
          if (S.slideTick % 8 === 0) rings.push({ x: S.x, z: S.z, r: 0.08, grow: 1.4, life: 0.5, fade: 1.8 });
          if (S.slideTick % 5 === 0) drops.push({ x: S.x + 0.1, y: 0.08, z: S.z + 0.3, vx: (Math.random() - 0.5) * 1.5, vy: 1 + Math.random(), vz: 1.5, life: 0.5 });
          if ((S.t - S.nextContact) * 1000 - P.latency > windowMs() * 0.6) die("поздно");
        }
      }
      if (OPT.ghost && best > 0 && ghostZ > 0 && !S.ghostHit && S.z > ghostZ) { S.ghostHit = 1; S.flash = Math.max(S.flash, 0.85); swell(); }
    } else if (S.phase === "dead") {
      S.z += S.vz * dt; S.x += S.vx * dt;
      S.vz *= Math.max(0, 1 - dt * (S.fDamp || 2.2));
      S.vx *= Math.max(0, 1 - dt * (S.fDamp || 2.2));
      if (OPT.sheep) {
        // Всплытие ограничено. Раньше уснувшая овечка поднималась
        // безостановочно, 0.55 единицы в секунду, и через несколько секунд
        // уходила за верх кадра: игрок оставался смотреть на пустую воду.
        // Теперь она мягко всплывает на своё место и там остаётся.
        // Сон идёт ТЕМ ЖЕ путём, что и подхват кругом: овечка доигрывает
        // падение, садится и остаётся лежать. Раньше у сна был свой путь —
        // она всплывала к restY, а облачко под ней не рисовалось вовсе,
        // и через 2.4 с силуэт растворялся. Со стороны это читалось как
        // «уснула и тонет».
        if (!S.landed) {
          // не телепорт к воде, а настоящее падение: доигрывается дуга, потом посадка
          S.vy -= P.gravity * dt * 0.85;
          S.y += S.vy * dt;
          var surfD = waveH(S.x, S.z, S.t);
          if (S.y <= surfD) { S.y = surfD; S.landed = true; S.landAt = S.t; onSheepLanded(); }
        } else {
          S.y = waveH(S.x, S.z, S.t) + 0.03;
        }
      }
      else if (S.y > -1.8) S.y -= dt * ((S.sinkV || 0.5) + Math.max(0, -S.y) * 0.9);
    } else {
      S.z += 1.2 * dt;
      if (OPT.sheep) S.y = waveH(S.x, S.z, S.t) + 0.03;   // ждёт броска, качаясь в круге
    }
    // камера тянется за камнем с отставанием — горизонт остаётся ровным
    S.camX += (S.x - S.camX) * Math.min(1, dt * 3.2);
  }

  function update(dt) {
    if (!S) return;
    S.acc += dt;
    var guard = 0;
    // положение предыдущего шага — для интерполяции кадра между шагами физики
    S.px = S.x; S.py = S.y; S.pz = S.z; S.pcam = S.camX;
    while (S.acc >= STEP && guard < 400) {
      S.px = S.x; S.py = S.y; S.pz = S.z; S.pcam = S.camX;
      step(STEP); S.acc -= STEP; guard++;
    }
    // сглаженные координаты для отрисовки: убирают дрожание в доли шага
    var al = Math.max(0, Math.min(1, S.acc / STEP));
    S.rx = S.px + (S.x - S.px) * al;
    S.ry = S.py + (S.y - S.py) * al;
    S.rz = S.pz + (S.z - S.pz) * al;
    S.rcam = S.pcam + (S.camX - S.pcam) * al;
    // прогноз пересчитывается в полёте (камень сносит вбок), но замирает у самой воды —
    // иначе момент касания уезжал бы из-под пальца и промах никогда не наступал
    // Пересчёт прогноза привязан к ВРЕМЕНИ симуляции, а не к номеру кадра.
    // Раньше стояло `pTick % 3`, то есть раз в три кадра: на экране 120 Гц игра
    // предсказывала вдвое чаще, чем на 60, — поведение зависело от железа,
    // и заход нельзя было переиграть по ленте тапов. 40 мс ≈ прежние три кадра
    // на телефоне и одинаковы везде.
    if (S.phase === "fly" && !S.armed && S.t >= (S.nextPredict || 0)) {
      S.nextPredict = S.t + 0.04;
      var surfNow = waveH(S.x, S.z, S.t);
      if (S.y > surfNow + 0.06 && (S.nextContact - S.t) > 0.16) predictContact();
    }
    if (S.phase === "fly") {
      S.trail.push({ x: S.x, y: S.y, z: S.z });
      if (S.trail.length > 15) S.trail.shift();
    } else if (S.trail.length) {
      S.trail.shift();
    }
    // визуальная скорость отстаёт от физической: поза меняется плавно, а не флипом
    S.vyVis = (S.vyVis === undefined ? S.vy : S.vyVis) + (S.vy - (S.vyVis || 0)) * Math.min(1, dt * 14);
    S.tuckNow = (S.tuckNow === undefined ? 1 : S.tuckNow) + (((S.vy > 0) ? 0.4 : 1) - (S.tuckNow || 1)) * Math.min(1, dt * 12);
    S.squash = Math.max(0, (S.squash || 0) - dt * 6);
    S.camKick = Math.max(0, (S.camKick || 0) - dt * 8);
    S.tapGlint = Math.max(0, (S.tapGlint || 0) - dt * 3.5);
    S.flash = Math.max(0, S.flash - dt * 3.2);
    S.lift = Math.max(0, S.lift - dt * 1.6);
    S.shake = Math.max(0, S.shake - dt * 1.4);

    var i;
    for (i = rings.length - 1; i >= 0; i--) {
      var r = rings[i];
      r.r += r.grow * dt; r.life -= r.fade * dt;
      if (r.life <= 0) rings.splice(i, 1);
    }
    for (i = drops.length - 1; i >= 0; i--) {
      var d = drops[i];
      if (d.b === 2) {
        d.y += d.vy * dt;
        d.vy *= Math.max(0, 1 - dt * 0.4);
        d.life -= dt * 0.65;
        if (d.life <= 0) drops.splice(i, 1);
        continue;
      }
      if (d.b) {
        d.y += d.vy * dt;
        d.life -= dt * 0.8;
        if (d.y >= waveH(d.x, d.z, S.t) || d.life <= 0) drops.splice(i, 1);
        continue;
      }
      d.vy -= P.gravity * dt * 0.9;
      d.x += d.vx * dt; d.y += d.vy * dt; d.z += d.vz * dt;
      d.life -= dt * 1.1;
      if (d.y < -0.3 || d.life <= 0) drops.splice(i, 1);
    }
    var followTarget = (S.phase === "fly") ? FOLLOW : FOLLOW_IDLE;
    followNow += (followTarget - followNow) * Math.min(1, dt * 2.5);
    var camZ = S.z - followNow;
    var camYWant = camBase() + waveH(S.camX, camZ, S.t) * P.camRide;
    camYNow += (camYWant - camYNow) * Math.min(1, dt * 7);
    var curNow = tideDrift();
    for (i = 0; i < sparks.length; i++) {
      sparks[i].x += curNow * dt;
      if (sparks[i].z < camZ + 1) { sparks[i].z = camZ + 150 + Math.random() * 60; sparks[i].x = S.camX + (Math.random() - 0.5) * 70; }
    }
    paintHud();
  }

  // ---- render ----
  function render() {
    if (!S) return;
    var camZ = (S.rz !== undefined ? S.rz : S.z) - followNow, camX = (S.rcam !== undefined ? S.rcam : S.camX);
    // снимок состояния камеры для стенда: позволяет разложить движение картинки
    // на слагаемые — где камера, насколько её тряхнуло, какой горизонт
    PROBE.camZ = camZ; PROBE.camX = camX;
    PROBE.horizon = horizon; PROBE.focal = focal; PROBE.t = S.t; PROBE.acc = S.acc || 0;
    PROBE.bounces = S.bounces; PROBE.camY = camYNow;
    var sx = (S.rx !== undefined ? S.rx : S.x), sy = (S.ry !== undefined ? S.ry : S.y), sz = (S.rz !== undefined ? S.rz : S.z);
    var shakeX = S.shake > 0 ? (Math.random() - 0.5) * S.shake * 14 : 0;
    var shakeY = (S.shake > 0 ? (Math.random() - 0.5) * S.shake * 10 : 0)
      // Просадка камеры на касании УБРАНА. Замер разложил движение картинки
      // на слагаемые: вода в фиксированной точке мира едет гладко, 0.05 пикселя
      // за кадр и на касании, и между ними, а вот камера дёргала всю сцену
      // на 1.83 пикселя ЗА ОДИН КАДР — скачок в сорок шесть раз против фона,
      // дважды в секунду. И это уже после того, как множитель уменьшили с 7
      // до 2.2; изначально было почти шесть пикселей.
      //
      // Дело не в величине, а в том, что дёргалось: море — единственное, по чему
      // игрок читает момент касания, и двигать систему отсчёта именно в этот
      // момент значит мешать ему ровно там, где нужна точность. Удар и так
      // рассказан сжатием овцы, кольцами, вспышкой и звуком — камере в этом
      // рассказе места нет. S.camKick остаётся: он ещё нужен позе героя.
      + 0;
    PROBE.shakeY = shakeY; PROBE.shakeX = shakeX; PROBE.camKick = S.camKick || 0;

    // ДАЛЬНИЙ СЛОЙ. Толчок камеры двигал весь кадр целиком, вместе с луной и звёздами,
    // и от этого луна выглядела приклеенной к воде. Далёкое при сдвиге камеры смещается
    // почти незаметно, поэтому небу достаётся лишь малая доля толчка.
    var SKY_PARALLAX = 0.1;
    ctx.save();
    ctx.translate(shakeX * SKY_PARALLAX, shakeY * SKY_PARALLAX);

    ctx.fillStyle = G.sky; ctx.fillRect(-20, -20, W + 40, horizon + 20);
    ctx.fillStyle = G.water; ctx.fillRect(-20, horizon - 1, W + 40, H - horizon + 40);

    // звёзды
    for (var si = 0; si < STARS.length; si++) {
      var st = STARS[si];
      var sxp = ((st.x * W - camX * 6) % W + W) % W;
      var syp = st.y * horizon * 0.95;
      var tw = 0.45 + 0.55 * Math.abs(Math.sin(S.t * 0.7 + st.p));
      ctx.fillStyle = col("glow", st.m * tw * 0.55);
      var ss = st.m > 0.85 ? 2 : 1;
      ctx.fillRect(sxp, syp, ss, ss);
    }

    // луна и лунная дорожка — будущая «тихая вода», пока просто романтика
    var moonX = W * 0.5 - camX * 10, moonY = horizon * 0.40;
    var lum = 0.35 + 0.65 * moonIllum();
    ctx.save();
    ctx.globalAlpha = lum;
    ctx.translate(moonX, moonY); ctx.scale(moonR * 4.5, moonR * 4.5);
    ctx.fillStyle = G.moonGlow;
    ctx.beginPath(); ctx.arc(0, 0, 1, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.translate(moonX, moonY); ctx.scale(moonR, moonR);
    ctx.fillStyle = G.moonDisc;
    ctx.beginPath(); ctx.arc(0, 0, 1, 0, Math.PI * 2); ctx.fill();
    // кратеры — как в ранней версии, только внутри диска и под тенью фазы
    ctx.fillStyle = PAL.sky[1];
    ctx.globalAlpha = 0.3;
    ctx.beginPath(); ctx.arc(-0.4, -0.28, 0.24, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0.28, 0.3, 0.16, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.2;
    ctx.beginPath(); ctx.arc(0.05, -0.05, 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    // настоящая фаза: тёмный диск наезжает сбоку; в полнолуние уходит совсем
    var mf = moonFrac();
    var sh = Math.cos(mf * Math.PI * 2);   // 1 = новолуние (тень по центру), -1 = полнолуние (тени нет)
    if (sh > -0.985) {
      var dir = mf < 0.5 ? -1 : 1;         // растущая — тень уходит влево, убывающая — вправо
      // серп наклонён по диагонали: компромисс между «стоячей» луной северных
      // широт и «лежащей» тропической — читается естественно отовсюду
      var md = (1 - sh) * 1.05;
      ctx.beginPath(); ctx.arc(0, 0, 1.001, 0, Math.PI * 2); ctx.clip();
      ctx.fillStyle = PAL.sky[0];
      ctx.globalAlpha = 0.92;
      ctx.beginPath(); ctx.arc(dir * md * 0.86, -md * 0.5, 1.02, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    ctx.strokeStyle = "rgba(" + PAL.line + ",0.13)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, horizon); ctx.lineTo(W, horizon); ctx.stroke();

    // лунная дорожка: мягкое пятно света, растянутое к зрителю
    ctx.save();
    ctx.globalAlpha = lum;
    ctx.translate(moonX, horizon);
    ctx.scale(0.5 * H * 0.62, 1.7 * H * 0.62);
    ctx.fillStyle = G.moonPath;
    ctx.beginPath(); ctx.arc(0, 0, 1, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    ctx.restore();   // конец дальнего слоя

    // БЛИЖНИЙ СЛОЙ: вода и всё, что на ней. Сюда толчок камеры приходит целиком —
    // именно близкое и должно вздрагивать от удара.
    ctx.save();
    ctx.translate(shakeX, shakeY);

    // Поверхность: линии глубины, изогнутые валами; восходящий склон светлее.
    //
    // Рябь от касаний рисуется НЕ отдельными кругами поверх воды, а самими
    // этими линиями: там, где проходит кольцо, линия и выгибается, и светлеет.
    // Круг перестаёт быть нарисованным объектом и становится тем, что он есть, —
    // возмущением поверхности. Кольца и так входят в waveH, то есть геометрия
    // была верной всегда; не хватало ровно двух вещей.
    //
    // Первая: линия считается всего по 8–13 точкам поперёк экрана, и на такой
    // сетке рябь смазывается в ничто. Поэтому выборка сгущается вчетверо —
    // но только на тех линиях, рядом с которыми реально есть живое кольцо.
    // Вторая: яркость линии бралась из ОДНОЙ точки по центру, поэтому местное
    // возмущение её не подсвечивало. Теперь поверх базовой линии дорисовываются
    // только те куски, где кольцо есть, с яркостью по его высоте.
    var stepZ = Q.stepZ, cols = Q.cols;
    // Потолок толщины. Ширина линии считается как focal*0.02/dz и у самых
    // ближних линий улетает: при окне 1280×806 это 11 пикселей на базовую
    // и почти 15 на подсвеченную — внизу экрана получались жирные полосы,
    // которые давят на весь кадр. Гребень ряби вообще обязан быть тонким:
    // он тонкий и в жизни, и толщина ему яркости не добавляет.
    // Потолок в CSS-пикселях, а не в долях экрана: CSS-пиксель и задуман как
    // единица примерно одного физического размера на всех устройствах, поэтому
    // линия воды толщиной больше четырёх с половиной выглядит жирной и на
    // iPhone, и на iPad одинаково. Без потолка ближняя линия выходила 11.6 px
    // при ширине экрана 393 — три процента экрана на одну линию.
    var lwCap = 4.5;
    var rippleOn = OPT.ripple && OPT.echo && RW.length;
    var pxs = [], pys = [], rhs = [];
    for (var z = Math.ceil((camZ + 1.2) / stepZ) * stepZ; z < camZ + Q.dist; z += stepZ) {
      var dz = z - camZ;
      var base = Math.max(0, 0.15 - dz * 0.0016);
      if (base <= 0.004) break;
      var halfW = (W / 2) * dz / focal;
      var near = false;
      if (rippleOn) {
        for (var ri = 0; ri < RW.length; ri++) {
          var rr = RW[ri], rage = S.t - rr.t0;
          if (rage <= 0 || rage > rr.life) continue;
          if (Math.abs(z - rr.z) < rr.c * rage + 3 * rr.w) { near = true; break; }
        }
      }
      var nc = near ? cols * 4 : cols;
      ctx.beginPath();
      var lit = 0;
      pxs.length = 0; pys.length = 0; rhs.length = 0;
      for (var c = 0; c <= nc; c++) {
        var wx = camX - halfW + (2 * halfW) * (c / nc);
        var wh = waveH(wx, z, S.t);
        var p = proj(wx, wh, z, camZ, camX);
        if (c === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        if (near) { pxs.push(p.x); pys.push(p.y); rhs.push(ringH(wx, z, S.t, 1.0)); }
        if (c === Math.floor(nc / 2)) lit = Math.max(0, waveGradZ(wx, z, S.t));
      }
      var norm = P.waveAmp > 0 ? 1 / (P.waveAmp * k1() + 0.0001) : 0;
      var lw = Math.max(1, Math.min(lwCap, focal * 0.02 / dz));
      ctx.strokeStyle = col("line", Math.min(0.5, base * (1 + lit * norm * 1.6) * moonLight()));
      ctx.lineWidth = lw;
      ctx.stroke();
      if (!near) continue;
      // подсветка возмущённых кусков: две ступени яркости, чтобы не плодить вызовы
      // порог высокий: подсвечивается гребень кольца, а не вся его окрестность
      var rnorm = 1 / Math.max(0.02, P.ringAmp * 0.55);
      for (var lvl = 0; lvl < 2; lvl++) {
        var thr = lvl ? 0.72 : 0.40;
        ctx.beginPath();
        var open = false, any = false;
        for (var q = 0; q < rhs.length; q++) {
          if (Math.abs(rhs[q]) * rnorm >= thr) {
            if (open) ctx.lineTo(pxs[q], pys[q]);
            else { ctx.moveTo(pxs[q], pys[q]); open = true; }
            any = true;
          } else open = false;
        }
        if (!any) continue;
        ctx.strokeStyle = col("glow", Math.min(0.45, base * moonLight() * (lvl ? 3.0 : 1.5)));
        ctx.lineWidth = Math.min(lw, lwCap * 0.8) * (lvl ? 1.15 : 1);
        ctx.stroke();
      }
    }

    for (var i = 0; i < sparks.length; i++) {
      var s = sparks[i];
      var sp2 = proj(s.x, waveH(s.x, s.z, S.t), s.z, camZ, camX);
      if (sp2.y < horizon || sp2.y > H || sp2.x < -20 || sp2.x > W + 20) continue;
      var sa = Math.max(0, 0.5 - sp2.dz * 0.004) * (0.4 + 0.6 * Math.abs(Math.sin(S.t * 1.4 + s.p * 9)));
      if (sa <= 0.01) continue;
      ctx.fillStyle = col("line", sa * moonLight());
      var sw = Math.max(1, focal * 0.012 / sp2.dz);
      ctx.fillRect(sp2.x - sw / 2, sp2.y, sw, Math.max(1, sw * 0.4));
    }

    if (OPT.ghost && best > 0 && ghostZ > camZ + 1 && ghostZ < camZ + 130) {
      strokeWaterEllipse(S.camX, ghostZ, 1.1, camZ, camX, "rgba(" + PAL.glow + ",0.2)", 1.4);
      strokeWaterEllipse(S.camX, ghostZ, 0.7, camZ, camX, "rgba(" + PAL.glow + ",0.12)", 1);
    }

    // при «ряби по линиям» нарисованные круги почти гасятся: их работу теперь
    // делает сама поверхность, а вместе они читаются как двойное изображение
    // Круги остаются в ПОЛНУЮ силу. Сначала я их приглушал, чтобы не двоилось
    // с рябью в линиях, — но после того, как подсветка стала узкой и пороговой,
    // двоиться нечему, а приглушённый круг забирал у касания щелчок. Замер
    // на iPhone 15 Pro показал это прямо: на девяностой миллисекунде кадр
    // ветки оказался заметно тусклее кадра main именно в точке удара.
    // Разделение остаётся прежним: круг — момент удара, линии — то, что
    // происходит с водой дальше.
    var ringA = 0.5;
    for (i = 0; i < rings.length; i++) {
      var r = rings[i];
      strokeWaterEllipse(r.x, r.z, r.r, camZ, camX, col("glow", Math.max(0, r.life) * ringA), 1.6);
    }

    if (OPT.aim && S.phase === "fly") {
      var tt = S.nextContact - S.t;
      if (tt > 0 && tt < 1.6) {
        var pr = 0.9 * Math.min(1, tt / 0.9);
        var aimA = 0.34 * Math.min(1, tt * 3);
        strokeWaterEllipse(S.aimX, S.aimZ, pr, camZ, camX, "rgba(" + PAL.glow + "," + aimA.toFixed(3) + ")", 1.4);
      }
    }

    if (OPT.mirror && S.phase !== "ready") {
      var surf = waveH(sx, sz, S.t);
      var above = sy - surf;
      if (above > 0.01) {
        var pm = proj(sx, surf - above, sz, camZ, camX);
        if (OPT.sheep) {
          // Настоящее отражение, а не пятнышко. ВАЖНО про ориентацию: овечка нарисована
          // видом сверху-сзади, поэтому голова с ушами — вверху спрайта (дальше от нас),
          // а хвостик внизу (ближе). Вода зеркалит по ВЫСОТЕ, а не по глубине, значит
          // в отражении голова обязана остаться дальней. Переворот спрайта по экранному Y
          // менял местами голову и хвост — овечка в отражении «плыла на нас».
          // Поэтому здесь только сжатие по вертикали (скользящий угол взгляда) и затухание.
          var ra = Math.max(0, 0.42 - above * 0.085);
          if (ra > 0.02) {
            ctx.save();
            ctx.globalAlpha = ra;
            ctx.translate(pm.x, pm.y);
            ctx.scale(1, 0.62);
            ctx.translate(-pm.x, -pm.y);
            drawSheep(pm.x, pm.y, pm.dz);
            ctx.restore();
          }
        } else {
          drawStone(pm.x, pm.y, pm.dz, "rgba(" + PAL.line + "," + Math.max(0, 0.52 - above * 0.1).toFixed(3) + ")", true);
        }
      }
    }

    if (S.flash > 0.01) {
      var pf = proj(sx, waveH(sx, sz, S.t), sz, camZ, camX);
      var rad = Math.max(6, focal * (0.6 + 1.6 * (1 - S.flash)) / pf.dz);
      ctx.save();
      ctx.globalAlpha = S.flash;
      ctx.translate(pf.x, pf.y); ctx.scale(rad, rad);
      ctx.fillStyle = G.flash;
      ctx.beginPath(); ctx.arc(0, 0, 1, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    for (i = 0; i < drops.length; i++) {
      var d = drops[i];
      var pd = proj(d.x, d.y, d.z, camZ, camX);
      if (pd.y < -20 || pd.y > H) continue;
      if (d.b === 2) {
        var sa2 = Math.max(0, Math.min(1, d.life));
        ctx.strokeStyle = "rgba(" + PAL.hot + "," + (sa2 * 0.9).toFixed(3) + ")";
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(pd.x - 6, pd.y); ctx.lineTo(pd.x + 6, pd.y);
        ctx.moveTo(pd.x, pd.y - 6); ctx.lineTo(pd.x, pd.y + 6);
        ctx.stroke();
        ctx.fillStyle = "rgba(" + PAL.hot + "," + sa2.toFixed(3) + ")";
        ctx.beginPath(); ctx.arc(pd.x, pd.y, 2.4, 0, Math.PI * 2); ctx.fill();
        continue;
      }
      ctx.fillStyle = col("hot", Math.max(0, d.life * 0.7));
      var dw = Math.max(1, focal * 0.008 / pd.dz);
      ctx.fillRect(pd.x, pd.y, dw, dw);
    }

    // след полёта: гаснущая нить за камнем, чтобы его было видно в движении
    if (S.trail.length > 2) {
      ctx.lineWidth = 1.5;
      for (var ti = 1; ti < S.trail.length; ti++) {
        var ta = S.trail[ti - 1], tb = S.trail[ti];
        var p1 = proj(ta.x, ta.y, ta.z, camZ, camX);
        var p2 = proj(tb.x, tb.y, tb.z, camZ, camX);
        ctx.strokeStyle = col("glow", 0.35 * ti / S.trail.length);
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
      }
    }
    var ps = proj(sx, sy, sz, camZ, camX);
    S.screenX = ps.x;
    var surfS = waveH(sx, sz, S.t);
    var depth = surfS - sy;
    if (OPT.sheep && (S.phase === "dead" || S.phase === "ready")) {
      {
        // Облачко подстилается в тот же миг, когда игрок промахнулся, и падает
        // вместе с овечкой — а не возникает под ней уже на воде.
        // pop — как быстро оно соткалось (сразу после промаха),
        // settled — как она в него осела (уже после касания воды).
        // Облачко не выныривает из-под воды — оно СГУЩАЕТСЯ на месте: растёт масштабом
        // и проявляется прозрачностью. Вертикального хода почти нет, иначе на позднем
        // промахе (овечка уже на поверхности) оно всплывает сквозь воду снизу.
        // Времена удлинены вдвое-втрое: то, что читалось как «керлинг», было резкостью.
        var popRaw = Math.min(1, Math.max(0, S.t - (S.cloudAt || S.deadAt || 0)) / 0.5);
        var setRaw = S.landed ? Math.min(1, Math.max(0, S.t - (S.landAt || 0)) / 0.7) : 0;
        var pop = 1 - Math.pow(1 - popRaw, 3);        // плавный выход, без рывка
        var settled = 1 - Math.pow(1 - setRaw, 3);
        var bob = Math.sin(setRaw * Math.PI) * 0.07;  // один мягкий вдох, когда приняло вес
        var scale = (0.42 + 0.58 * pop) * (1 + bob);
        var rock = Math.sin(S.t * 1.3) * 0.06 * settled;
        var cw = Math.max(11, focal * CLOUD_W / ps.dz) * scale * P.heroScale;
        var lift = cw * 0.44;
        ctx.save();
        ctx.globalAlpha = Math.min(0.92, 0.1 + 0.82 * pop);
        if (S.rescue === "buoy") drawBuoy(ps.x, ps.y, ps.dz, rock, scale);
        else drawCloud(ps.x, ps.y + lift * 0.26 * (1 - settled), ps.dz, rock, scale);
        ctx.restore();
        if (S.rescue === "buoy") {
          // в круге она сидит, а не лежит на нём: выглядывает над бортом
          drawSheep(ps.x, ps.y - lift * 0.34 * (settled + bob * 0.6), ps.dz, false, true);
        } else {
          drawSheep(ps.x, ps.y - lift * (settled + bob * 0.6), ps.dz, setRaw > 0.85);
          if (setRaw > 0.85) drawZzz(ps.x, ps.y - lift, ps.dz, S.t - (S.landAt || 0));
        }
      }
    } else if (S.phase === "dead" && depth > 0.02) {
      // утопление: силуэт тускнеет и растворяется в толще, лунный свет туда не достаёт
      var da = Math.max(0, 1 - depth * 1.2);
      if (da > 0.02) {
        ctx.globalAlpha = da * 0.75;
        drawStone(ps.x, ps.y, ps.dz, "#16232e", true);
        ctx.globalAlpha = 1;
      }
    } else {
      // мягкое свечение вокруг камня — он всегда виден на чёрной воде
      var armGlow = S.armed ? 1 : 0;
      var haloR = Math.max(10, focal * 0.15 / ps.dz) * (1 + 0.35 * armGlow) * P.heroScale;
      ctx.save();
      // было 1 + 0.5*armGlow — значения больше единицы спецификация отбрасывает,
      // так что взведённый тап никогда не светился ярче. Разводим от 0.7 к 1.0
      ctx.globalAlpha = 0.7 + 0.3 * armGlow;
      ctx.translate(ps.x, ps.y); ctx.scale(haloR, haloR);
      ctx.fillStyle = G.halo;
      ctx.beginPath(); ctx.arc(0, 0, 1, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.restore();
      if (OPT.sheep) drawSheep(ps.x, ps.y, ps.dz);
      else drawStone(ps.x, ps.y, ps.dz, PAL.stone, false);
    }
    // Шевроны направления убраны: они читались как посторонний интерфейс поверх кадра,
    // а у почти прямых тапов всё равно что-то мигало сбоку. Поворот и так виден по самой
    // овечке. Если направление понадобится подсказывать — делать это самим кольцом тапа,
    // а не отдельным значком.
    if (S.tapGlint > 0.01) {
      // кольцо принятого тапа: рождается снаружи силуэта и уходит вширь,
      // чтобы отклик был виден мгновенно, а не тонул в белом теле овцы
      var base = Math.max(10, focal * 0.32 / ps.dz);
      var gr2 = base * (1 + 0.9 * Math.pow(1 - S.tapGlint, 0.6));
      ctx.strokeStyle = "rgba(" + PAL.glow + "," + (Math.pow(S.tapGlint, 1.6) * 0.85).toFixed(3) + ")";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ps.x, ps.y, gr2, 0, Math.PI * 2); ctx.stroke();
    }

    // Серая дуга перед овечкой (вспышка «вода подкинула») убрана: ещё один значок
    // поверх кадра, который ничего не объясняет. Набор высоты и так слышен по звуку
    // и виден по самой дуге полёта. S.lift остаётся — он гасит звук подъёма.

    ctx.restore();   // конец ближнего слоя

    // виньетка — экранная рамка, она не должна ездить вместе с толчком
    ctx.fillStyle = G.vignette; ctx.fillRect(0, 0, W, H);
  }

  function strokeWaterEllipse(x, z, r, camZ, camX, color, lw) {
    var wh = waveH(x, z, S.t);
    var c = proj(x, wh, z, camZ, camX);
    var l = proj(x - r, wh, z, camZ, camX);
    var rr = proj(x + r, wh, z, camZ, camX);
    var n = proj(x, waveH(x, z - r, S.t), z - r, camZ, camX);
    var f = proj(x, waveH(x, z + r, S.t), z + r, camZ, camX);
    var rx = Math.abs(rr.x - l.x) / 2;
    var ry = Math.abs(n.y - f.y) / 2;
    if (rx < 0.4 || !isFinite(rx) || !isFinite(ry)) return;
    var cy = (n.y + f.y) / 2;
    if (cy < horizon - 40 || cy > H + 120) return;
    ctx.strokeStyle = color; ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.ellipse(c.x, cy, rx, Math.max(0.6, ry), 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  // овечка из кружочков: тело-облако, тёмная мордочка с ушами, ножки.
  // в полёте вытягивается и поджимает ноги, у воды приседает
  // calm — поза покоя с открытыми глазами: овца сидит в круге и никуда
  // не летит. Без него она читалась сплющенной: растяжение берётся
  // из вертикальной скорости, а после промаха та отрицательная и большая,
  // так что герой оставался в позе падения уже сидя на воде.
  function drawSheep(sx, sy, dz, sleeping, calm) {
    var w = Math.max(8, focal * 0.24 / dz) * P.heroScale;
    var vv = (S.vyVis === undefined ? (S.vy || 0) : S.vyVis);
    var stretch = (sleeping || calm) ? 0 : Math.max(-0.35, Math.min(0.35, vv * 0.03)) - (S.squash || 0) * 0.5;
    var sq = 1 + stretch, sqx = 1 - stretch * 0.55;
    var ink = "#1a232e", head = "#232d3a", earC = "#33415466";
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(sqx, sleeping ? sq * 0.92 : sq);
    ctx.rotate(sleeping ? Math.sin(S.t * 1.3) * 0.05
      : calm ? Math.sin(S.t * 1.1) * 0.03
      : Math.max(-0.3, Math.min(0.3, -stretch * 0.6)));

    // Ножки рисуются ПОД телом в обеих позах. Прежде во сне они были сложены
    // поверх белого тела — и читались не как лапки, а как сердитые брови:
    // два тёмных изгиба на светлом пятне глаз достраивает в лицо, а раз лица
    // нет, выходила злая маска. Поэтому во сне они просто поджаты: копытца
    // чуть выглядывают из-под тела, как у спящего животного.
    ctx.strokeStyle = ink;
    ctx.lineCap = "round";
    ctx.lineWidth = Math.max(1.2, w * 0.09);
    ctx.beginPath();
    if (sleeping) {
      [-0.30, 0.30].forEach(function (lx) {
        ctx.moveTo(w * lx, w * 0.24);
        ctx.lineTo(w * lx * 0.62, w * 0.40);
      });
    } else {
      var tuck = (S.tuckNow === undefined ? 1 : S.tuckNow);
      [-0.42, -0.15, 0.15, 0.42].forEach(function (lx) {
        ctx.moveTo(w * lx, w * 0.3);
        ctx.lineTo(w * lx - w * 0.03, w * 0.3 + w * 0.3 * tuck);
      });
    }
    ctx.stroke();
    ctx.lineCap = "butt";

    // тело-облако (вид со спины)
    ctx.fillStyle = "rgba(236,240,244,0.96)";
    ctx.beginPath();
    ctx.arc(-w * 0.35, 0, w * 0.42, 0, Math.PI * 2);
    ctx.arc(0, -w * 0.14, w * 0.48, 0, Math.PI * 2);
    ctx.arc(w * 0.35, 0, w * 0.42, 0, Math.PI * 2);
    ctx.arc(0, w * 0.16, w * 0.44, 0, Math.PI * 2);
    ctx.fill();
    // хвостик
    ctx.fillStyle = "rgba(220,226,232,0.9)";
    ctx.beginPath(); ctx.arc(0, w * 0.42, w * 0.11, 0, Math.PI * 2); ctx.fill();

    // Голова. Во сне она склоняется набок — и это единственный способ показать
    // глаз у героя, нарисованного со спины. Закрытый глаз рисуется дугой,
    // а не точкой: точка на таком размере читается как дырка.
    ctx.save();
    ctx.translate(0, -w * 0.52);
    if (sleeping) ctx.rotate(0.34);
    // уши крупнее и светлее затылка, иначе на реальном размере они сливаются
    // с ним в одну тёмную шапку и овца выглядит лысой
    ctx.fillStyle = earC;
    ctx.beginPath();
    ctx.ellipse(-w * 0.38, -w * 0.05, w * 0.22, w * 0.095, -0.6, 0, Math.PI * 2);
    ctx.ellipse(w * 0.38, -w * 0.05, w * 0.22, w * 0.095, 0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = head;
    ctx.beginPath(); ctx.arc(0, 0, w * 0.27, 0, Math.PI * 2); ctx.fill();
    if (sleeping) {
      ctx.strokeStyle = "rgba(226,234,242,0.9)";
      ctx.lineWidth = Math.max(1, w * 0.055);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(-w * 0.10, w * 0.02, w * 0.11, 0.15, Math.PI - 0.15);
      ctx.stroke();
      ctx.lineCap = "butt";
    }
    ctx.restore();
    ctx.restore();
  }

  // спасательный круг: белый тор с красными сегментами, качается на волне
  // облачко: овечка приземляется не в круг, а на маленькое облако —
  // мягкие клубы из окружностей, слегка покачиваются
  // сонные «z» всплывают над овечкой и тают — по одной, с задержкой
  function drawZzz(sx, sy, dz, age) {
    var w = Math.max(9, focal * 0.28 / dz) * P.heroScale;
    ctx.save();
    ctx.textAlign = "center";
    for (var i = 0; i < 3; i++) {
      var t = (age - i * 0.45) % 2.1;
      if (t < 0 || t > 1.6) continue;
      var k = t / 1.6;
      var a = Math.sin(k * Math.PI) * 0.75;
      if (a <= 0.02) continue;
      var size = w * (0.6 + i * 0.22);
      var x = sx + w * 0.5 + Math.sin(k * 2.4 + i) * w * 0.22 + i * w * 0.3;
      var y = sy - w * 0.75 - k * w * 1.9 - i * w * 0.32;
      ctx.globalAlpha = a;
      ctx.fillStyle = "rgba(" + PAL.hot + ",0.95)";
      ctx.font = "400 " + size.toFixed(1) + "px 'Cormorant Garamond', Georgia, serif";
      ctx.fillText("z", x, y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // Облако намеренно крупнее и прозрачнее овечки: раньше плотный белый клуб
  // и белое тело сливались в одно пятно — «облако на облаке». Теперь облако —
  // это дымка вокруг неё, а не второй такой же силуэт.
  var CLOUD_W = 0.34;                              // было 0.28
  // Спасательный круг: финал раннего тапа. Дёрнул раньше времени — овечку
  // подхватывают кругом. Ручки по бортам обязательны: без них кольцо читается
  // как нарисованный овал, а не как предмет, который кто-то бросил.
  function drawBuoy(sx, sy, dz, rock, scale) {
    var w = Math.max(9, focal * 0.26 / dz) * (scale || 1) * P.heroScale;
    var rx = w * 0.78, ry = w * 0.35, lw = w * 0.28;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(rock);
    // мягкий подсвет под кругом — он на воде, а не в воздухе
    var gl = ctx.createRadialGradient(0, 0, 0, 0, 0, rx * 1.7);
    gl.addColorStop(0, "rgba(214,230,244,0.13)");
    gl.addColorStop(1, "rgba(214,230,244,0)");
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.ellipse(0, 0, rx * 1.7, ry * 1.7, 0, 0, Math.PI * 2); ctx.fill();
    // ручки: четыре верёвочных хвата снаружи борта, по диагоналям
    ctx.strokeStyle = "rgba(226,210,180,0.85)";
    ctx.lineWidth = Math.max(1, w * 0.05);
    for (var h = 0; h < 4; h++) {
      var a = Math.PI / 4 + h * Math.PI / 2;
      var cx = Math.cos(a) * rx, cy = Math.sin(a) * ry;
      ctx.beginPath();
      ctx.ellipse(cx * 1.12, cy * 1.12, w * 0.13, w * 0.09, a, 0, Math.PI * 2);
      ctx.stroke();
    }
    // сам круг: белый борт и четыре красных сектора
    ctx.lineWidth = lw;
    ctx.lineCap = "butt";
    ctx.strokeStyle = "#e2e7ec";
    ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = "#c2635a";
    for (var i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.ellipse(0, 0, rx, ry, 0, i * Math.PI / 2 - 0.3, i * Math.PI / 2 + 0.3);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawCloud(sx, sy, dz, rock, scale) {
    var w = Math.max(11, focal * CLOUD_W / dz) * (scale || 1) * P.heroScale;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(rock * 0.4);
    // мягкое свечение под облаком — оно как будто светится изнутри
    var gl = ctx.createRadialGradient(0, 0, 0, 0, 0, w * 1.3);
    gl.addColorStop(0, "rgba(214,230,244,0.17)");
    gl.addColorStop(1, "rgba(214,230,244,0)");
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(0, 0, w * 1.3, 0, Math.PI * 2); ctx.fill();
    // сами клубы — полупрозрачные, слегка холоднее тела овечки
    ctx.fillStyle = "rgba(214,229,243,0.60)";
    ctx.beginPath();
    ctx.arc(-w * 0.54, w * 0.06, w * 0.31, 0, Math.PI * 2);
    ctx.arc(-w * 0.21, -w * 0.1, w * 0.39, 0, Math.PI * 2);
    ctx.arc(w * 0.19, -w * 0.14, w * 0.35, 0, Math.PI * 2);
    ctx.arc(w * 0.52, w * 0.04, w * 0.29, 0, Math.PI * 2);
    ctx.arc(0, w * 0.14, w * 0.37, 0, Math.PI * 2);
    ctx.fill();
    // тень снизу — облако лежит на воде, а не висит
    ctx.fillStyle = "rgba(150,178,204,0.16)";
    ctx.beginPath();
    ctx.ellipse(0, w * 0.32, w * 0.74, w * 0.12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawStone(sx, sy, dz, color, flat) {
    var w = Math.max(3.2, focal * (flat ? 0.07 : 0.1) / dz) * P.heroScale;
    var h = Math.max(1.6, w * 0.46);
    var rot = flat ? 0 : Math.max(-0.4, Math.min(0.4, (S.vx || 0) * 0.05));
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(sx, sy, w, h, rot, 0, Math.PI * 2);
    ctx.fill();
    if (!flat) {
      // лунный ободок: камень читается силуэтом со светящейся кромкой
      ctx.strokeStyle = "rgba(" + PAL.glow + ",0.8)";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.ellipse(sx, sy, w, h, rot, 0, Math.PI * 2);
      ctx.stroke();
    }
    if (!flat) {
      ctx.fillStyle = "rgba(150,200,220,0.35)";
      ctx.beginPath();
      ctx.ellipse(sx - w * 0.18, sy - h * 0.34, w * 0.5, h * 0.32, -0.3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  var last = 0, ftAcc = 0, ftN = 0, fitTick = 0;
  function frame(ts) {
    if (!last) last = ts;
    lastFrameTs = ts;          // к этому моменту относится S.t + S.acc после update()
    if (++fitTick % 30 === 0) {
      var rr = cv.getBoundingClientRect();
      if (Math.abs(rr.width - W) > 1 || Math.abs(rr.height - H) > 1) resize();
    }
    var dt = Math.min((ts - last) / 1000, 0.05);
    last = ts;
    // слежение за кадром: не тянем — тихо снижаем детализацию
    if (S && S.phase === "fly" && !panel.classList.contains("open") &&
        !document.getElementById("night").classList.contains("open") &&
        document.visibilityState === "visible") {
      ftAcc += dt; ftN++;
    } else { ftAcc = 0; ftN = 0; }
    if (ftN >= 90) {
      var avg = ftAcc / ftN;
      ftAcc = 0; ftN = 0;
      if (avg > 0.024 && tier < TIERS.length - 1) {
        tier++;
        Q = TIERS[tier];
        resize();
        seedSparks(S ? S.z - 20 : -20);
      }
    }
    // во время переигровки часы крутит стенд, а не кадры — иначе два источника
    // времени тянули бы симуляцию каждый в свою сторону
    if (!replaying) { update(dt); render(); }
    requestAnimationFrame(frame);
  }

  // ---- стенд переигровки ----
  // Заход полностью описывается тройкой «море + дата + лента тапов»: вода
  // детерминирована календарным днём, шаг физики фиксирован, а лента задаёт весь ввод.
  // Ничего случайного в физику не входит — оставшиеся Math.random сидят в брызгах,
  // бликах, звуке и тряске камеры.
  var replaying = false;

  function currentTape() {
    if (!S || !S.tape) return null;
    // Снимок ВСЕХ настроек обязателен. Их двигают три силы: ползунки игрока,
    // профиль моря и автокалибровка, которая правит компенсацию задержки между
    // заходами. Без снимка переигровка судит ленту по другим числам — первая
    // же проверка это и показала: 29 отскоков в оригинале против 19 при
    // переигровке, потому что фильтр успел сдвинуть latency.
    var p = {};
    Object.keys(P).forEach(function (k) { p[k] = P[k]; });
    return { sea: sea.id, date: todayKey(), p: p, taps: S.tape.slice(), bounces: S.bounces, reason: S.reason };
  }

  // Прогон вне реального времени: часы двигает этот цикл, а не кадры.
  // Тот же update(), тот же applyTap() — то есть проверяется именно игра,
  // а не её отдельная копия, которая может разойтись с оригиналом.
  function replayTape(tape) {
    if (!tape || !tape.taps) return null;
    if (tape.date && tape.date !== todayKey()) {
      return { error: "лента с другой даты: " + tape.date + ", сегодня " + todayKey() };
    }
    replaying = true;
    var saved = {};
    Object.keys(P).forEach(function (k) { saved[k] = P[k]; });
    try {
      for (var i = 0; i < SEAS.length; i++) if (SEAS[i].id === tape.sea) applySea(SEAS[i]);
      // числа ленты применяются ПОСЛЕ applySea: он сам переписывает часть P
      // профилем моря и пользовательскими правками
      if (tape.p) Object.keys(tape.p).forEach(function (k) { if (k in P) P[k] = tape.p[k]; });
      newRun();
      launch(0);
      var taps = tape.taps, k = 0, guard = 0;
      while (S.phase === "fly" && guard++ < 500000) {
        // ленты старого формата несут одно время — тогда оба совпадают
        var target = k < taps.length ? (typeof taps[k].st === "number" ? taps[k].st : taps[k].t) : Infinity;
        var now = S.t + (S.acc || 0);
        // судить надо по времени ИЗ ЛЕНТЫ, а не по времени цикла: шаг физики
        // может перескочить цель на доли миллисекунды, и на волнении этого
        // хватает, чтобы касание перестало быть «чистым» — дальше расходится
        // вся энергетическая дорожка захода
        if (now >= target) {
          S.tapSimT = target;
          applyTap(typeof taps[k].st === "number" ? taps[k].t : target, taps[k].rel, taps[k].s);
          k++; continue;
        }
        var dt = target === Infinity ? STEP : Math.min(STEP, target - now);
        update(dt > 0 ? dt : STEP);
      }
      return { bounces: S.bounces, perfects: S.perfects, reason: S.reason, tapsUsed: k, steps: guard };
    } finally {
      Object.keys(saved).forEach(function (k) { P[k] = saved[k]; });
      replaying = false;
    }
  }

  // НЕ мёртвый код, хотя из самой игры сюда никто не обращается. Это стенд:
  // им гоняют ботов при проверке правок (тайминг, руль, ритм двух морей), и в
  // ../DECISION.md он назван позвоночником ИИ-итераций — его надо достраивать,
  // а не удалять. Чистка от 21.08.2026 предлагала снести его как недостижимый;
  // предложение отклонено осознанно. Из него убрана только idealPitch —
  // она дословно повторяла расчёт из bounce().
  window.__skip = {
    state: function () { return S; },
    params: P, opts: OPT, seas: SEAS,
    setSea: function (id) { for (var i = 0; i < SEAS.length; i++) if (SEAS[i].id === id) applySea(SEAS[i]); },
    setStrength: function (v) { TAP.live = true; TAP.strength = v; },
    tapInfo: function () { return { live: TAP.live, src: TAP.src, strength: TAP.strength }; },
    tap: function () {
      if (S && S.phase === "ready") { launch(0); return; }
      beginTap(W / 2, H / 2);
    },
    // тап со смещением: -1 — у левого края, 0 — по центру (прямо), +1 — у правого.
    // единственный способ проверить руль ботом, раз наклона больше нет
    tapAt: function (rel) {
      var r = Math.max(-1, Math.min(1, rel || 0));
      if (S && S.phase === "ready") { launch(0); return; }
      beginTap(W / 2 + r * W / 2, H / 2);
    },
    throwDir: function (d) { if (S && S.phase === "ready") launch((d || 0) * P.aimSpread); },
    // замер поправки на время события: средняя и число проб с момента загрузки
    tape: function () { return currentTape(); },
    replay: function (t) { return replayTape(t); },
    // прогнать ленту N раз и убедиться, что счёт совпадает каждый раз
    verifyTape: function (t, n) {
      var runs = [], i;
      for (i = 0; i < (n || 3); i++) runs.push(replayTape(t));
      var b = runs.map(function (r) { return r && r.bounces; });
      return { ожидалось: t && t.bounces, получено: b, совпало: b.every(function (v) { return v === (t && t.bounces); }) };
    },
    tapShiftStats: function () {
      return { n: tapShiftN, avgMs: tapShiftN ? tapShiftSum / tapShiftN : 0, lastMs: S ? S.lastShift : null };
    },
    windowMs: function () { return windowMs(); },
    ringCap: function (n) { if (n) RW_MAX = n; return RW_MAX; },
    probe: function () { return PROBE; },
    waveAt: function (x, z, t) { return waveH(x, z, t); },
    reset: function () { newRun(); },

    // ── стенд картины ночи ───────────────────────────────────────────────
    night: function () { return picNightLoad(); },
    tapeOf: function (rec) { return picTapeDec(rec && rec.t); },
    // Рисование героя в произвольный холст: без этого вид овцы приходится
    // проверять, играя заход и ловя момент, а это медленно и неточно.
    // Подменяются ровно три вещи, от которых зависят рисовальщики: холст,
    // состояние захода (из него читается поза) и фокус (из него — размер).
    drawInto: function (g, kind, x, y, dz, opts) {
      var o = opts || {};
      var savedCtx = ctx, savedS = S, savedFocal = focal;
      focal = o.focal || 699;
      ctx = g;
      S = { t: o.t || 0, vy: 0, vyVis: o.vyVis || 0, squash: o.squash || 0,
            tuckNow: o.tuck === undefined ? 1 : o.tuck };
      try {
        if (kind === "sheep") drawSheep(x, y, dz, !!o.sleeping);
        else if (kind === "buoy") drawBuoy(x, y, dz, o.rock || 0, o.scale || 1);
        else if (kind === "cloud") drawCloud(x, y, dz, o.rock || 0, o.scale || 1);
        else if (kind === "zzz") drawZzz(x, y, dz, o.age || 0.4);
      } finally { ctx = savedCtx; S = savedS; focal = savedFocal; }
    },
    gallery: function () { return picGalLoad(); },
    hop: function () { return { n: HD.n, bins: HD.bins.slice(), src: HD.src }; },
    // Ночь целиком, прогнанная вне реального времени: та же update(), тот же
    // applyTap(), то есть физика настоящая, просто часы двигает цикл.
    // В stats и журнал не пишет (replaying), калибровку не трогает —
    // нужна только лента источников.
    simNight: function (runs, jitterMs, maxB) {
      var n = runs || 12, jit = (jitterMs === undefined ? 22 : jitterMs) / 1000;
      var cap = maxB || 140;   // ровный бот бессмертен — без потолка прогон не кончается
      var savedAuto = OPT.autocal, savedP = {}, out = { v: 1, k: todayKey(), sea: sea.id, runs: [], cut: 0 };
      Object.keys(P).forEach(function (k) { savedP[k] = P[k]; });
      OPT.autocal = false; replaying = true;
      try {
        for (var r = 0; r < n; r++) {
          newRun(); launch(0);
          var guard = 0;
          while (S.phase === "fly" && guard++ < 200000 && S.bounces < cap) {
            var now = S.t + (S.acc || 0);
            // err = (now - nextContact)*1000 - P.latency, поэтому ровно в ноль
            // бот попадает, тапая ПОЗЖЕ касания на компенсацию, а не раньше
            var target = S.nextContact + P.latency / 1000 + (Math.random() - 0.5) * 2 * jit;
            if (!S.armed && now >= target) { applyTap(now, 0, 0.35); continue; }
            update(STEP);
          }
          if (S.srcQ && S.srcQ.length) out.runs.push({ s: sea.id, o: 0, b: S.bounces, p: b64enc(S.srcQ) });
        }
      } finally {
        Object.keys(savedP).forEach(function (k) { P[k] = savedP[k]; });
        OPT.autocal = savedAuto; replaying = false;
        newRun();
      }
      return out;
    },
    // Рисует ночь и отдаёт dataURL. Ничего не сохраняет.
    picture: function (night, opts) {
      return new Promise(function (res) {
        buildPicture(night || picNightLoad() || { runs: [] }, opts || null, function (cv, info) {
          info.url = cv.toDataURL("image/png");
          res(info);
        });
      });
    },
    clearBest: function () {
      SEAS.forEach(function (s) { try { localStorage.removeItem("skip_best_" + s.id); localStorage.removeItem("skip_best_" + s.id + "_z"); } catch (e) {} });
      best = 0; ghostZ = 0;
    }
  };

  resize();
  applySea(sea);
  requestAnimationFrame(frame);
})();
</script>
